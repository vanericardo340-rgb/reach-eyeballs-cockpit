<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reach Eyeballs Cockpit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iIzZjNGZlMCIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiNlMDg4M2UiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjkiIGZpbGw9InVybCgjZykiLz4KICA8dGV4dCB4PSIxNiIgeT0iMjEuNSIgZm9udC1mYW1pbHk9Ii1hcHBsZS1zeXN0ZW0sSGVsdmV0aWNhLEFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlJFPC90ZXh0Pgo8L3N2Zz4K" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#ffffff; --bg-elevated:#ffffff; --surface:#f4f2ed; --surface-2:#ebe8e1;
    --border:#e7e4db; --border-soft:#eeece4;
    --text:#17161f; --text-dim:#57565f; --text-faint:#8f8d94;
    --accent:#6c4fe0; --accent-strong:#5b3fd1; --accent-soft:rgba(108,79,224,.10);
    --accent2:#e0883e; --accent2-soft:rgba(224,136,62,.12);
    --good:#1a9d6c; --good-soft:rgba(26,157,108,.10);
    --bad:#d8433a; --bad-soft:rgba(216,67,58,.09);
    --warn:#c97a1f; --warn-soft:rgba(224,136,62,.14);
    --radius:16px; --radius-sm:10px;
    --shadow: 0 1px 2px rgba(23,22,31,.04), 0 10px 26px -16px rgba(23,22,31,.16);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  svg{ width:16px; height:16px; display:inline-block; vertical-align:middle; flex-shrink:0; }
  .badge svg{ width:10px; height:10px; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:13.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1,"cv11" 1;
  }
  .tnum{ font-variant-numeric:tabular-nums; }
  h1,h2,h3{ margin:0; font-weight:600; text-wrap:balance; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent-soft); }
  input,select,textarea{
    font-family:inherit; font-size:13px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; outline:none;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  button{ cursor:pointer; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track{ background:transparent; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:238px; flex-shrink:0; background:var(--bg-elevated); border-right:1px solid var(--border);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:20px 18px 16px; }
  .brand-mark{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px;
  }
  .brand-name{ font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
  .brand-sub{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:1px; }
  nav.navlist{ padding:8px 12px; display:flex; flex-direction:column; gap:2px; }
  .navitem{
    display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
    color:var(--text-dim); background:transparent; border:1px solid transparent; text-align:left; width:100%;
  }
  .nav-ic{ width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nav-ic svg{ width:15px; height:15px; }
  .navitem .t{ display:flex; flex-direction:column; }
  .navitem .t b{ font-size:13px; font-weight:600; color:inherit; }
  .navitem .t span{ font-size:10.5px; color:var(--text-faint); }
  .navitem:hover{ background:var(--surface); color:var(--text); }
  .navitem.active{ background:var(--accent-soft); color:var(--text); border-color:rgba(108,79,224,.28); }
  .navitem .badge-dot{
    margin-left:auto; min-width:17px; height:17px; padding:0 5px; border-radius:20px; background:var(--bad);
    color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .sidebar-foot{ margin-top:auto; padding:14px 16px; border-top:1px solid var(--border); }
  .user-row{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .user-avatar{
    width:26px; height:26px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:var(--text-dim);
  }
  .user-email{ font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .storage-note{ font-size:10.5px; color:var(--text-faint); line-height:1.5; }
  .storage-note button{ background:none; border:none; color:var(--accent-strong); padding:0; font-size:10.5px; text-decoration:underline; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    padding:18px 30px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;
    align-items:flex-start; gap:16px; flex-wrap:wrap; background:linear-gradient(180deg,var(--bg-elevated),var(--bg));
  }
  .topbar h1{ font-size:19px; letter-spacing:-.01em; }
  .topbar .sub{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .content{ padding:22px 30px 70px; max-width:1360px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:8px 13px; border-radius:9px; font-size:12.5px; font-weight:600;
  }
  .btn:hover{ background:var(--surface); border-color:#31353f; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn.ghost:hover{ background:var(--surface); color:var(--text); }
  .btn.danger{ color:var(--bad); }
  .btn.sm{ padding:5px 9px; font-size:11.5px; }
  .btn svg{ width:14px; height:14px; }

  .seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; gap:1px; }
  .seg button{ background:transparent; border:none; color:var(--text-dim); font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:7px; }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  .section-label{
    font-size:12px; color:var(--text-faint); margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .section-label b{ color:var(--text-dim); font-weight:600; }

  /* ---------- Cards / grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .grid.cols-5{ grid-template-columns:repeat(5,1fr); gap:8px; }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:1080px){ .grid,.grid.cols-4{ grid-template-columns:repeat(2,1fr); } .grid.cols-5{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px){ .grid,.grid.cols-4,.grid.cols-2,.grid.cols-5{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 17px; position:relative; overflow:hidden;
  }
  .card.stat{ display:flex; flex-direction:column; gap:6px; }
  .card.stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; display:flex; align-items:center; gap:7px; }
  .card.stat .value-row{ display:flex; align-items:baseline; gap:9px; margin-top:1px; }
  .card.stat .value{ font-size:27px; font-weight:700; letter-spacing:-.02em; }
  .card.stat .caption{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .card.stat .target-line{ font-size:10.5px; color:var(--text-faint); margin-top:6px; padding-top:8px; border-top:1px dashed var(--border-soft); }
  .card.stat.attn{ border-color:rgba(216,67,58,.32); background:linear-gradient(180deg,rgba(216,67,58,.06),var(--surface)); }
  .card.stat.rate{
    padding:11px 13px; gap:3px; border-color:transparent; color:#fff;
    background:linear-gradient(155deg,#5A5FD9,#4A47C4);
    box-shadow:0 1px 2px rgba(23,22,31,.04), 0 8px 16px -12px rgba(23,22,31,.3);
  }
  .card.stat.rate .label{ font-size:9.5px; color:rgba(255,255,255,.72); gap:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.stat.rate .value{ font-size:19px; color:#fff; }
  .card.stat.rate .value-row{ margin-top:0; }
  .card.stat.warmth{ border-left:3px solid var(--accent); }
  .card.stat.hero{
    border-color:transparent;
    box-shadow:0 1px 2px rgba(23,22,31,.04), 0 12px 22px -14px rgba(23,22,31,.32);
  }
  .card.stat.hero .label{ color:rgba(255,255,255,.74); }
  .card.stat.hero .value{ color:#fff; }
  .card.stat.hero .caption{ color:rgba(255,255,255,.7); }
  .card.stat.hero .cell-muted{ color:rgba(255,255,255,.62); }
  .card.stat.hero .target-line{ color:rgba(255,255,255,.6); border-top-color:rgba(255,255,255,.22); }
  /* Rotating purple/plum/orange family so a grid of hero cards doesn't read as one flat block */
  .card.stat.hero:nth-child(6n+1){ background:linear-gradient(155deg,#7A63E8,#5B3FD1); }
  .card.stat.hero:nth-child(6n+2){ background:linear-gradient(155deg,#9D7CF2,#7458DE); }
  .card.stat.hero:nth-child(6n+3){ background:linear-gradient(155deg,#E39A56,#C9701F); }
  .card.stat.hero:nth-child(6n+4){ background:linear-gradient(155deg,#A85BC7,#82399F); }
  .card.stat.hero:nth-child(6n+5){ background:linear-gradient(155deg,#6E6BDE,#4A47C4); }
  .card.stat.hero:nth-child(6n+6){ background:linear-gradient(155deg,#C2679A,#9C4677); }
  /* Outcome/closing metrics get their own green family, overriding the rotation above */
  .card.stat.hero.hero-g1{ background:linear-gradient(155deg,#4FC9A6,#2FA687); }
  .card.stat.hero.hero-g2{ background:linear-gradient(155deg,#34B674,#1F8F57); }
  .card.stat.hero.hero-g3{ background:linear-gradient(155deg,#7CB86B,#5B9650); }
  .card.stat.hero.hero-g4{ background:linear-gradient(155deg,#2E9E5B,#1D7A44); }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2.5px 7px; border-radius:20px; }
  .badge.good{ background:var(--good-soft); color:var(--good); }
  .badge.bad{ background:var(--bad-soft); color:var(--bad); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .delta{ font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:2px; }
  .delta.up{ color:var(--good); } .delta.down{ color:var(--bad); } .delta.flat{ color:var(--text-faint); }

  .spark{ position:absolute; right:14px; top:14px; opacity:.9; }

  /* ---------- Panels (funnel, table, chart containers) ---------- */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 19px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-head h3{ font-size:13.5px; }
  .panel-head .sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .panel-row{ display:grid; grid-template-columns:1.1fr .9fr; gap:12px; margin-bottom:12px; align-items:start; }
  @media (max-width:940px){ .panel-row{ grid-template-columns:1fr; } }

  .funnel-row{ display:grid; grid-template-columns:110px 1fr 60px 46px; align-items:center; gap:10px; padding:6px 0; font-size:12px; }
  .funnel-row .fname{ color:var(--text-dim); }
  .funnel-track{ height:9px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .funnel-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
  .funnel-row .fcount{ text-align:right; font-weight:700; }
  .funnel-row .fpct{ text-align:right; color:var(--text-faint); font-size:11px; }

  .insight-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
  @media (max-width:940px){ .insight-row{ grid-template-columns:1fr; } }
  .insight{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:11px; padding:11px 13px; font-size:11.5px; color:var(--text-dim); }
  .insight b{ color:var(--text); display:block; font-size:12.5px; margin-bottom:2px; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
  thead th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
    font-weight:700; padding:0 10px 9px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num,th.num{ text-align:right; }
  .row-actions{ display:flex; gap:4px; justify-content:flex-end; }
  .icon-btn{ background:transparent; border:none; color:var(--text-faint); padding:4px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }
  .icon-btn svg{ width:14px; height:14px; }
  .pill{ font-size:10.5px; font-weight:700; padding:2.5px 8px; border-radius:20px; display:inline-block; text-transform:capitalize; }
  .pill.active{ background:var(--good-soft); color:var(--good); }
  .pill.paused{ background:var(--warn-soft); color:var(--warn); }
  .pill.churned{ background:var(--bad-soft); color:var(--bad); }
  .cell-muted{ color:var(--text-faint); }
  .col-total{ background:var(--accent-soft) !important; }
  thead th.col-total{ color:var(--accent-strong); }
  tr.row-total{ background:var(--accent-soft) !important; }
  tr.row-total td{ font-weight:700; }
  .empty-row td{ text-align:center; color:var(--text-faint); padding:34px 10px; }

  /* ---------- Empty state ---------- */
  .empty-state{ text-align:center; padding:46px 20px; color:var(--text-faint); }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }
  .empty-state h4{ color:var(--text-dim); font-size:13.5px; margin-bottom:4px; }
  .empty-state p{ font-size:12px; margin:0 auto 14px; max-width:320px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(5,6,9,.6); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -20px rgba(23,22,31,.28); }
  .modal-head{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg-elevated); }
  .modal-head h3{ font-size:15px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-grid.one{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .field input,.field select,.field textarea{ width:100%; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-span2{ grid-column:1 / -1; }

  /* ---------- Chart wraps ---------- */
  .chart-wrap{ padding-top:4px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-faint); margin-bottom:8px; }
  .legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }

  /* ---------- Today alert cards ---------- */
  .attn-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .attn-card{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; transition:transform .12s,box-shadow .12s; }
  .attn-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .attn-card .num{ font-size:32px; font-weight:800; }
  .attn-card.warn{ background:linear-gradient(180deg,var(--bad-soft),var(--surface) 55%); border-left-color:var(--bad); }
  .attn-card.warn .num{ color:var(--bad); }
  .attn-card .title{ font-size:13px; font-weight:600; margin-top:4px; }
  .attn-card .desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .attn-card.ok{ background:linear-gradient(180deg,var(--good-soft),var(--surface) 55%); border-left-color:var(--good); }
  .attn-card.ok .num{ color:var(--good); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:10px 16px; border-radius:10px; font-size:12.5px; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ---------- B2B month/dashboard tabs ---------- */
  .b2b-tabbar{ display:flex; gap:4px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .b2b-tab{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600; }
  .b2b-tab:hover{ background:var(--surface); color:var(--text); }
  .b2b-tab.active{ background:var(--accent-soft); color:var(--accent-strong); border-color:rgba(108,79,224,.3); }
  .b2b-tab svg{ width:13px; height:13px; }
  .tab-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); display:inline-block; margin-left:6px; vertical-align:middle; }

  /* ---------- Ads Acquisition ---------- */
  .aa-filterbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border-soft); }
  .aa-filterbar select{ font-size:11.5px; padding:6px 9px; }
  .aa-search{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:0 9px; }
  .aa-search svg{ width:14px; height:14px; color:var(--text-faint); flex-shrink:0; }
  .aa-search input{ border:none; background:transparent; padding:7px 0; font-size:12px; width:160px; }
  .aa-search input:focus{ box-shadow:none; }
  .aa-inline-input{ width:84px; text-align:right; padding:5px 7px; font-size:12px; background:var(--surface-2); }
  .aa-inline-input:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- Daily workflow ---------- */
  .wf-quicklinks{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .wf-banner{ font-size:11.5px; background:var(--accent2-soft); color:var(--accent2); border:1px solid rgba(224,136,62,.3); border-radius:9px; padding:8px 12px; display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .wf-check-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .wf-check-row:last-child{ border-bottom:none; }
  .wf-check-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--good); cursor:pointer; flex-shrink:0; }

async function loadArrayTable(table, fields){
  const { data, error } = await sb.from(table).select("*");
  if(error){ console.error("load failed:", table, error); return []; }
  return (data||[]).map(r=>fromRow(r, fields));
}
async function syncArrayTable(table, rows, fields){
  try{
    const { data: existing } = await sb.from(table).select("id");
    const keepIds = new Set(rows.map(r=>r.id));
    const toDelete = (existing||[]).map(r=>r.id).filter(id=>!keepIds.has(id));
    if(toDelete.length) await sb.from(table).delete().in("id", toDelete);
    if(rows.length) await sb.from(table).upsert(rows.map(r=>toRow(r, fields)), { onConflict:"id" });
  }catch(e){ console.error("sync failed:", table, e); }
}

  const { data, error } = await sb.from("ads_acq_monthly").select("*");

  (data||[]).forEach(r=>{ out[r.month_key] = fromRow(r, F_AAMONTHLY); });
  return out;
}
async function syncMonthlyTable(dict){
  try{
    const keys = Object.keys(dict);

    const noteRows = [];
    Object.entries(workflow.notes).forEach(([k,list])=>{
      const [date,section,type] = k.split("|");
      (list||[]).forEach((n,i)=> noteRows.push({ date, section, type, text:n.text, done:!!n.done, sort_order:i }));

    const reportRows = Object.entries(workflow.reports).map(([date,r])=>({ date, cold_calls:r.coldCalls||0, old_leads:r.oldLeads||0, meetings:r.meetings||0, revenue:r.revenue||0, notes:r.notes||"" }));

      sb.from("workflow_lead_calls").delete().neq("section",""),

    await Promise.all([
      checkRows.length ? sb.from("workflow_checks").insert(checkRows) : null,
      noteRows.length ? sb.from("workflow_notes").insert(noteRows) : null,
      reportRows.length ? sb.from("workflow_reports").insert(reportRows) : null,

/* ============================= GOOGLE SHEET IMPORT =============================
   The sheets are shared as "anyone with the link can view", so the dashboard
   fetches them live (as CSV) straight from the browser on every load — no
   manual sync needed. The arrays below are a fallback snapshot used only if
   the live fetch fails (offline, sheet re-privated, etc). Entries you edit by
   hand in the dashboard are flagged fromSheet:false so a sync never overwrites
   your manual edits. */
function parseCSV(text){
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',') { row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseSheetDateDMY(s){
  const m = (s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}
function parseSheetNum(s){
  s = (s||"").toString().replace(/,/g,"").trim();
  return s===""? null : (isNaN(Number(s))? null : Number(s));
}
function findSheetHeader(rows, requiredCols){
  for(let r=0;r<rows.length;r++){
    const norm = rows[r].map(c=>c.trim().toUpperCase());
    if(requiredCols.every(rc=>norm.includes(rc))){
      const idx = {}; requiredCols.forEach(rc=>{ idx[rc] = norm.indexOf(rc); });
      return { rowIdx:r, idx };
    }
  }
  return null;
}
async function fetchSheetCSVRows(sourceUrl, requiredCols){
  const idM = sourceUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
  const gidM = sourceUrl.match(/gid=(\d+)/);
  if(!idM) throw new Error("bad sheet url");
  const csvUrl = `https://docs.google.com/spreadsheets/d/${idM[1]}/export?format=csv${gidM?`&gid=${gidM[1]}`:""}`;
  const res = await fetch(csvUrl, { cache:"no-store" });
  if(!res.ok) throw new Error("sheet fetch failed: "+res.status);
  const rows = parseCSV(await res.text());
  const head = findSheetHeader(rows, requiredCols);
  if(!head) throw new Error("header row not found");
  return { rows, ...head };
}

/* ============================= UTILS ============================= */
function fmtMoney(n){ n = n||0; const neg = n<0; return (neg?"-£":"£")+Math.round(Math.abs(n)).toLocaleString("en-GB"); }
function fmtEUR(n){ n = n||0; const neg = n<0; return (neg?"-€":"€")+Math.round(Math.abs(n)).toLocaleString("en-GB"); }
function fmtNum(n){ return (n||0).toLocaleString("en-GB"); }
function fmtPct(n, d=1){ if(n===null||n===undefined||!isFinite(n)) return "—"; return n.toFixed(d)+"%"; }
function safeDiv(a,b){ if(!b) return null; return (a/b)*100; }
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return localDateStr(new Date()); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return localDateStr(d); }
function fmtDateLong(dstr){
  if(!dstr) return "—";
  const d = new Date(dstr+"T00:00:00");
  return d.toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" });
}
function fmtDateShort(dstr){
  if(!dstr) return "—";
  const d = new Date(dstr+"T00:00:00");
  return d.toLocaleDateString("en-GB",{ day:"numeric", month:"short" });
}
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000);
}
function inPeriod(dateStr, period){
  if(period==="all") return true;
  const today = todayStr();
  if(period==="today") return dateStr===today;
  if(period==="7d") return dateStr>=daysAgo(6) && dateStr<=today;
  if(period==="30d") return dateStr>=daysAgo(29) && dateStr<=today;
  if(period==="mtd"){ return dateStr.slice(0,7)===today.slice(0,7); }
  return true;
}
function sum(arr, key){ return arr.reduce((a,r)=>a+(Number(r[key])||0),0); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function badgeFor(value, target, direction){
  if(value===null || target===undefined || target===null) return "";
  let good = direction==="lower" ? value<=target : value>=target;
  let near = direction==="lower" ? value<=target*1.15 : value>=target*0.85;
  if(good) return `<span class="badge good">${icon("check")} on target</span>`;
  if(near) return `<span class="badge warn">near target</span>`;
  return `<span class="badge bad">${direction==="lower"?"over":"below"}</span>`;
}
function sparkline(values, color){
  if(!values.length) return "";
  const w=64,h=24,max=Math.max(...values,1),min=Math.min(...values,0);
  const range=(max-min)||1;
  const pts = values.map((v,i)=>{
    const x = values.length===1?w:(i/(values.length-1))*w;
    const y = h-((v-min)/range)*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function wfToggleCheck(id, val){ state.workflow.checks[todayStr()+"|"+id]=val; save(); }
function wfNotes(section,type){ return state.workflow.notes[todayStr()+"|"+section+"|"+type] || []; }
function wfSetNotes(section,type,list){ state.workflow.notes[todayStr()+"|"+section+"|"+type]=list; save(); }
function wfReport(date){ return state.workflow.reports[date||todayStr()] || {}; }
function wfSetReport(patch){ const d=todayStr(); state.workflow.reports[d]=Object.assign({}, state.workflow.reports[d]||{}, patch); save(); }
function wfLeadCall(section,clientId){ return !!state.workflow.leadCalls[todayStr()+"|"+section+"|"+clientId]; }
function wfToggleLeadCall(section,clientId,val){ state.workflow.leadCalls[todayStr()+"|"+section+"|"+clientId]=val; save(); }
function wfWeekDates(){
  const d = new Date(todayStr()+"T00:00:00");
  const day = d.getDay();
  const monday = new Date(d); monday.setDate(d.getDate()+(day===0?-6:1-day));
  const dates=[];
  for(let i=0;i<5;i++){ const dd=new Date(monday); dd.setDate(monday.getDate()+i); dates.push(localDateStr(dd)); }
  return dates;
}
function wfDmsForDate(d){ return sum(state.b2bLog.filter(x=>x.date===d),"openerMS")+sum(state.b2bLog.filter(x=>x.date===d),"proposalMS"); }
function wfSumReports(dates){
  const t={coldCalls:0,oldLeads:0,meetings:0,revenue:0,dms:0,days:0};
  dates.forEach(d=>{
    t.dms += wfDmsForDate(d);
    const r = state.workflow.reports[d];
    if(!r) return;
    t.coldCalls+=Number(r.coldCalls)||0; t.oldLeads+=Number(r.oldLeads)||0; t.meetings+=Number(r.meetings)||0; t.revenue+=Number(r.revenue)||0; t.days++;
  });
  return t;
}

/* ============================= B2B (LinkedIn outreach) ============================= */
const B2B_METRICS = [
  { key:"openerMS", label:"Opener MS" },
  { key:"proposalMS", label:"Proposal MS" },
  { key:"fupsToday", label:"FUPs" },
  { key:"docAccepts", label:"Doc Accepts" },
  { key:"connectionsSent", label:"Connections sent" },
  { key:"callsProposed", label:"Calls Proposed" },
  { key:"calendarLinksSent", label:"Calendar links sent", green:1 },
  { key:"callsBooked", label:"Calls Booked", green:2 },
  { key:"sales", label:"Sales", green:3 },
  { key:"cashCollected", label:"Cash Collected", money:true, green:4 },
];
function b2bMonthKey(dateStr){ return dateStr.slice(0,7); }
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function b2bMonthLabel(monthKey){
  const m = Number(monthKey.split("-")[1]);
  return MONTH_ABBR[m-1];
}
function b2bAvailableMonths(){
  const year = todayStr().slice(0,4);
  const months = [];
  for(let m=1;m<=12;m++) months.push(year+"-"+String(m).padStart(2,"0"));
  return months;
}
function b2bSumRows(rows){
  const out = {};
  B2B_METRICS.forEach(m=>{ out[m.key] = sum(rows, m.key); });
  return out;
}
function b2bRowsForMonth(monthKey){ return state.b2bLog.filter(r=>b2bMonthKey(r.date)===monthKey); }
function b2bRowsForRange(start,end){ return state.b2bLog.filter(r=>r.date>=start && r.date<=end); }
function b2bMetricCell(m, val){ return `<td class="num tnum">${m.money?fmtMoney(val):fmtNum(val)}</td>`; }
function rateCard(label, value){
  return `<div class="card stat rate"><div class="label">${label}</div><div class="value-row"><span class="value tnum">${value}</span></div></div>`;
}
function b2bStatCard(label, value, money, green, currency){
  const fmt = currency==="EUR" ? fmtEUR : fmtMoney;
  const display = typeof value==="string" ? value : (money?fmt(value):fmtNum(value));
  return `<div class="card stat hero${green?" hero-g"+green:""}"><div class="label">${label}</div><div class="value-row"><span class="value tnum">${display}</span></div></div>`;
}
function b2bStageRates(t){
  return [
    { label:"Opener→Proposal", value: safeDiv(t.proposalMS, t.openerMS) },
    { label:"Proposal→Call", value: safeDiv(t.callsProposed, t.proposalMS) },
    { label:"Call→Calendar", value: safeDiv(t.calendarLinksSent, t.callsProposed) },
    { label:"Calendar→Booked", value: safeDiv(t.callsBooked, t.calendarLinksSent) },
    { label:"Booked→Sale", value: safeDiv(t.sales, t.callsBooked) },
  ];
}
function viewB2B(){
  const months = b2bAvailableMonths();
  const curMonth = todayStr().slice(0,7);
  if(uiState.b2bTab!=="dashboard" && !months.includes(uiState.b2bTab)) uiState.b2bTab = curMonth;
  const activeTab = uiState.b2bTab;
  const allRows = state.b2bLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const firstDate = allRows.length ? allRows[0].date : null;
  const daysRunning = firstDate ? daysBetween(firstDate, todayStr())+1 : 0;

  const tabsHtml = `
    <div class="b2b-tabbar">
      <button class="b2b-tab ${activeTab==='dashboard'?'active':''}" data-b2b-tab="dashboard">${icon("briefcase")} Dashboard</button>
      ${months.map(mk=>`<button class="b2b-tab ${activeTab===mk?'active':''}" data-b2b-tab="${mk}">${b2bMonthLabel(mk)}${mk===curMonth?'<span class="tab-dot"></span>':''}</button>`).join("")}
    </div>`;

  return `
    <div class="topbar">
      <div>
        <h1>LinkedIn Acquisition</h1>
        <div class="sub">LinkedIn outreach · ${firstDate ? `first message logged ${fmtDateShort(firstDate)} · day ${daysRunning}` : "no activity logged yet"}</div>
      </div>
      <div class="topbar-right">
        ${activeTab!=="dashboard"?`<button class="btn primary" data-open="b2bEntry">${icon("plus")} Log day</button>`:""}
      </div>
    </div>
    <div class="content">
      ${activeTab==="dashboard" ? renderB2BDashboard(months) : renderB2BMonth(activeTab)}
      ${tabsHtml}
    </div>
  `;
}
function renderB2BMonth(monthKey){
  const rows = b2bRowsForMonth(monthKey);
  const monthTotals = b2bSumRows(rows);
  const weeks = weeksForMonth(monthKey);
  const weekRows = weeks.map(w=>Object.assign({ start:w.start, end:w.end }, b2bSumRows(b2bRowsForRange(w.start,w.end))));
  const dailyRows = rows.slice().sort((a,b)=>a.date<b.date?1:-1);

  const rates = b2bStageRates(monthTotals);

  return `
    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Monthly summary</h3><div class="sub">${b2bMonthLabel(monthKey)} — calculated live from the daily log below</div></div></div>
      <div class="grid cols-4">
        ${B2B_METRICS.map(m=>b2bStatCard(m.label, monthTotals[m.key], m.money, m.green)).join("")}
      </div>
      <div class="grid cols-5" style="margin-bottom:0">
        ${rates.map(r=>rateCard(r.label, fmtRate(r.value))).join("")}
      </div>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Weekly summary</h3><div class="sub">${b2bMonthLabel(monthKey)} — Monday–Sunday weeks touching this month</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Week</th>${B2B_METRICS.map(m=>`<th class="num">${m.label}</th>`).join("")}</tr></thead>
          <tbody>
            ${weekRows.map((w,i)=>`<tr><td>Week ${i+1} <span class="cell-muted">${fmtDateShort(w.start)}–${fmtDateShort(w.end)}</span></td>${B2B_METRICS.map(m=>b2bMetricCell(m,w[m.key])).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h3>Daily log</h3><div class="sub">${dailyRows.length} ${dailyRows.length===1?"entry":"entries"} this month${dailyRows.some(r=>r.fromSheet)?` · some rows synced from the tracker sheet (last pulled ${fmtDateLong(B2B_SHEET_SYNCED_AT)}) · log there, then ask Claude to sync`:""}</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th>${B2B_METRICS.map(m=>`<th class="num">${m.label}</th>`).join("")}<th></th></tr></thead>
          <tbody>
            ${dailyRows.length? dailyRows.map(r=>`
              <tr>
                <td>${fmtDateShort(r.date)} ${r.fromSheet?`<span class="badge good" title="Synced from Google Sheet">sheet</span>`:""}</td>
                ${B2B_METRICS.map(m=>b2bMetricCell(m,r[m.key])).join("")}
                <td><div class="row-actions">
                  <button class="icon-btn" data-edit-b2b="${r.id}">${icon("edit")}</button>
                  <button class="icon-btn" data-del-b2b="${r.id}">${icon("trash")}</button>
                </div></td>
              </tr>`).join("") : `<tr class="empty-row"><td colspan="${B2B_METRICS.length+2}">No activity logged for ${b2bMonthLabel(monthKey)} yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function renderB2BDashboard(months){
  const perMonth = months.map(mk=>{
    const rows = b2bRowsForMonth(mk);
    return { key:mk, hasData: rows.length>0, totals: b2bSumRows(rows) };
  });
  const grandTotal = {};
  B2B_METRICS.forEach(m=>{ grandTotal[m.key] = perMonth.reduce((a,p)=>a+p.totals[m.key],0); });
  const anyData = perMonth.some(p=>p.hasData);
  return `
    <div class="panel">
      <div class="panel-head"><div><h3>Dashboard</h3><div class="sub">Overview across all months of ${todayStr().slice(0,4)}</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Stat</th>${perMonth.map(p=>`<th class="num">${b2bMonthLabel(p.key)}</th>`).join("")}<th class="num col-total">Totals</th></tr></thead>
          <tbody>
            ${B2B_METRICS.map(m=>`
              <tr>
                <td><b>${m.label}</b></td>
                ${perMonth.map(p=>p.hasData?b2bMetricCell(m,p.totals[m.key]):'<td class="num cell-muted">—</td>').join("")}
                <td class="num tnum col-total" style="font-weight:700">${anyData?(m.money?fmtMoney(grandTotal[m.key]):fmtNum(grandTotal[m.key])):"—"}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function barChart(values, color){
  if(!values.some(v=>v>0)) return `<div class="empty-state" style="padding:20px 0">${icon("info")}<p>No data yet for this range.</p></div>`;
  const max = Math.max(...values,1);
  const w=560,h=140,gap=4,barW=(w/values.length)-gap;
  const bars = values.map((v,i)=>{
    const bh = (v/max)*(h-18);
    const x = i*(barW+gap);
    return `<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${color}" opacity="${i===values.length-1?1:0.55}"/>`;
  }).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h-0.5}" x2="${w}" y2="${h-0.5}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

function adsFiltered(period, clientId){
  return state.adsLog.filter(r=> inPeriod(r.date, period) && (clientId==="all" || r.clientId===clientId) ).sort((a,b)=>a.date<b.date?1:-1);
}
function adsAgg(period, clientId){
  const rows = state.adsLog.filter(r=> inPeriod(r.date, period) && (clientId==="all" || r.clientId===clientId));
  const bookings = sum(rows,"bookings"), cancellations = sum(rows,"cancellations"), reschedules = sum(rows,"reschedules");
  const noShows = sum(rows,"noShows"), liveCalls = sum(rows,"liveCalls"), offersMade = sum(rows,"offersMade");
  const closedDeals = sum(rows,"closedDeals"), cashCollected = sum(rows,"cashCollected");
  let followUps=0, notClosedYet=0;
  const sortedRows = rows.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(clientId!=="all" && sortedRows.length){
    const latest = sortedRows[sortedRows.length-1];
    followUps = Number(latest.followUps)||0; notClosedYet = Number(latest.notClosedYet)||0;
  } else {
    followUps = sum(rows,"followUps"); notClosedYet = sum(rows,"notClosedYet");
  }
  return {
    bookings, cancellations, reschedules, noShows, liveCalls, offersMade, closedDeals, cashCollected, followUps, notClosedYet,
    cancellationRate: safeDiv(cancellations, bookings),
    showRate: safeDiv(liveCalls, bookings),
    closeRate: safeDiv(closedDeals, liveCalls),
    offerCloseRate: safeDiv(closedDeals, offersMade),
  };
}
function leadsFiltered(clientId){
  return state.leadsLog.filter(r=>clientId==="all"||r.clientId===clientId).sort((a,b)=>a.date<b.date?1:-1);
}
function needsFollowUp(clientId){
  return leadsFiltered(clientId).filter(r=>FOLLOW_UP_OUTCOMES.includes(r.outcome));
}
function outcomeBadgeClass(outcome){
  if(CLOSED_OUTCOMES.includes(outcome)) return "good";
  if(FOLLOW_UP_OUTCOMES.includes(outcome)) return "warn";
  return "bad";
}

/* ============================= ADS ACQUISITION =============================
   Calculation layer: every summary number here is DERIVED from adsAcqLeads.
   Nothing in the Monthly/Weekly Summary or Dashboard is ever hand-entered
   except the five ad-platform inputs (Ad Spend, LP Views, Paid Trials,
   Full Package, Revenue) that have no lead-level equivalent. */
const SECOND_CALL_OUTCOMES = ["N/A","Main offer closed","Special Payment","Deposit","Follow up","Offer & Didn't Buy","Rescheduled","No-Show","Cancelled","Bad Fit / No Offer"];
function aaMonthKey(dateStr){ return dateStr.slice(0,7); }
function aaAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function aaLeadsForMonth(mk){ return state.adsAcqLeads.filter(l=>aaMonthKey(l.date)===mk); }
function aaMonthlyInput(mk){ return Object.assign({ adSpend:0, lpViews:0, paidTrials:0, fullPackage:0, revenue:0 }, state.adsAcqMonthly[mk]||{}); }
function aaSetMonthlyInput(mk, patch){ state.adsAcqMonthly[mk] = Object.assign(aaMonthlyInput(mk), patch); save(); }
function fmtRate(v, digits=0){ return (v===null||v===undefined||!isFinite(v)) ? "—" : v.toFixed(digits)+"%"; }
function safeRatio(num, den){ return den ? num/den*100 : null; }
function safeDivRaw(num, den){ return den ? num/den : null; }

function calcSalesMetrics(leads){
  const bookings = leads.length;
  const cancellations = leads.filter(l=>l.outcome==="Cancelled").length;
  const noShows = leads.filter(l=>l.outcome==="No-Show").length;
  const reschedules = leads.filter(l=>l.outcome==="Rescheduled").length;
  const liveCalls = leads.filter(l=>SHOWED_OUTCOMES.includes(l.outcome)).length;
  const closedDeals = leads.filter(l=>CLOSED_OUTCOMES.includes(l.outcome)).length;
  const offersReceived = leads.filter(l=>l.offerMade).length;
  const cashCollected = leads.filter(l=>CLOSED_OUTCOMES.includes(l.outcome)).reduce((a,l)=>a+(Number(l.cash)||0),0);
  const followUpsOpen = leads.filter(l=>l.outcome==="Follow up").length;
  return {
    bookings, liveCalls, cancellations, noShows, reschedules, closedDeals, cashCollected, followUpsOpen, offersReceived,
    showRate: safeRatio(liveCalls, bookings),
    cancellationRate: safeRatio(cancellations, bookings),
    showUpRate: safeRatio(liveCalls, bookings-cancellations),
    closeRate: safeRatio(closedDeals, liveCalls),
    offerToCloseRate: safeRatio(closedDeals, offersReceived),
  };
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return localDateStr(d);
}
function mondayOnOrBefore(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0?-6:1-day));
  return localDateStr(d);
}
function weeksForMonth(mk){
  const [y,m] = mk.split("-").map(Number);
  const lastDayNum = new Date(y,m,0).getDate();
  const monthEnd = `${mk}-${String(lastDayNum).padStart(2,"0")}`;
  let cursor = mondayOnOrBefore(`${mk}-01`);
  const weeks = [];
  let idx=1;
  while(cursor <= monthEnd){
    weeks.push({ n: idx, start: cursor, end: addDays(cursor,6) });
    cursor = addDays(cursor, 7);
    idx++;
  }
  return weeks;
}
function aaMonthClosers(mk){ return Array.from(new Set(aaLeadsForMonth(mk).map(l=>l.closerName).filter(Boolean))).sort(); }
function aaFilteredSortedLeads(mk){
  const f = uiState.aaFilters;
  const weeks = weeksForMonth(mk);
  let rows = aaLeadsForMonth(mk).filter(l=>{
    if(f.closer!=="all" && l.closerName!==f.closer) return false;
    if(f.outcome!=="all" && l.outcome!==f.outcome) return false;
    if(f.offer!=="all" && String(!!l.offerMade)!==f.offer) return false;
    if(f.closedPitched!=="all" && String(!!l.offerClosedPitched)!==f.closedPitched) return false;
    if(f.week!=="all"){
      const wk = weeks.find(w=>l.date>=w.start && l.date<=w.end);
      if(!wk || String(wk.n)!==f.week) return false;
    }
    if(f.search && !l.leadName.toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  });
  rows.sort((a,b)=>{
    let av=a[f.sortBy], bv=b[f.sortBy];
    if(f.sortBy==="cash"){ av=Number(av)||0; bv=Number(bv)||0; }
    else { av=String(av||"").toLowerCase(); bv=String(bv||"").toLowerCase(); }
    const cmp = av<bv?-1:av>bv?1:0;
    return f.sortDir==="asc"?cmp:-cmp;
  });
  return rows;
}

function aaCalcDashboardRow(mk){
  const leads = aaLeadsForMonth(mk);
  const s = calcSalesMetrics(leads);
  const inp = aaMonthlyInput(mk);
  const newPayingClients = s.closedDeals;
  const lpPct = safeRatio(leads.length, inp.lpViews);
  const cpl = safeDivRaw(inp.adSpend, leads.length);
  const vcrPct = safeRatio(s.bookings, leads.length);
  const cpss = safeDivRaw(inp.adSpend, s.bookings);
  const supPct = safeRatio(s.liveCalls, s.bookings);
  const cpssT = safeDivRaw(inp.adSpend, s.liveCalls);
  const ccPct = safeRatio(newPayingClients, s.liveCalls);
  const lcPct = safeRatio(newPayingClients, leads.length);
  const cpft = safeDivRaw(inp.adSpend, (inp.paidTrials+inp.fullPackage));
  const cpa = safeDivRaw(inp.adSpend, newPayingClients);
  const rpl = inp.revenue - inp.adSpend;
  const cashPL = s.cashCollected - inp.adSpend;
  const rroi = inp.adSpend ? rpl/inp.adSpend*100 : null;
  const croi = inp.adSpend ? cashPL/inp.adSpend*100 : null;
  return {
    mk, adSpend:inp.adSpend, leads:leads.length, lpViews:inp.lpViews, lpPct, cpl,
    callsBooked:s.bookings, vcrPct, cpss, callsTaken:s.liveCalls, supPct, cpssT,
    paidTrials:inp.paidTrials, fullPackage:inp.fullPackage, newPayingClients, ccPct, lcPct, cpft,
    revenue:inp.revenue, newCashCollected:s.cashCollected, cpa, rpl, cashPL, rroi, croi,
    hasActivity: leads.length>0 || inp.adSpend>0,
  };
}
const AA_DASHBOARD_COLS = [
  { key:"adSpend", label:"Ad Spend", money:true, editable:true },
  { key:"leads", label:"Leads" },

function aaDashCell(col, row){
  const v = row[col.key];
  if(col.editable){
    return `<td class="num"><input type="number" min="0" class="aa-inline-input" value="${v||""}" data-aa-monthly-input="${row.mk}|${col.key}" /></td>`;
  }
  if(!row.hasActivity && (v===0||v===null)) return `<td class="num cell-muted">—</td>`;
  if(col.pct) return `<td class="num tnum">${fmtRate(v)}</td>`;
  if(col.moneyRate) return `<td class="num tnum">${v===null?"—":fmtMoney(v)}</td>`;
  if(col.money) return `<td class="num tnum">${fmtMoney(v)}</td>`;
  return `<td class="num tnum">${fmtNum(v)}</td>`;
}
function renderAADashboard(months){
  const rows = months.map(mk=>aaCalcDashboardRow(mk));
  const totals = { mk:"Total", hasActivity: rows.some(r=>r.hasActivity) };
  ["adSpend","leads","lpViews","callsBooked","callsTaken","paidTrials","fullPackage","newPayingClients","revenue","newCashCollected"].forEach(k=>{
    totals[k] = rows.reduce((a,r)=>a+(r[k]||0),0);
  });
  totals.lpPct = safeRatio(totals.leads, totals.lpViews);
  totals.cpl = safeDivRaw(totals.adSpend, totals.leads);
  totals.vcrPct = safeRatio(totals.callsBooked, totals.leads);
  totals.cpss = safeDivRaw(totals.adSpend, totals.callsBooked);
  totals.supPct = safeRatio(totals.callsTaken, totals.callsBooked);
  totals.cpssT = safeDivRaw(totals.adSpend, totals.callsTaken);
  totals.ccPct = safeRatio(totals.newPayingClients, totals.callsTaken);
  totals.lcPct = safeRatio(totals.newPayingClients, totals.leads);
  totals.cpft = safeDivRaw(totals.adSpend, totals.paidTrials+totals.fullPackage);
  totals.cpa = safeDivRaw(totals.adSpend, totals.newPayingClients);
  totals.rpl = totals.revenue - totals.adSpend;
  totals.cashPL = totals.newCashCollected - totals.adSpend;
  totals.rroi = totals.adSpend? totals.rpl/totals.adSpend*100 : null;
  totals.croi = totals.adSpend? totals.cashPL/totals.adSpend*100 : null;

  return `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Dashboard</h3><div class="sub">Ad performance across all months of ${todayStr().slice(0,4)} · Leads, Calls Booked, Calls Taken, New Paying Clients & New Cash Collected are pulled automatically from each month's lead table</div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Month</th>${AA_DASHBOARD_COLS.map(c=>`<th class="num">${c.label}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td><b>${b2bMonthLabel(r.mk)}</b></td>${AA_DASHBOARD_COLS.map(c=>aaDashCell(c,r)).join("")}</tr>`).join("")}
            <tr class="row-total"><td>Total</td>${AA_DASHBOARD_COLS.map(c=>c.editable?`<td class="num tnum">${c.money?fmtMoney(totals[c.key]):fmtNum(totals[c.key])}</td>`:aaDashCell(c,totals)).join("")}</tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ============================= FITNESS ============================= */
function fitMonthKey(dateStr){ return dateStr.slice(0,7); }
function fitAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function fitEntriesForMonth(mk){ return state.fitnessLog.filter(r=>fitMonthKey(r.date)===mk); }
function fitCalcMetrics(entries){
  const daysLogged = entries.length;
  const withCal = entries.filter(e=>e.calories);
  const totalCalories = sum(entries,"calories");
  const avgCalories = withCal.length ? totalCalories/withCal.length : null;
  const withProtein = entries.filter(e=>e.protein);
  const avgProtein = withProtein.length ? sum(entries,"protein")/withProtein.length : null;
  const withWeight = entries.filter(e=>e.weight).slice().sort((a,b)=>a.date<b.date?-1:1);
  const startWeight = withWeight.length ? Number(withWeight[0].weight) : null;
  const endWeight = withWeight.length ? Number(withWeight[withWeight.length-1].weight) : null;
  const weightChange = (startWeight!==null && endWeight!==null) ? endWeight-startWeight : null;
  const avgWeight = withWeight.length ? withWeight.reduce((a,e)=>a+Number(e.weight),0)/withWeight.length : null;
  return { daysLogged, totalCalories, avgCalories, avgProtein, startWeight, endWeight, weightChange, avgWeight };
}
function fmtWeight(v, unit){ return (v===null||v===undefined) ? "—" : v.toFixed(1)+" "+unit; }
function fmtWeightSigned(v, unit){ return (v===null||v===undefined) ? "—" : (v>0?"+":"")+v.toFixed(1)+" "+unit; }
function viewFitness(){
  const months = fitAvailableMonths();
  const curMonth = todayStr().slice(0,7);
  if(uiState.fitTab!=="dashboard" && !months.includes(uiState.fitTab)) uiState.fitTab = curMonth;
  const activeTab = uiState.fitTab;
  const allSorted = state.fitnessLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const latest = allSorted[allSorted.length-1];

  const tabsHtml = `
    <div class="b2b-tabbar">
      <button class="b2b-tab ${activeTab==='dashboard'?'active':''}" data-fit-tab="dashboard">${icon("briefcase")} Dashboard</button>
      ${months.map(mk=>`<button class="b2b-tab ${activeTab===mk?'active':''}" data-fit-tab="${mk}">${b2bMonthLabel(mk)}${mk===curMonth?'<span class="tab-dot"></span>':''}</button>`).join("")}
    </div>`;

  return `
    <div class="topbar">
      <div>
        <h1>Fitness Tracker</h1>
        <div class="sub">${latest? `latest: ${fmtDateShort(latest.date)}` : "no entries yet"}</div>
      </div>
      <div class="topbar-right">
        ${activeTab!=="dashboard"?`<button class="btn primary" data-open="fitEntry">${icon("plus")} Log today</button>`:""}
      </div>
    </div>
    <div class="content">
      ${activeTab==="dashboard" ? renderFitDashboard(months) : renderFitMonth(activeTab)}
      ${tabsHtml}
    </div>
  `;
}
function renderFitMonth(mk){
  const unit = state.settings.weightUnit;
  const entries = fitEntriesForMonth(mk);
  const m = fitCalcMetrics(entries);
  const weeks = weeksForMonth(mk);
  const weekRows = weeks.map(w=>({ w, m: fitCalcMetrics(entries.filter(e=>e.date>=w.start && e.date<=w.end)) }));
  const dailyRows = entries.slice().sort((a,b)=>a.date<b.date?1:-1);
  const sheetRows = entries.filter(r=>r.fromSheet).length;

  const [y,mm] = mk.split("-").map(Number);
  const lastDay = new Date(y,mm,0).getDate();
  const weightVals=[], calVals=[];

      <div class="grid cols-4" style="margin-bottom:0">
        ${aaMetricCard("Days logged", fmtNum(m.daysLogged))}
        ${aaMetricCard("Total calories", fmtNum(m.totalCalories))}
        ${aaMetricCard("Avg calories/day", m.avgCalories===null?"—":fmtNum(Math.round(m.avgCalories)))}
        ${aaMetricCard("Avg protein/day", m.avgProtein===null?"—":fmtNum(Math.round(m.avgProtein))+"g")}
        ${aaMetricCard("Start weight", fmtWeight(m.startWeight, unit))}
        ${aaMetricCard("End weight", fmtWeight(m.endWeight, unit))}
        ${aaMetricCard("Weight change", fmtWeightSigned(m.weightChange, unit))}
        ${aaMetricCard("Avg weight", fmtWeight(m.avgWeight, unit))}
      </div>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Weekly summary</h3><div class="sub">${b2bMonthLabel(mk)} — Monday–Sunday weeks touching this month</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Week</th><th class="num">Days logged</th><th class="num">Total calories</th><th class="num">Avg cal/day</th><th class="num">Avg protein</th><th class="num">Start weight</th><th class="num">End weight</th><th class="num">Weight change</th></tr></thead>
          <tbody>
            ${weekRows.map(({w,m})=>`
              <tr>
                <td>Week ${w.n} <span class="cell-muted">${fmtDateShort(w.start)}–${fmtDateShort(w.end)}</span></td>

function renderFitDashboard(months){
  const unit = state.settings.weightUnit;

  });
  const yearEntries = state.fitnessLog.filter(r=>r.date.slice(0,4)===todayStr().slice(0,4));
  const yearMetrics = fitCalcMetrics(yearEntries);
  const cols = [
    { key:"daysLogged", label:"Days logged" },
    { key:"totalCalories", label:"Total calories" },
    { key:"avgCalories", label:"Avg cal/day", round:true },
    { key:"avgProtein", label:"Avg protein/day", round:true, suffix:"g" },
    { key:"startWeight", label:"Start weight", weight:true },
    { key:"endWeight", label:"End weight", weight:true },
    { key:"weightChange", label:"Weight change", weight:true, signed:true },
    { key:"avgWeight", label:"Avg weight", weight:true },
  ];
  function cell(col, m, hasData, isTotal){
    const cls = "num"+(isTotal?" col-total":"");
    if(!hasData) return `<td class="${cls} cell-muted">—</td>`;
    const v = m[col.key];
    if(v===null||v===undefined) return `<td class="${cls} cell-muted">—</td>`;
    let out;
    if(col.weight) out = col.signed ? fmtWeightSigned(v, unit) : fmtWeight(v, unit);
    else if(col.round) out = fmtNum(Math.round(v))+(col.suffix||"");
    else out = fmtNum(v);
    return `<td class="${cls} tnum">${out}</td>`;
  }
  return `
    <div class="panel">
      <div class="panel-head"><div><h3>Dashboard</h3><div class="sub">Overview across all months of ${todayStr().slice(0,4)}</div></div></div>
      <div class="table-wrap">

          <thead><tr><th>Stat</th>${perMonth.map(p=>`<th class="num">${b2bMonthLabel(p.key)}</th>`).join("")}<th class="num col-total">Year</th></tr></thead>
          <tbody>
            ${cols.map(c=>`
              <tr>
                <td><b>${c.label}</b></td>
                ${perMonth.map(p=>cell(c,p.m,p.hasData)).join("")}
                ${cell(c, yearMetrics, yearEntries.length>0, true)}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function lineChart(values, color){
  const present = values.filter(v=>v!==null && v!==undefined);
  if(!present.length) return `<div class="empty-state" style="padding:20px 0">${icon("info")}<p>No weight logged yet for this range.</p></div>`;
  const w=560,h=140,pad=8;
  const max = Math.max(...present), min = Math.min(...present);
  const range = (max-min)||1;
  const n = values.length;
  const pts = [];
  values.forEach((v,i)=>{
    if(v===null||v===undefined) return;
    const x = (i/(n-1))*(w-pad*2)+pad;
    const y = h-pad-((v-min)/range)*(h-pad*2);
    pts.push([x,y]);
  });
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/>
  </svg></div>`;
}

/* ============================= FINANCES =============================
   Reads the "Weekly Finances" Google Sheet template directly — one tab per
   month, category rows × WEEK1-4 columns. Sheet-name-based export silently
   falls back to the first tab on a miss, so this keys off known tab gids
   instead (bad gid = real error we can catch). When you duplicate the
   template for a new month, tell Claude so it can add the gid here. */
const FINANCE_SHEET_ID = "1lgnvUi3MQ-WbCCl9K3yzb0njybgxwT7IN4ZZaD0N4e8";
const FINANCE_MONTH_GIDS = { "2026-08": "244576783" };
function finParseEuro(s){
  s = (s||"").replace(/[€\s]/g,"").trim();
  if(!s || s==="-") return 0;
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
  if(lastComma>-1 && lastDot>-1){ s = lastComma>lastDot ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lastComma>-1){ s = s.replace(",","."); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseFinanceSheetRows(rows){
  const entries = [];
  let mode = null;
  for(const row of rows){
    const label = (row[1]||"").trim();
    if(label==="INCOME SOURCE"){ mode="income"; continue; }
    if(label==="PERSONAL" && mode!=="income"){ mode="personal"; continue; }
    if(label==="BUSINESS"){ mode="business"; continue; }
    if(label===""){ mode=null; continue; }
    if(label==="TOTAL INCOME"){ mode=null; continue; }
    if(label==="INCOME" || label==="EXPENSES") continue;
    if(!mode) continue;
    const week1=finParseEuro(row[3]), week2=finParseEuro(row[4]), week3=finParseEuro(row[5]), week4=finParseEuro(row[6]);
    entries.push({ section:mode, category:label, week1, week2, week3, week4, monthTotal: week1+week2+week3+week4 });
  }
  return entries;
}
async function fetchFinanceMonthLive(monthKey, gid){
  const url = `https://docs.google.com/spreadsheets/d/${FINANCE_SHEET_ID}/export?format=csv&gid=${gid}`;
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("finance sheet fetch failed: "+res.status);
  const rows = parseCSV(await res.text());
  return parseFinanceSheetRows(rows).map(e=>Object.assign({ monthKey }, e));
}
async function fetchFinanceSheetLive(){
  const results = await Promise.allSettled(
    Object.entries(FINANCE_MONTH_GIDS).map(([monthKey,gid])=>fetchFinanceMonthLive(monthKey,gid))
  );
  return results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function mergeFinanceSheetImport(importEntries){
  let changed = false;
  (importEntries||[]).forEach(e=>{
    const id = `${e.monthKey}__${e.section}__${slugify(e.category)}`;
    const idx = state.financeLog.findIndex(x=>x.id===id);
    if(idx>=0){
      const existing = state.financeLog[idx];
      if(existing.fromSheet===false) return;
      state.financeLog[idx] = Object.assign({}, e, { id, fromSheet:true });
      changed = true;
    } else {
      state.financeLog.push(Object.assign({}, e, { id, fromSheet:true }));
      changed = true;
    }
  });
  if(changed) save();
}

function finAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function finEntriesForMonth(mk){ return state.financeLog.filter(e=>e.monthKey===mk); }
function finMonthTotals(entries){
  const sumSection = (section, key) => entries.filter(e=>e.section===section).reduce((a,e)=>a+Number(e[key]||0),0);
  const weeks = ["week1","week2","week3","week4"].map(wk=>{
    const income = sumSection("income", wk);
    const personal = sumSection("personal", wk);
    const business = sumSection("business", wk);
    return { income, personal, business, spending: personal+business, net: income-personal-business };
  });
  const income = weeks.reduce((a,w)=>a+w.income,0);
  const personal = weeks.reduce((a,w)=>a+w.personal,0);
  const business = weeks.reduce((a,w)=>a+w.business,0);
  return { weeks, income, personal, business, spending: personal+business, net: income-personal-business };
}

function openModal(html){
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "modalOverlay";
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e=>{ if(e.target===wrap) closeModal(); });
  document.addEventListener("keydown", escClose);
}
function escClose(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  const el = document.getElementById("modalOverlay");
  if(el) el.remove();
  document.removeEventListener("keydown", escClose);
}

/* ============================= EVENTS ============================= */
function bindViewEvents(){
  document.querySelectorAll("[data-jump]").forEach(el=>{
    el.addEventListener("click", ()=>{ activeView = el.dataset.jump; renderShell(); });
  });
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const kind = el.dataset.open;
      if(kind==="b2bEntry") b2bEntryModal();
      else if(kind==="adsEntry") adsEntryModal();
      else if(kind==="leadEntry") leadEntryModal();
      else if(kind==="aaLead") aaLeadModal();
      else if(kind==="clientEntry") openClientModal();
      else if(kind==="fitEntry") fitEntryModal();
      else if(kind==="targets") targetsModal(el.dataset.targetGroup);
    });
  });
  document.querySelectorAll("[data-edit-b2b]").forEach(el=>el.addEventListener("click", ()=>b2bEntryModal(el.dataset.editB2b)));
  document.querySelectorAll("[data-del-b2b]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this entry?")){ state.b2bLog = state.b2bLog.filter(r=>r.id!==el.dataset.delB2b); save(); renderView(); toast("Deleted"); }
  }));
  document.querySelectorAll("[data-edit-ads]").forEach(el=>el.addEventListener("click", ()=>adsEntryModal(el.dataset.editAds)));
  document.querySelectorAll("[data-del-ads]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this entry?")){ state.adsLog = state.adsLog.filter(r=>r.id!==el.dataset.delAds); save(); renderView(); toast("Deleted"); }
  }));
  document.querySelectorAll("[data-edit-lead]").forEach(el=>el.addEventListener("click", ()=>leadEntryModal(el.dataset.editLead)));
  document.querySelectorAll("[data-del-lead]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this lead?")){ state.leadsLog = state.leadsLog.filter(r=>r.id!==el.dataset.delLead); save(); renderView(); toast("Deleted"); }
  }));
  document.querySelectorAll("[data-edit-client]").forEach(el=>el.addEventListener("click", ()=>openClientModal(el.dataset.editClient)));
  document.querySelectorAll("[data-del-client]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this client and its ad logs?")){
      const cid = el.dataset.delClient;
      state.clients = state.clients.filter(c=>c.id!==cid);
      state.adsLog = state.adsLog.filter(l=>l.clientId!==cid);
      state.leadsLog = state.leadsLog.filter(l=>l.clientId!==cid);
      Object.keys(state.workflow.leadCalls).forEach(k=>{ if(k.endsWith("|"+cid)) delete state.workflow.leadCalls[k]; });
      save(); renderView(); toast("Deleted");
    }
  }));
  document.querySelectorAll("[data-edit-fit]").forEach(el=>el.addEventListener("click", ()=>fitEntryModal(el.dataset.editFit)));
  document.querySelectorAll("[data-del-fit]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this entry?")){ state.fitnessLog = state.fitnessLog.filter(r=>r.id!==el.dataset.delFit); save(); renderView(); toast("Deleted"); }
  }));

  document.querySelectorAll("[data-b2b-tab]").forEach(b=>b.addEventListener("click", ()=>{ uiState.b2bTab=b.dataset.b2bTab; renderView(); }));

  /* ---- Ads Acquisition ---- */
  document.querySelectorAll("[data-aa-tab]").forEach(b=>b.addEventListener("click", ()=>{ uiState.aaTab=b.dataset.aaTab; renderView(); }));
  document.querySelectorAll("[data-edit-aa-lead]").forEach(el=>el.addEventListener("click", ()=>aaLeadModal(el.dataset.editAaLead)));
  document.querySelectorAll("[data-del-aa-lead]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Delete this lead?")){ state.adsAcqLeads = state.adsAcqLeads.filter(l=>l.id!==el.dataset.delAaLead); save(); renderView(); toast("Deleted"); }
  }));
  document.querySelectorAll("[data-aa-filter]").forEach(el=>{
    const evt = el.tagName==="SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{ uiState.aaFilters[el.dataset.aaFilter] = el.value; renderView();
      if(el.tagName!=="SELECT"){ setTimeout(()=>{ const i=document.querySelector(`[data-aa-filter="${el.dataset.aaFilter}"]`); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); }
    });
  });
  const aaSortDirBtn = document.querySelector("[data-aa-sort-dir]");
  if(aaSortDirBtn) aaSortDirBtn.addEventListener("click", ()=>{ uiState.aaFilters.sortDir = uiState.aaFilters.sortDir==="asc"?"desc":"asc"; renderView(); });
  document.querySelectorAll("[data-aa-monthly-input]").forEach(el=>el.addEventListener("change", ()=>{
    const [mk,field] = el.dataset.aaMonthlyInput.split("|");
    aaSetMonthlyInput(mk, { [field]: +el.value||0 });
    renderView();
  }));
  const adsSeg = document.getElementById("adsPeriodSeg");
  if(adsSeg) adsSeg.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ uiState.adsPeriod=b.dataset.period; renderView(); }));
  document.querySelectorAll("[data-fit-tab]").forEach(b=>b.addEventListener("click", ()=>{ uiState.fitTab=b.dataset.fitTab; renderView(); }));
  document.querySelectorAll("[data-fin-tab]").forEach(b=>b.addEventListener("click", ()=>{ uiState.finTab=b.dataset.finTab; renderView(); }));
  const adsClientSel = document.getElementById("adsClientSelect");
  if(adsClientSel) adsClientSel.addEventListener("change", e=>{ uiState.adsClient=e.target.value; renderView(); });
  const clientFilterSel = document.getElementById("clientFilterSel");
  if(clientFilterSel) clientFilterSel.addEventListener("change", e=>{ uiState.clientFilter=e.target.value; renderView(); });
  const clientSearchInput = document.getElementById("clientSearchInput");
  if(clientSearchInput) clientSearchInput.addEventListener("input", e=>{ uiState.clientSearch=e.target.value; renderView(); setTimeout(()=>{ const i=document.getElementById("clientSearchInput"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });

  /* ---- Daily workflow ---- */
  document.querySelectorAll("[data-wf-check]").forEach(el=>el.addEventListener("change", ()=>{
    wfToggleCheck(el.dataset.wfCheck, el.checked); renderView();
  }));
  document.querySelectorAll("[data-wf-leadcall]").forEach(el=>el.addEventListener("change", ()=>{
    const [section,clientId] = el.dataset.wfLeadcall.split("|");
    wfToggleLeadCall(section, clientId, el.checked); renderView();
  }));
  function wfAddNote(section,type){
    const input = document.querySelector(`[data-wf-note-input="${section}|${type}"]`);
    const text = input.value.trim();
    if(!text) return;
    const list = wfNotes(section,type);
    list.push({ text, done:false });
    wfSetNotes(section,type,list);
    renderView();
  }
  document.querySelectorAll("[data-wf-note-add]").forEach(el=>el.addEventListener("click", ()=>{
    const [section,type] = el.dataset.wfNoteAdd.split("|");
    wfAddNote(section,type);
  }));
  document.querySelectorAll("[data-wf-note-input]").forEach(el=>el.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ const [section,type]=el.dataset.wfNoteInput.split("|"); wfAddNote(section,type); }
  }));
  document.querySelectorAll("[data-wf-note-toggle]").forEach(el=>el.addEventListener("change", ()=>{
    const [section,type,idx] = el.dataset.wfNoteToggle.split("|");
    const list = wfNotes(section,type);
    if(list[idx]){ list[idx].done = el.checked; wfSetNotes(section,type,list); renderView(); }
  }));
  document.querySelectorAll("[data-wf-note-del]").forEach(el=>el.addEventListener("click", ()=>{
    const [section,type,idx] = el.dataset.wfNoteDel.split("|");
    const list = wfNotes(section,type);
    list.splice(+idx,1); wfSetNotes(section,type,list); renderView();
  }));
  document.querySelectorAll("[data-wf-report]").forEach(el=>el.addEventListener("input", ()=>{
    const patch = {}; patch[el.dataset.wfReport] = el.value;
    wfSetReport(patch);
  }));
  const wfGenBtn = document.querySelector("[data-wf-generate-report]");
  if(wfGenBtn) wfGenBtn.addEventListener("click", ()=>{
    const rep = wfReport();
    const lines = [
      rep.coldCalls>0?`Made ${rep.coldCalls} cold call${rep.coldCalls!=1?"s":""}.`:"",
      rep.oldLeads>0?`Called ${rep.oldLeads} old lead${rep.oldLeads!=1?"s":""}.`:"",
      rep.meetings>0?`Booked ${rep.meetings} meeting${rep.meetings!=1?"s":""}.`:"",
      wfDmsForDate(todayStr())>0?`Sent ${wfDmsForDate(todayStr())} LinkedIn DM${wfDmsForDate(todayStr())!=1?"s":""}.`:"",
      rep.revenue>0?`Generated ${fmtMoney(rep.revenue)} in revenue.`:"",
    ].filter(Boolean);
    const summary = `Daily Report — ${fmtDateLong(todayStr())}\n\n${lines.length?lines.join(" "):"No activity logged today."}${rep.notes?"\n\nNotes: "+rep.notes:""}`;
    const out = document.getElementById("wfReportOutput");
    out.innerHTML = `<div class="panel" style="margin-top:12px;background:var(--surface-2)"><div style="white-space:pre-wrap;font-size:12.5px;line-height:1.7">${summary.replace(/</g,"&lt;")}</div><button class="btn ghost sm" style="margin-top:10px" id="wfCopyReport">${icon("check")} Copy report</button></div>`;
    document.getElementById("wfCopyReport").addEventListener("click", ()=>{
      navigator.clipboard.writeText(summary).then(()=>toast("Copied"));
    });
  });
  const wfResetBtn = document.querySelector("[data-wf-reset-day]");
  if(wfResetBtn) wfResetBtn.addEventListener("click", ()=>{
    if(!confirm("Reset today's workflow checklist, notes and report?")) return;
    const d = todayStr();
    Object.keys(state.workflow.checks).forEach(k=>{ if(k.startsWith(d+"|")) delete state.workflow.checks[k]; });
    Object.keys(state.workflow.notes).forEach(k=>{ if(k.startsWith(d+"|")) delete state.workflow.notes[k]; });
    Object.keys(state.workflow.leadCalls).forEach(k=>{ if(k.startsWith(d+"|")) delete state.workflow.leadCalls[k]; });
    delete state.workflow.reports[d];
    save(); renderView(); toast("Today's workflow reset");
  });
}

function exportAllJSON(){
  const data = JSON.stringify(state, null, 2);
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({ filename: "reach-eyeballs-cockpit-backup.json", data }).catch(()=>{
      fallbackDownload(data);
    });
  } else {
    fallbackDownload(data);
  }
}
function fallbackDownload(data){
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "reach-eyeballs-cockpit-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ============================= INIT ============================= */
function renderLogin(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="brand-mark" style="margin:0 auto 14px">RE</div>
        <h2>Reach Eyeballs Cockpit</h2>
        <div class="sub" style="margin-bottom:18px">Sign in to continue</div>
        <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username" /></div>
        <div class="field" style="margin-top:10px"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password" /></div>
        <div id="loginError" class="login-error"></div>
        <button class="btn primary" id="loginSubmit" style="width:100%;margin-top:14px;justify-content:center">Sign in</button>
      </div>
    </div>
  `;
  const submit = async ()=>{
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    boot();
  };
  document.getElementById("loginSubmit").onclick = submit;
  document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
}
async function logout(){
  await sb.auth.signOut();
  boot();
}
async function boot(){
  const app = document.getElementById("app");
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  currentUserEmail = session.user.email;
  app.innerHTML = `<div class="login-screen"><div class="sub">Loading…</div></div>`;
  state = await loadState();
  try{ mergeSheetImport(await fetchFitnessSheetLive()); }
  catch(e){ console.warn("fitness sheet live sync failed, using snapshot", e); mergeSheetImport(); }
  try{ mergeB2BSheetImport(await fetchB2BSheetLive()); }
  catch(e){ console.warn("B2B sheet live sync failed, using snapshot", e); mergeB2BSheetImport(); }
  try{ mergeFinanceSheetImport(await fetchFinanceSheetLive()); }
  catch(e){ console.warn("finance sheet live sync failed", e); }
  renderShell();
}
boot();
})();
