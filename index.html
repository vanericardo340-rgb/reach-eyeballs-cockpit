<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#ffffff; --bg-elevated:#ffffff; --surface:#f4f2ed; --surface-2:#ebe8e1;
    --border:#e7e4db; --border-soft:#eeece4;
    --text:#17161f; --text-dim:#57565f; --text-faint:#8f8d94;
    --accent:#6c4fe0; --accent-strong:#5b3fd1; --accent-soft:rgba(108,79,224,.10);
    --accent2:#e0883e; --accent2-soft:rgba(224,136,62,.12);
    --good:#1a9d6c; --good-soft:rgba(26,157,108,.10);
    --bad:#d8433a; --bad-soft:rgba(216,67,58,.09);
    --warn:#c97a1f; --warn-soft:rgba(224,136,62,.14);
    --radius:16px; --radius-sm:10px;
    --shadow: 0 1px 2px rgba(23,22,31,.04), 0 10px 26px -16px rgba(23,22,31,.16);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  svg{ width:16px; height:16px; display:inline-block; vertical-align:middle; flex-shrink:0; }
  .badge svg{ width:10px; height:10px; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:13.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1,"cv11" 1;
  }
  .tnum{ font-variant-numeric:tabular-nums; }
  h1,h2,h3{ margin:0; font-weight:600; text-wrap:balance; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent-soft); }
  input,select,textarea{
    font-family:inherit; font-size:13px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; outline:none;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  button{ cursor:pointer; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track{ background:transparent; }

  .app{ display:flex; min-height:100vh; }
  /* ---- Daily Workflow (Tab 1 of the Google Doc, modernised) ---- */
  .wf{ max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .wf-hero{ display:grid; grid-template-columns:auto 1fr; gap:6px 18px; align-items:center; padding:20px 22px; border-radius:20px; color:#fff; background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 120%); box-shadow:0 18px 40px -22px rgba(79,70,229,.8); }
  .wf-ring{ position:relative; width:64px; height:64px; grid-row:span 2; }
  .wf-ring svg{ width:100%; height:100%; }
  .wf-ring b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
  .wf-hero-k{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
  .wf-hero-t h2{ font-size:20px; font-weight:800; letter-spacing:-.01em; margin-top:2px; }
  .wf-hero-t p{ font-size:13px; opacity:.85; margin-top:2px; }
  .wf-hero-blocks{ grid-column:2; display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .wf-pip{ position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); color:#fff; border-radius:20px; padding:4px 11px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .wf-pip span{ position:absolute; left:0; top:0; bottom:0; width:var(--p); background:rgba(255,255,255,.22); }
  .wf-pip.now{ background:#fff; color:#4f46e5; border-color:#fff; }
  .wf-pip.full{ border-color:rgba(255,255,255,.7); }
  .wf-timeline{ position:relative; display:flex; flex-direction:column; gap:12px; padding-left:22px; }
  .wf-timeline::before{ content:""; position:absolute; left:7px; top:18px; bottom:18px; width:2px; border-radius:2px; background:linear-gradient(#a78bfa,#fbbf24 30%,#2dd4bf 45%,#f59e0b 60%,#818cf8 80%,#fb7185); opacity:.55; }
  .wf-card{ --c:#7c3aed; --soft:#f3efff; position:relative; background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 1px 2px rgba(20,16,40,.04); transition:box-shadow .2s, border-color .2s, transform .2s; }
  .wf-card::before{ content:""; position:absolute; left:-20px; top:22px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--c); }
  .wf-card.c-violet{ --c:#7c3aed; --soft:#f3efff; } .wf-card.c-amber{ --c:#e08a00; --soft:#fff5e1; } .wf-card.c-teal{ --c:#0f9d8f; --soft:#e3f7f4; }
  .wf-card.c-gold{ --c:#d97706; --soft:#fff3d6; } .wf-card.c-indigo{ --c:#4f46e5; --soft:#eef0ff; } .wf-card.c-rose{ --c:#e11d48; --soft:#ffe9ee; }
  .wf-card.now{ border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), 0 16px 34px -22px var(--c); }
  .wf-card.now::before{ background:var(--c); box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
  .wf-card.c-gold{ background:linear-gradient(180deg,#fffaf0,#fff 60%); }
  .wf-card.complete{ opacity:.78; }
  .wf-card-h{ display:flex; align-items:center; gap:12px; padding:14px 16px 10px; }
  .wf-ic{ width:38px; height:38px; flex-shrink:0; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:var(--c); background:var(--soft); }
  .wf-ic svg{ width:19px; height:19px; }
  .wf-card-t{ flex:1; min-width:0; }
  .wf-card-t h2{ font-size:16px; font-weight:800; letter-spacing:-.01em; color:var(--text); }
  .wf-card-sub{ display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-top:1px; }
  .wf-card-r{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .wf-time{ font-size:12px; font-weight:700; color:var(--c); background:var(--soft); border-radius:20px; padding:4px 10px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .wf-now{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--c); border-radius:20px; padding:4px 9px; }
  .wf-now i{ width:6px; height:6px; border-radius:50%; background:#fff; animation:wfPulse 1.6s ease-in-out infinite; }
  @keyframes wfPulse{ 50%{ opacity:.3; } }
  .wf-mini{ min-width:34px; height:24px; padding:0 7px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; color:var(--text-dim); background:var(--surface); font-variant-numeric:tabular-nums; }
  .wf-mini.full{ background:var(--good); color:#fff; }
  .wf-mini svg{ width:13px; height:13px; }
  .wf-card-b{ padding:0 16px 14px 66px; }
  .wf-ul{ list-style:none; margin:0; padding:0; }
  .wf-ul.d1, .wf-ul.d2{ margin:4px 0 2px 12px; padding-left:16px; border-left:2px solid var(--soft); }
  .wf-ul li{ margin:2px 0; }
  .wf-line{ display:flex; align-items:flex-start; gap:10px; padding:5px 8px; margin:0 -8px; border-radius:10px; transition:background .15s; }
  .wf-line:hover{ background:var(--surface); }
  .wf-txt{ flex:1; min-width:0; font-size:14.5px; line-height:1.5; color:var(--text); display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  .wf-check{ flex-shrink:0; width:20px; height:20px; margin-top:1px; border-radius:7px; border:2px solid #cfcbd9; background:#fff; display:inline-flex; align-items:center; justify-content:center; color:transparent; cursor:pointer; padding:0; transition:all .15s; }
  .wf-check svg{ width:12px; height:12px; }
  .wf-check:hover{ border-color:var(--c); }
  .wf-check.on{ background:var(--c); border-color:var(--c); color:#fff; transform:scale(1.04); }
  .wf-dot{ flex-shrink:0; width:7px; height:7px; margin:8px 6px 0 7px; border-radius:50%; background:var(--c); opacity:.7; }
  li.done > .wf-line .wf-txt, .wf-single.done .wf-txt{ color:var(--text-faint); text-decoration:line-through; text-decoration-color:#c8c5cf; }
  li.must > .wf-line{ background:linear-gradient(90deg, var(--soft), transparent 85%); }
  .wf-must{ font-weight:800; }
  .wf-must-tag{ font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius:20px; padding:1px 7px; }
  li.done .wf-must-tag{ display:none; }
  .wf-btn{ display:inline-flex; align-items:center; gap:6px; margin-left:4px; font-size:12.5px; font-weight:700; color:#fff; background:linear-gradient(135deg,#7c3aed,#4f46e5); border-radius:20px; padding:5px 12px; text-decoration:none; box-shadow:0 6px 14px -8px #4f46e5; transition:transform .15s, box-shadow .15s; }
  .wf-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 18px -8px #4f46e5; }
  .wf-btn svg{ width:13px; height:13px; }
  .wf-strong{ font-weight:700; }
  .wf-label{ font-weight:700; color:var(--text-dim); font-size:13px; }
  .wf-link{ display:inline-flex; align-items:center; gap:6px; color:#1d4ed8; font-weight:600; background:#eef4ff; border:1px solid #d6e2fd; border-radius:9px; padding:3px 10px; text-decoration:none; }
  .wf-link:hover{ background:#e0ebff; }
  .wf-link svg{ width:13px; height:13px; }
  .wf-required{ border-radius:20px; padding:20px 22px; background:linear-gradient(135deg,#fff7ed 0%,#fef3c7 45%,#fde68a 140%); border:1px solid #fcd9a1; box-shadow:0 14px 32px -24px rgba(217,119,6,.7); }
  .wf-req-h{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .wf-req-ic{ width:40px; height:40px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#f59e0b,#ea580c); color:#fff; box-shadow:0 8px 18px -10px #ea580c; }
  .wf-req-ic svg{ width:19px; height:19px; }
  .wf-req-h h2{ font-size:17px; font-weight:800; color:#7c2d12; letter-spacing:-.01em; }
  .wf-req-h p{ font-size:12.5px; color:#9a3412; opacity:.85; margin-top:1px; }
  .wf-req-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .wf-req-g{ background:rgba(255,255,255,.75); border:1px solid rgba(251,191,36,.45); border-radius:14px; padding:14px 16px; }
  .wf-req-g h3{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:800; color:#7c2d12; margin-bottom:8px; }
  .wf-req-g h3 svg{ width:15px; height:15px; color:#ea580c; }
  .wf-req-g ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .wf-req-g li{ display:flex; gap:8px; align-items:flex-start; font-size:13.5px; line-height:1.45; color:#431407; }
  .wf-req-g li svg{ flex-shrink:0; width:14px; height:14px; margin-top:3px; color:#16a34a; }
  @media (max-width:720px){
    .wf-hero{ grid-template-columns:auto 1fr; padding:16px; }
    .wf-hero-blocks{ grid-column:1 / -1; }
    .wf-hero-t h2{ font-size:17px; }
    .wf-card-h{ flex-wrap:wrap; padding:12px 12px 8px; }
    .wf-card-r{ width:100%; padding-left:50px; }
    .wf-card-b{ padding:0 12px 12px 14px; }
    .wf-timeline{ padding-left:16px; }
    .wf-timeline::before{ left:4px; }
    .wf-card::before{ left:-17px; width:10px; height:10px; }
    .wf-req-grid{ grid-template-columns:1fr; }
    .wf-required{ padding:16px; }
  }

  /* ---- Fitness · Health dashboard ---- */
  .hd{ display:flex; flex-direction:column; gap:16px; }
  .hd-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .hd-h1{ font-size:26px; letter-spacing:-.02em; font-weight:800; }
  .hd-sub{ color:var(--text-dim); font-size:13.5px; margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .hd-live{ display:inline-flex; align-items:center; gap:6px; color:var(--text-faint); font-size:12px; }
  .hd-live a{ color:var(--text-dim); }
  .hd-live i{ width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft); }
  .hd-top-r{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .hd-period{ position:relative; display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:9px 34px 9px 12px; font-size:13px; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:pointer; }
  .hd-period > svg:first-child{ width:16px; height:16px; color:var(--text-dim); }
  .hd-period select{ position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; }
  .hd-chev{ position:absolute; right:11px; width:15px; height:15px; color:var(--text-dim); pointer-events:none; }
  .hd-add{ padding:10px 16px; border-radius:12px; font-size:13px; box-shadow:0 6px 16px rgba(108,79,224,.25); }
  .hd-kpis{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
  .hd-kpi{ display:flex; gap:12px; align-items:flex-start; border-radius:16px; padding:16px; border:1px solid rgba(0,0,0,.04); min-width:0; }
  .hd-kpi-ic{ width:40px; height:40px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.7); }
  .hd-kpi-ic svg{ width:20px; height:20px; }
  .hd-kpi-l{ font-size:12.5px; font-weight:600; color:var(--text-dim); }
  .hd-kpi-v{ font-size:25px; font-weight:800; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hd-kpi-f{ margin-top:6px; }
  .hd-kpi.green{ background:linear-gradient(135deg,#e6f7ee,#d9f2e5); } .hd-kpi.green .hd-kpi-ic{ color:#1a9d6c; }
  .hd-kpi.violet{ background:linear-gradient(135deg,#efeafd,#e5ddfb); } .hd-kpi.violet .hd-kpi-ic{ color:#6c4fe0; }
  .hd-kpi.orange{ background:linear-gradient(135deg,#fff1e3,#ffe6cf); } .hd-kpi.orange .hd-kpi-ic{ color:#e0803e; }
  .hd-kpi.sky{ background:linear-gradient(135deg,#e7f4fd,#d9eefc); } .hd-kpi.sky .hd-kpi-ic{ color:#2b8fd6; }
  .hd-kpi.blue{ background:linear-gradient(135deg,#e6efff,#dae6ff); } .hd-kpi.blue .hd-kpi-ic{ color:#2563EB; }
  .hd-pill{ display:inline-flex; align-items:center; gap:3px; border-radius:20px; padding:2px 8px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .hd-pill.good{ background:var(--good-soft); color:var(--good); }
  .hd-pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .hd-row{ display:grid; grid-template-columns:1.55fr 1fr; gap:16px; }
  .hd-card{ background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px 20px; box-shadow:0 1px 3px rgba(20,16,40,.04); min-width:0; }
  .hd-card-h{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .hd-card-h h2{ display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .hd-ic{ width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; }
  .hd-ic svg{ width:18px; height:18px; }
  .hd-ic.violet{ background:#efeafd; color:#6c4fe0; }
  .hd-seg{ display:inline-flex; background:var(--surface); border-radius:12px; padding:3px; gap:2px; }
  .hd-seg button{ border:0; background:transparent; padding:7px 16px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; }
  .hd-seg button.on{ background:var(--accent); color:#fff; box-shadow:0 3px 10px rgba(108,79,224,.3); }
  .hd-chart{ position:relative; }
  .hd-chart svg{ width:100%; height:auto; display:block; }
  .hd-grid{ stroke:#efedf3; stroke-width:1; }
  .hd-ax{ font-size:11px; fill:var(--text-faint); font-family:inherit; }
  .hd-cursor{ stroke:rgba(108,79,224,.35); stroke-dasharray:3 3; }
  .hd-tip{ position:absolute; transform:translateX(-50%); background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px 12px; box-shadow:0 8px 24px rgba(20,16,40,.12); pointer-events:none; display:flex; flex-direction:column; align-items:center; white-space:nowrap; z-index:2; max-width:260px; }
  .hd-tip b{ font-size:15px; font-weight:800; }
  .hd-tip span{ font-size:12px; font-weight:700; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; max-width:236px; }
  .hd-tip span.good{ color:var(--good); } .hd-tip span.bad{ color:var(--bad); }
  .hd-tip em{ font-style:normal; font-size:10.5px; color:var(--text-faint); margin-top:1px; }
  .hd-chart-empty{ padding:70px 10px; text-align:center; color:var(--text-faint); font-size:13px; }
  .hd-glance{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .hd-ring{ position:relative; width:170px; height:170px; flex-shrink:0; margin:auto; }
  .hd-ring svg{ width:100%; height:100%; }
  .hd-ring div{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .hd-ring b{ font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .hd-ring span{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .hd-glance-l{ list-style:none; margin:0; padding:0; flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px; }
  .hd-glance-l li{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border-radius:11px; padding:10px 12px; font-size:13px; }

  .hd-glance-l li span svg{ width:16px; height:16px; }
  .hd-glance-l b{ font-weight:800; font-variant-numeric:tabular-nums; }
  .hd-glance-l b.good{ color:var(--good); } .hd-glance-l b.bad{ color:var(--bad); }
  .hd-table-wrap{ overflow-x:auto; }
  .hd-table{ width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .hd-table th{ text-align:left; font-size:12px; color:var(--text-dim); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .hd-table td{ padding:9px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }

  .hd-table tr.cur td{ background:rgba(108,79,224,.04); }
  .hd-log thead th{ background:var(--surface); }
  .hd-log thead th:first-child{ border-radius:10px 0 0 10px; } .hd-log thead th:last-child{ border-radius:0 10px 10px 0; }
  .hd-date{ display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .hd-date svg{ width:18px; height:18px; flex-shrink:0; }
  .hd-food{ min-width:220px; max-width:520px; color:var(--text); white-space:normal; overflow-wrap:anywhere; line-height:1.45; }
  .hd-acts{ display:inline-flex; gap:2px; justify-content:flex-end; }
  .hd-src{ margin-left:8px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--good); background:var(--good-soft); border-radius:5px; padding:1px 5px; vertical-align:1px; }
  .hd-log .icon-btn svg{ width:15px; height:15px; }
  .nowrap{ white-space:nowrap; }

  .user-email{ font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .storage-note{ font-size:10.5px; color:var(--text-faint); line-height:1.5; }
  .storage-note button{ background:none; border:none; color:var(--accent-strong); padding:0; font-size:10.5px; text-decoration:underline; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    padding:18px 30px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;
    align-items:flex-start; gap:16px; flex-wrap:wrap; background:linear-gradient(180deg,var(--bg-elevated),var(--bg));
  }
  .topbar h1{ font-size:19px; letter-spacing:-.01em; }
  .topbar .sub{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .content{ padding:22px 30px 70px; max-width:1360px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:8px 13px; border-radius:9px; font-size:12.5px; font-weight:600;
  }
  .btn:hover{ background:var(--surface); border-color:#31353f; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn.ghost:hover{ background:var(--surface); color:var(--text); }
  .btn.danger{ color:var(--bad); }
  .btn.sm{ padding:5px 9px; font-size:11.5px; }
  .btn svg{ width:14px; height:14px; }

  .seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; gap:1px; }
  .seg button{ background:transparent; border:none; color:var(--text-dim); font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:7px; }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  .section-label{
    font-size:12px; color:var(--text-faint); margin-bottom:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .section-label b{ color:var(--text-dim); font-weight:600; }

  /* ---------- Cards / grid ---------- */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .grid.cols-5{ grid-template-columns:repeat(5,1fr); gap:8px; }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:1080px){ .grid,.grid.cols-4{ grid-template-columns:repeat(2,1fr); } .grid.cols-5{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px){ .grid,.grid.cols-4,.grid.cols-2,.grid.cols-5{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 17px; position:relative; overflow:hidden;
  }
  .card.stat{ display:flex; flex-direction:column; gap:6px; }
  .card.stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; display:flex; align-items:center; gap:7px; }
  .card.stat .value-row{ display:flex; align-items:baseline; gap:9px; margin-top:1px; }
  .card.stat .value{ font-size:27px; font-weight:700; letter-spacing:-.02em; }
  .card.stat .caption{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .card.stat .target-line{ font-size:10.5px; color:var(--text-faint); margin-top:6px; padding-top:8px; border-top:1px dashed var(--border-soft); }
  .card.stat.attn{ border-color:rgba(216,67,58,.32); background:linear-gradient(180deg,rgba(216,67,58,.06),var(--surface)); }
  .card.stat.rate{
    padding:11px 13px; gap:3px; border-color:transparent; color:#fff;
    background:linear-gradient(155deg,#5A5FD9,#4A47C4);
    box-shadow:0 1px 2px rgba(23,22,31,.04), 0 8px 16px -12px rgba(23,22,31,.3);
  }
  .card.stat.rate .label{ font-size:9.5px; color:rgba(255,255,255,.72); gap:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.stat.rate .value{ font-size:19px; color:#fff; }
  .card.stat.rate .value-row{ margin-top:0; }
  .card.stat.warmth{ border-left:3px solid var(--accent); }
  .card.stat.hero{
    border-color:transparent;
    box-shadow:0 1px 2px rgba(23,22,31,.04), 0 12px 22px -14px rgba(23,22,31,.32);
  }
  .card.stat.hero .label{ color:rgba(255,255,255,.74); }
  .card.stat.hero .value{ color:#fff; }
  .card.stat.hero .caption{ color:rgba(255,255,255,.7); }
  .card.stat.hero .cell-muted{ color:rgba(255,255,255,.62); }
  .card.stat.hero .target-line{ color:rgba(255,255,255,.6); border-top-color:rgba(255,255,255,.22); }
  /* Rotating purple/plum/orange family so a grid of hero cards doesn't read as one flat block */
  .card.stat.hero:nth-child(6n+1){ background:linear-gradient(155deg,#7A63E8,#5B3FD1); }
  .card.stat.hero:nth-child(6n+2){ background:linear-gradient(155deg,#9D7CF2,#7458DE); }
  .card.stat.hero:nth-child(6n+3){ background:linear-gradient(155deg,#E39A56,#C9701F); }
  .card.stat.hero:nth-child(6n+4){ background:linear-gradient(155deg,#A85BC7,#82399F); }
  .card.stat.hero:nth-child(6n+5){ background:linear-gradient(155deg,#6E6BDE,#4A47C4); }
  .card.stat.hero:nth-child(6n+6){ background:linear-gradient(155deg,#C2679A,#9C4677); }
  /* Outcome/closing metrics get their own green family, overriding the rotation above */
  .card.stat.hero.hero-g1{ background:linear-gradient(155deg,#4FC9A6,#2FA687); }
  .card.stat.hero.hero-g2{ background:linear-gradient(155deg,#34B674,#1F8F57); }
  .card.stat.hero.hero-g3{ background:linear-gradient(155deg,#7CB86B,#5B9650); }
  .card.stat.hero.hero-g4{ background:linear-gradient(155deg,#2E9E5B,#1D7A44); }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2.5px 7px; border-radius:20px; }
  .badge.good{ background:var(--good-soft); color:var(--good); }
  .badge.bad{ background:var(--bad-soft); color:var(--bad); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .delta{ font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:2px; }
  .delta.up{ color:var(--good); } .delta.down{ color:var(--bad); } .delta.flat{ color:var(--text-faint); }

  .spark{ position:absolute; right:14px; top:14px; opacity:.9; }

  /* ---------- Panels (funnel, table, chart containers) ---------- */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 19px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-head h3{ font-size:13.5px; }
  .panel-head .sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .panel-row{ display:grid; grid-template-columns:1.1fr .9fr; gap:12px; margin-bottom:12px; align-items:start; }
  @media (max-width:940px){ .panel-row{ grid-template-columns:1fr; } }

  .funnel-row{ display:grid; grid-template-columns:110px 1fr 60px 46px; align-items:center; gap:10px; padding:6px 0; font-size:12px; }
  .funnel-row .fname{ color:var(--text-dim); }
  .funnel-track{ height:9px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .funnel-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
  .funnel-row .fcount{ text-align:right; font-weight:700; }
  .funnel-row .fpct{ text-align:right; color:var(--text-faint); font-size:11px; }

  .insight-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
  @media (max-width:940px){ .insight-row{ grid-template-columns:1fr; } }
  .insight{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:11px; padding:11px 13px; font-size:11.5px; color:var(--text-dim); }
  .insight b{ color:var(--text); display:block; font-size:12.5px; margin-bottom:2px; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
  thead th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
    font-weight:700; padding:0 10px 9px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num,th.num{ text-align:right; }
  .row-actions{ display:flex; gap:4px; justify-content:flex-end; }
  .icon-btn{ background:transparent; border:none; color:var(--text-faint); padding:4px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }
  .icon-btn svg{ width:14px; height:14px; }
  .pill{ font-size:10.5px; font-weight:700; padding:2.5px 8px; border-radius:20px; display:inline-block; text-transform:capitalize; }
  .pill.active{ background:var(--good-soft); color:var(--good); }
  .pill.paused{ background:var(--warn-soft); color:var(--warn); }
  .pill.churned{ background:var(--bad-soft); color:var(--bad); }
  .cell-muted{ color:var(--text-faint); }
  .col-total{ background:var(--accent-soft) !important; }
  thead th.col-total{ color:var(--accent-strong); }
  tr.row-total{ background:var(--accent-soft) !important; }
  tr.row-total td{ font-weight:700; }
  .empty-row td{ text-align:center; color:var(--text-faint); padding:34px 10px; }

  /* ---------- Empty state ---------- */
  .empty-state{ text-align:center; padding:46px 20px; color:var(--text-faint); }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }
  .empty-state h4{ color:var(--text-dim); font-size:13.5px; margin-bottom:4px; }
  .empty-state p{ font-size:12px; margin:0 auto 14px; max-width:320px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(5,6,9,.6); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -20px rgba(23,22,31,.28); }
  .modal-head{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg-elevated); }
  .modal-head h3{ font-size:15px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-grid.one{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .field input,.field select,.field textarea{ width:100%; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-span2{ grid-column:1 / -1; }

  /* ---------- Chart wraps ---------- */
  .chart-wrap{ padding-top:4px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-faint); margin-bottom:8px; }
  .legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }

  /* ---------- Today alert cards ---------- */
  .attn-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .attn-card{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; transition:transform .12s,box-shadow .12s; }
  .attn-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .attn-card .num{ font-size:32px; font-weight:800; }
  .attn-card.warn{ background:linear-gradient(180deg,var(--bad-soft),var(--surface) 55%); border-left-color:var(--bad); }
  .attn-card.warn .num{ color:var(--bad); }
  .attn-card .title{ font-size:13px; font-weight:600; margin-top:4px; }
  .attn-card .desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .attn-card.ok{ background:linear-gradient(180deg,var(--good-soft),var(--surface) 55%); border-left-color:var(--good); }
  .attn-card.ok .num{ color:var(--good); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:10px 16px; border-radius:10px; font-size:12.5px; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ---------- B2B month/dashboard tabs ---------- */
  .b2b-tabbar{ display:flex; gap:4px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .b2b-tab{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600; }
  .b2b-tab:hover{ background:var(--surface); color:var(--text); }
  .b2b-tab.active{ background:var(--accent-soft); color:var(--accent-strong); border-color:rgba(108,79,224,.3); }
  .b2b-tab svg{ width:13px; height:13px; }
  .tab-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); display:inline-block; margin-left:6px; vertical-align:middle; }

  /* ---------- Ads Acquisition ---------- */
  .aa-filterbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border-soft); }
  .aa-filterbar select{ font-size:11.5px; padding:6px 9px; }
  .aa-search{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:0 9px; }
  .aa-search svg{ width:14px; height:14px; color:var(--text-faint); flex-shrink:0; }
  .aa-search input{ border:none; background:transparent; padding:7px 0; font-size:12px; width:160px; }
  .aa-search input:focus{ box-shadow:none; }
  .aa-inline-input{ width:84px; text-align:right; padding:5px 7px; font-size:12px; background:var(--surface-2); }
  .aa-inline-input:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- Daily workflow ---------- */
  .wf-quicklinks{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .wf-banner{ font-size:11.5px; background:var(--accent2-soft); color:var(--accent2); border:1px solid rgba(224,136,62,.3); border-radius:9px; padding:8px 12px; display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .wf-check-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .wf-check-row:last-child{ border-bottom:none; }
  .wf-check-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--good); cursor:pointer; flex-shrink:0; }
  .wf-check-row .label{ flex:1; }
  .wf-check-row .label.done{ text-decoration:line-through; color:var(--text-faint); }
  .wf-two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:12px; align-items:start; margin-bottom:12px; }
  @media (max-width:940px){ .wf-two-col{ grid-template-columns:1fr; } }
  .wf-note-panel{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:11px; padding:12px; margin-bottom:10px; }
  .wf-note-panel.hot{ border-color:rgba(224,136,62,.3); background:linear-gradient(180deg,rgba(224,136,62,.08),var(--surface-2)); }
  .wf-note-panel .hd{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .wf-note-add{ display:flex; gap:6px; margin-bottom:8px; }
  .wf-note-add input{ flex:1; }
  .wf-note-item{ display:flex; align-items:flex-start; gap:6px; padding:5px 0; border-bottom:1px solid var(--border-soft); font-size:12px; }
  .wf-note-item:last-child{ border-bottom:none; }
  .wf-note-item .txt{ flex:1; }
  .wf-note-item .txt.done{ text-decoration:line-through; color:var(--text-faint); }
  .wf-eod-link{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); text-decoration:none; color:var(--text); margin-bottom:8px; }
  .wf-eod-link:hover{ background:var(--surface); }
  .wf-eod-link .ic{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent-strong); }
  .wf-eod-link .t b{ display:block; font-size:12.5px; }
  .wf-eod-link .t span{ font-size:11px; color:var(--text-faint); }
  .wf-progress{ height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:8px; }
  .wf-progress-fill{ height:100%; background:var(--good); }

  .view{ display:none; }
  .view.active{ display:block; }

  .kbd-hint{ font-size:11px; color:var(--text-faint); }

  /* mobile sidebar */
  @media (max-width:880px){
    .app{ flex-direction:column; }
    .sidebar{ position:sticky; top:0; z-index:50; width:100%; height:auto; flex-direction:row; align-items:center; border-right:none; border-bottom:1px solid var(--border); overflow-x:auto; }
    .brand{ padding:12px 14px; }
    .brand-sub{ display:none; }
    nav.navlist{ flex-direction:row; padding:8px; }
    .navitem .t span{ display:none; }
    .sidebar-foot{ display:none; }
    .content{ padding:18px 16px 60px; }
    .topbar{ padding:14px 16px; }
  }


  /* ---------- Daily Workflow cockpit (dark by design, scoped to this view) ----------
     Layout: header + 4 metric tiles, then three day blocks (banner → focus | top 3 → leads), recap footer. */
  .cockpit{
    --cp-bg:#0b0c0e; --cp-card:#141518; --cp-card-2:#1a1b1f; --cp-row:#18191d;
    --cp-line:rgba(236,228,214,.08); --cp-line-2:rgba(236,228,214,.14);
    --cp-text:#ecebe6; --cp-dim:#aaa79f; --cp-faint:#726f69;
    --cp-gold:#e9b35f; --cp-gold-soft:rgba(233,179,95,.14);
    --cp-teal:#72c7b8; --cp-blue:#4b9fe1; --cp-green:#74c08a; --cp-red:#e2705f; --cp-amber:#e7a94f;
    --cp-serif:"Newsreader","Iowan Old Style",Georgia,serif;
    --cp-sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color-scheme:dark;
    background:radial-gradient(1200px 500px at 15% -10%, rgba(233,179,95,.06), transparent 60%), var(--cp-bg);
    color:var(--cp-text); font-family:var(--cp-sans); font-size:13.5px;
    min-height:100vh; padding:26px 28px 60px;
    display:flex; flex-direction:column; gap:14px;
  }
  .cockpit.is-day{
    --cp-bg:#180f2c;
    background:radial-gradient(1100px 520px at 12% -12%, rgba(150,100,255,.16), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(233,179,95,.05), transparent 60%), var(--cp-bg);
  }
  .cockpit{ transition:background-color .6s ease; }
  .cockpit > *{ max-width:1180px; width:100%; margin-inline:auto; }
  .cockpit svg{ width:16px; height:16px; }
  .cockpit ::selection{ background:var(--cp-gold-soft); }
  .cockpit button{ font-family:inherit; color:inherit; }
  .cockpit .tnum{ font-variant-numeric:tabular-nums; }
  .cockpit :focus-visible{ outline:2px solid var(--cp-gold); outline-offset:2px; box-shadow:none; }

  /* header */
  .cp-header{ display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; }
  .cp-greet{ display:flex; align-items:center; gap:16px; }
  .cp-sun{ color:var(--cp-gold); display:flex; }
  .cp-sun svg{ width:42px; height:42px; }
  .cp-title{ font-family:var(--cp-serif); font-weight:500; font-size:26px; letter-spacing:-.005em; color:var(--cp-text); }
  .cp-date{ color:var(--cp-dim); font-size:12.5px; margin-top:3px; }
  .cp-quotebox{ margin:0; padding:14px 26px 14px 30px; border:1px solid var(--cp-line-2); border-radius:14px; background:rgba(255,255,255,.015); max-width:330px; }
  .cp-quotebox p{ margin:0; font-family:var(--cp-serif); font-size:16.5px; color:var(--cp-text); line-height:1.3; }
  .cp-quotebox footer{ font-size:11.5px; color:var(--cp-dim); margin-top:3px; }
  .cp-quicklinks{ display:flex; gap:6px; flex-wrap:wrap; }
  .cp-quicklinks a{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:20px; border:1px solid var(--cp-line); color:var(--cp-dim); text-decoration:none; font-size:11.5px; font-weight:600; transition:border-color .15s,color .15s; }
  .cp-quicklinks a:hover{ color:var(--cp-text); border-color:var(--cp-line-2); }

  /* metric tiles */

  .cp-metric-ic.gold{ color:var(--cp-gold); } .cp-metric-ic.blue{ color:#f0914a; } .cp-metric-ic.bad{ color:var(--cp-red); } .cp-metric-ic.teal{ color:var(--cp-text); }

  /* day blocks */

  .cp-two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* part-of-day colours */

  #cp-dawn{ --blk:244,170,196; } #cp-morning{ --blk:120,190,245; } #cp-golden{ --blk:244,192,96; } #cp-evening{ --blk:242,134,104; } #cp-eod{ --blk:142,148,240; }
  .cp-block .cp-card{ border-color:rgba(var(--blk),.26); background:linear-gradient(180deg, rgba(var(--blk),.09), rgba(var(--blk),0) 110px), var(--cp-card); }

  .cp-go{ background:transparent; border:none; color:var(--cp-dim); display:flex; padding:4px; border-radius:6px; cursor:pointer; text-decoration:none; flex-shrink:0; }

  .cp-card-foot{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:auto; }

  .cp-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--cp-card-2); border:1px solid var(--cp-line-2); color:var(--cp-text); padding:7px 12px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none; }

  .cp-link{ background:none; border:none; padding:0; color:var(--cp-dim); font-size:12px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; text-decoration:none; white-space:nowrap; }

  .cp-empty{ font-size:12.5px; color:var(--cp-dim); padding:14px; border:1px dashed var(--cp-line-2); border-radius:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  /* leads */
  .cp-lead{ display:grid; grid-template-columns:38px minmax(150px,1.3fr) auto minmax(120px,1fr) 24px; align-items:center; gap:14px; padding:10px 12px; background:var(--cp-row); border:1px solid var(--cp-line); border-radius:12px; transition:border-color .15s,opacity .2s; }

  .cp-avatar{ width:38px; height:38px; border-radius:50%; border:1px solid var(--cp-line-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; letter-spacing:.02em; cursor:pointer; padding:0; color:#f4efe6; transition:background .2s; }
  .cp-avatar.h0{ background:linear-gradient(145deg,#5b4a3a,#2c241d); } .cp-avatar.h1{ background:linear-gradient(145deg,#3d4f55,#1f282b); }
  .cp-avatar.h2{ background:linear-gradient(145deg,#574152,#2a2029); } .cp-avatar.h3{ background:linear-gradient(145deg,#4a5240,#252a1f); }
  .cp-avatar[aria-checked="true"]{ background:var(--cp-teal); color:#0b0c0e; }
  .cp-avatar svg{ width:16px; height:16px; }
  .cp-lead-main{ min-width:0; }
  .cp-lead-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cp-lead-name{ background:none; border:none; padding:0; font-size:13px; font-weight:600; color:var(--cp-text); cursor:pointer; text-align:left; }
  .cp-lead-name:hover{ text-decoration:underline; text-underline-offset:3px; }
  .cp-lead-meta{ font-size:11.5px; color:var(--cp-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-badge{ font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:10px; white-space:nowrap; }
  .cp-badge.good{ background:rgba(116,192,138,.18); color:#9bd8ab; }

  .cp-lead-actions{ display:flex; gap:16px; }
  .cp-act{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--cp-text); text-decoration:none; background:none; border:none; padding:4px 2px; cursor:pointer; }

  .cp-act.off:hover{ color:var(--cp-dim); }
  .cp-lead-next{ font-size:12px; color:#d9d6cf; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .cp-phone{ display:block; font-size:10.5px; margin-top:1px; user-select:all; }
  .cp-rounds{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--cp-line); }
  .cp-rounds .cp-kicker{ margin-right:4px; }
  .cp-chip{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; border:1px solid var(--cp-line-2); background:transparent; font-size:11.5px; color:var(--cp-dim); cursor:pointer; }
  .cp-chip.on{ background:rgba(114,199,184,.14); border-color:rgba(114,199,184,.4); color:var(--cp-teal); }
  .cp-chip svg{ width:12px; height:12px; }

  .cp-today-tasks .cp-sub{ margin-top:-4px; }
  /* light colour per part of the day */
  .blk-dawn{ --blk:#b9a8ff; --blk-rgb:185,168,255; }
  .blk-morning{ --blk:#8cc4ff; --blk-rgb:140,196,255; }
  .blk-golden{ --blk:#f6b97a; --blk-rgb:246,185,122; }
  .blk-evening{ --blk:#8fd6a8; --blk-rgb:143,214,168; }
  .blk-eod{ --blk:#f2a3c0; --blk-rgb:242,163,192; }
  .cp-block .cp-card{ background:linear-gradient(135deg, rgba(var(--blk-rgb),.10), rgba(var(--blk-rgb),.02) 55%), var(--cp-card); border-color:rgba(var(--blk-rgb),.22); }
  .cp-block .cp-head-ic{ color:var(--blk); }
  .cp-block .cp-range, .cp-block .cp-range.golden{ color:var(--blk); background:rgba(var(--blk-rgb),.13); border-color:rgba(var(--blk-rgb),.35); }
  .cp-block .cp-check.round.on, .cp-block .cp-check.on{ background:var(--blk); border-color:var(--blk); }
  .cp-block .cp-check:hover{ border-color:var(--blk); }
  .cp-block .cp-tl.current .cp-item-label{ color:var(--blk); }
  .cp-block .cp-row, .cp-block .cp-lead{ border-color:rgba(var(--blk-rgb),.16); }
  .cp-block .pop{ animation:cpPopBlk .35s ease-out; }
  @keyframes cpPopBlk{ 0%{ background-color:rgba(var(--blk-rgb),.16); } 100%{ background-color:transparent; } }
  .cp-tasks-row{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px; align-items:stretch; }
  @media (max-width:860px){ .cp-tasks-row{ grid-template-columns:1fr; } }
  .cp-tabs{ display:flex; gap:4px; background:rgba(255,255,255,.04); border:1px solid var(--cp-line); border-radius:12px; padding:3px; flex-wrap:wrap; }
  .cp-tabs button{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:none; color:var(--cp-dim); font-family:var(--cp-serif); font-size:15.5px; padding:6px 13px; border-radius:9px; cursor:pointer; transition:background .15s,color .15s; }
  .cp-tabs button svg{ width:15px; height:15px; color:var(--cp-faint); }
  .cp-tabs button span{ font-family:var(--cp-sans); font-size:10.5px; font-weight:700; background:rgba(255,255,255,.08); color:var(--cp-dim); border-radius:10px; padding:1px 7px; }
  .cp-tabs button:hover{ color:var(--cp-text); }
  .cp-tabs button.on{ background:var(--cp-card-2); color:var(--cp-text); box-shadow:0 1px 0 rgba(255,255,255,.04) inset; }
  .cp-tabs button.on svg{ color:var(--cp-gold); }
  .cp-tabs button.on span{ background:var(--cp-gold-soft); color:var(--cp-gold); }
  .cp-overdue{ color:var(--cp-red); }
  .cp-card-foot .cp-link{ margin-left:auto; }

  /* day calendar */
  .cp-split{ display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:14px; align-items:start; }
  .cp-blocks{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .cp-cal{ position:sticky; top:14px; background:var(--cp-card); border:1px solid var(--cp-line); border-radius:16px; padding:14px 14px 12px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .cp-cal-head{ display:flex; align-items:center; gap:8px; }
  .cp-cal-head b{ font-family:var(--cp-serif); font-weight:500; font-size:17px; flex:1; }
  .cp-cal-nav{ display:flex; align-items:center; gap:2px; }
  .cp-cal-nav .cp-iconbtn{ padding:7px; color:var(--cp-dim); }
  .cp-cal-nav .cp-iconbtn svg{ width:15px; height:15px; }
  .cp-flip{ display:flex; transform:scaleX(-1); }
  .cp-cal-nav .cp-btn{ margin-left:6px; }
  .cp-cal-nav .cp-btn:disabled{ opacity:.45; cursor:default; }
  .cp-cal-allday{ display:grid; grid-template-columns:46px 1fr; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--cp-line); border-bottom:1px solid var(--cp-line); }
  .cp-cal-allday > span{ font-size:11px; color:var(--cp-faint); }
  .cp-cal-allday > div{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .cp-cal-chip{ display:flex; align-items:center; gap:7px; font-size:12px; padding:6px 9px; border-radius:8px; background:var(--t-bg); color:var(--cp-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-cal-chip svg{ width:13px; height:13px; color:var(--t-fg); flex-shrink:0; }
  .cp-cal-body{ display:grid; grid-template-columns:46px 1fr; gap:6px; padding:8px 4px 8px 0; max-height:min(640px, calc(100vh - 170px)); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--cp-line-2) transparent; }
  .cp-cal-body::-webkit-scrollbar{ width:6px; } .cp-cal-body::-webkit-scrollbar-thumb{ background:var(--cp-line-2); border:none; }
  .cp-cal-hours{ position:relative; }
  .cp-cal-hours span{ position:absolute; left:0; transform:translateY(-50%); font-size:11px; color:var(--cp-faint); }
  .cp-cal-grid{ position:relative; border-left:1px solid var(--cp-line); }
  .cp-cal-grid > i{ position:absolute; left:0; right:0; height:1px; background:var(--cp-line); }
  .cp-cal-ev{ position:absolute; display:flex; gap:8px; padding:6px 8px 6px 9px; border-radius:8px; background:var(--t-bg); border-left:3px solid var(--t-fg); overflow:hidden; min-width:0; }

  .cp-cal-ic{ display:flex; color:var(--t-fg); padding-top:1px; flex-shrink:0; }
  .cp-cal-ic svg{ width:14px; height:14px; }

  .t-violet{ --t-bg:rgba(140,140,240,.16); --t-fg:#9b9bf5; }

  /* calendar */

  .cp-agenda-label svg{ width:13px; height:13px; }

  .cp-ev b{ color:var(--cp-dim); font-weight:600; font-size:11.5px; }
  .cp-ev small{ color:var(--cp-faint); font-size:11px; }

  a.cp-cal-ev:hover{ filter:brightness(1.18); }
  .cp-cal-join{ font-size:11px; color:var(--t-fg); font-weight:600; margin-top:2px; }
  .cp-up-list{ display:flex; flex-direction:column; gap:8px; }
  .cp-up.past{ opacity:.55; }
  .cp-up{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--cp-row); border:1px solid var(--cp-line); border-radius:12px; min-width:0; }
  .cp-up.today{ border-color:rgba(233,179,95,.45); }
  .cp-up-when{ display:flex; flex-direction:column; min-width:74px; font-size:11px; color:var(--cp-dim); }
  .cp-up-when b{ color:var(--cp-gold); font-size:12px; font-weight:600; }
  .cp-up-title{ flex:1; min-width:0; font-size:12.5px; color:var(--cp-text); }
  .cp-up-title small{ display:block; color:var(--cp-faint); font-size:11px; margin-top:1px; }
  .cp-allday{ display:flex; gap:8px; flex-wrap:wrap; }
  .cp-allday span{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--cp-dim); padding:4px 10px; border-radius:20px; border:1px dashed var(--cp-line-2); }
  .cp-allday svg{ width:12px; height:12px; }

  /* recap */
  .cp-recap{ background:var(--cp-card); border:1px solid var(--cp-line); border-radius:16px; padding:14px 18px; display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .cp-recap-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .cp-moon{ color:#e9e3d6; display:flex; } .cp-moon svg{ width:26px; height:26px; fill:currentColor; stroke:none; }
  .cp-recap-text{ flex:1; min-width:200px; }
  .cp-recap-title{ font-family:var(--cp-serif); font-size:16px; }
  .cp-recap-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .cp-stat{ background:var(--cp-card-2); border:1px solid var(--cp-line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:3px; }
  .cp-stat b{ font-family:var(--cp-serif); font-weight:500; font-size:26px; color:var(--cp-text); }
  .cp-stat span{ font-size:11.5px; color:var(--cp-dim); }
  .cp-recap-cols{ display:grid; grid-template-columns:1fr 1.3fr; gap:10px; }
  .cp-form{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cp-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--cp-dim); font-weight:600; }
  .cp-form .span2{ grid-column:1/-1; }
  .cp-form input, .cp-form textarea{ background:var(--cp-bg); border:1px solid var(--cp-line-2); color:var(--cp-text); border-radius:9px; padding:8px 10px; font-family:inherit; font-size:13px; }
  .cp-form textarea{ min-height:60px; resize:vertical; }
  .cp-form input:focus, .cp-form textarea:focus{ border-color:var(--cp-gold); box-shadow:0 0 0 3px var(--cp-gold-soft); }
  .cp-report{ margin-top:10px; background:var(--cp-bg); border:1px solid var(--cp-line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .cp-report > div{ white-space:pre-wrap; font-size:12.5px; line-height:1.65; user-select:all; }
  .cp-table{ overflow-x:auto; }
  .cp-table table{ min-width:520px; }
  .cp-table th{ color:var(--cp-faint); border-bottom-color:var(--cp-line); }
  .cp-table td{ border-bottom-color:var(--cp-line); color:#d9d6cf; }
  .cp-table tbody tr:hover{ background:rgba(255,255,255,.02); }
  .cp-table tr.today{ background:var(--cp-gold-soft); }
  .cp-table tr.total td{ font-weight:700; color:var(--cp-text); border-bottom:none; }
  .cp-recap-foot{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cp-confirm{ display:inline-flex; align-items:center; gap:10px; font-size:12px; color:var(--cp-dim); }

  @media (max-width:1080px){

  /* ---------- Meta Ads dashboard (light, minimal; scoped to .meta) ----------
     Layout: header + range bar, client table, summary cards / client page: KPIs, 2x2 charts, campaign table */
  .meta{
    --m-bg:#f6f7f9; --m-card:#ffffff; --m-line:#e5e7eb; --m-line-2:#eef0f3;
    --m-text:#111827; --m-dim:#6b7280; --m-faint:#9ca3af;
    --m-accent:#2563eb; --m-accent-soft:rgba(37,99,235,.10);
    --m-good:#15803d; --m-good-bg:#ecfdf3; --m-bad:#b91c1c; --m-bad-bg:#fef2f2;
    color-scheme:light; background:var(--m-bg); color:var(--m-text); min-height:100vh;
    padding:24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
    display:flex; flex-direction:column; gap:14px; font-size:13px;
  }
  .meta > *{ max-width:1240px; width:100%; margin-inline:auto; }
  .meta svg{ width:14px; height:14px; }
  .meta svg.m-chart{ width:100%; height:auto; }
  .meta svg.m-spark{ width:96px; height:26px; }
  .m-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .m-head h1{ font-size:20px; font-weight:650; letter-spacing:-.015em; }
  .m-subtitle{ margin:3px 0 0; color:var(--m-dim); font-size:12.5px; }
  .m-head-left{ display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
  .m-head-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .m-updated{ color:var(--m-faint); font-size:11.5px; }
  .m-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--m-card); border:1px solid var(--m-line); color:var(--m-text); padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:550; text-decoration:none; cursor:pointer; }
  .m-btn:hover{ border-color:#cfd4dc; background:#fafbfc; }
  .m-btn.ghost{ background:transparent; border-color:transparent; color:var(--m-dim); padding-left:0; }
  .m-btn.ghost:hover{ color:var(--m-text); background:transparent; }
  .m-flip{ display:flex; transform:scaleX(-1); }
  .m-range{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .m-seg{ display:inline-flex; background:var(--m-card); border:1px solid var(--m-line); border-radius:9px; padding:2px; }
  .m-seg button{ background:transparent; border:none; color:var(--m-dim); font-size:12px; font-weight:550; padding:6px 11px; border-radius:7px; cursor:pointer; }
  .m-seg button:hover{ color:var(--m-text); }
  .m-seg button.on{ background:var(--m-accent); color:#fff; }
  .m-custom{ display:inline-flex; align-items:center; gap:6px; color:var(--m-dim); }
  .m-custom input{ background:var(--m-card); border:1px solid var(--m-line); border-radius:8px; padding:5px 8px; font-size:12px; color:var(--m-text); }
  .m-range-label{ color:var(--m-faint); font-size:11.5px; margin-left:auto; }
  .m-note{ display:flex; align-items:flex-start; gap:8px; background:#eff4ff; border:1px solid #d6e2fd; color:#1e3a8a; border-radius:10px; padding:9px 12px; font-size:12px; }
  .m-connect{ background:#fff; border:1px solid #d6e2fd; border-radius:14px; padding:16px 18px; box-shadow:0 6px 20px -12px rgba(37,99,235,.35); }
  .m-connect-h{ display:flex; align-items:center; gap:8px; font-size:14px; color:#1e3a8a; }
  .m-connect-h svg{ width:16px; height:16px; }
  .m-connect p{ font-size:12.5px; color:var(--text-dim); margin:6px 0 10px; line-height:1.5; }
  .m-connect-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .m-connect-form input{ flex:1; min-width:220px; }
  .m-btn.primary{ background:#2563EB; border-color:#2563EB; color:#fff; }
  .m-connect-how{ margin-top:10px; font-size:12.5px; color:var(--text-dim); }
  .m-connect-how summary{ cursor:pointer; font-weight:600; color:#1e3a8a; }
  .m-connect-how ol{ margin:8px 0 6px 18px; line-height:1.7; }
  .m-note.warn{ background:#fffbeb; border-color:#fde68a; color:#92400e; }
  .m-note svg{ margin-top:1px; flex-shrink:0; }
  .m-panel{ background:var(--m-card); border:1px solid var(--m-line); border-radius:12px; padding:4px 0; min-width:0; }
  .m-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px 6px; flex-wrap:wrap; }
  .m-panel-head h3{ font-size:13.5px; font-weight:650; }
  .m-table-wrap{ overflow-x:auto; }
  .m-table{ width:100%; border-collapse:collapse; min-width:820px; font-size:12.5px; }
  .m-table th{ text-align:left; font-size:11px; font-weight:600; color:var(--m-dim); text-transform:none; letter-spacing:0; padding:10px 14px; border-bottom:1px solid var(--m-line); white-space:nowrap; }
  .m-table th.num, .m-table td.num{ text-align:right; }
  .m-th{ background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; }
  .m-th:hover, .m-th.on{ color:var(--m-text); }
  .m-th-hint{ font-weight:400; color:var(--m-faint); }
  .m-table td{ padding:11px 14px; border-bottom:1px solid var(--m-line-2); white-space:nowrap; vertical-align:middle; }
  .m-table tbody tr:last-child td{ border-bottom:none; }
  .m-row, .m-camp{ cursor:pointer; }
  .m-row:hover td, .m-camp:hover td{ background:#f8faff; }
  .m-row:focus-visible, .m-camp:focus-visible{ outline:2px solid var(--m-accent); outline-offset:-2px; }
  .m-client{ display:flex; align-items:center; gap:10px; }
  .m-client b{ display:block; font-weight:600; font-size:13px; }
  .m-client small{ color:var(--m-faint); font-size:11px; }
  .m-client.big h1{ font-size:19px; }
  .m-logo{ width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:hsl(var(--h) 55% 32%); background:hsl(var(--h) 70% 94%); border:1px solid hsl(var(--h) 50% 86%); flex-shrink:0; }
  .m-logo.lg{ width:44px; height:44px; font-size:14px; border-radius:10px; }
  .m-delta{ display:block; font-size:10.5px; font-weight:600; margin-top:2px; }
  .m-card .m-delta{ display:inline-block; margin-top:0; }
  .m-delta.good{ color:var(--m-good); } .m-delta.bad{ color:var(--m-bad); }
  .m-delta.neutral, .m-delta.flat, .m-delta.none{ color:var(--m-faint); }
  .m-spark{ display:block; }
  .m-spark-empty{ color:var(--m-faint); font-size:11px; }
  .m-status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--m-dim); }
  .m-status i{ width:7px; height:7px; border-radius:50%; background:var(--m-faint); }
  .m-status.on{ color:var(--m-good); } .m-status.on i{ background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.15); }
  .m-status.off i{ background:#f59e0b; }
  .m-link{ background:none; border:none; color:var(--m-accent); font-weight:600; font-size:12px; display:inline-flex; align-items:center; gap:4px; cursor:pointer; padding:4px 0; }
  .m-link:hover{ text-decoration:underline; }
  .m-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .m-kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .m-card{ background:var(--m-card); border:1px solid var(--m-line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .m-card.sm{ padding:12px 14px; }
  .m-card-wide{ grid-column:1/-1; }
  .m-card-label{ color:var(--m-dim); font-size:11.5px; font-weight:550; }
  .m-card-value{ font-size:21px; font-weight:650; letter-spacing:-.015em; }
  .m-card.sm .m-card-value{ font-size:18px; }
  .m-card-foot{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:16px; }
  .m-sub{ color:var(--m-faint); font-size:11px; }
  .m-charts{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .m-chart-card{ padding-bottom:10px; }
  .m-chart{ width:100%; height:auto; display:block; padding:0 8px; }
  .m-grid{ stroke:var(--m-line-2); stroke-width:1; }
  .m-axis{ fill:var(--m-faint); font-size:10px; font-family:inherit; }
  .m-chart-empty{ color:var(--m-faint); font-size:12px; padding:46px 16px; text-align:center; }
  .m-legend{ display:inline-flex; align-items:center; gap:6px; color:var(--m-dim); font-size:11px; }
  .m-legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; margin-left:6px; }
  .m-pill{ display:inline-flex; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:#f3f4f6; color:var(--m-dim); }
  .m-pill.on{ background:var(--m-good-bg); color:var(--m-good); }
  .m-pill.off{ background:#f3f4f6; color:#4b5563; }
  .m-pill.warn{ background:#fffbeb; color:#92400e; }
  .m-pill.bad{ background:var(--m-bad-bg); color:var(--m-bad); }
  .m-name{ max-width:320px; overflow:hidden; text-overflow:ellipsis; }
  .m-name > span:last-child{ overflow:hidden; text-overflow:ellipsis; }
  .m-name > *{ vertical-align:middle; }
  .m-caret{ margin-right:6px; }
  .m-lvl{ margin-right:6px !important; }
  .m-caret{ display:inline-flex; color:var(--m-faint); transition:transform .15s; }
  .m-camp.open .m-caret{ transform:rotate(90deg); color:var(--m-accent); }
  .m-camp.open td{ background:#f8faff; }
  .m-child td{ background:#fbfcfd; font-size:12px; color:#374151; }
  .m-child.adset td.m-name{ padding-left:36px; }
  .m-child.ad td.m-name{ padding-left:56px; }
  .m-lvl{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--m-accent); background:var(--m-accent-soft); padding:1px 6px; border-radius:4px; margin-right:2px; flex-shrink:0; }
  .m-lvl.ad{ color:#6b21a8; background:#f3e8ff; }
  .m-table small{ color:var(--m-faint); font-size:10.5px; margin-left:2px; }
  .m-dim{ color:var(--m-faint); }
  .m-empty{ color:var(--m-dim); text-align:center; padding:28px 14px !important; white-space:normal !important; }
  .m-foot{ color:var(--m-faint); font-size:11.5px; margin:0; }
  .m-skel{ display:block; height:12px; border-radius:6px; background:linear-gradient(90deg,#eef0f3,#f6f7f9,#eef0f3); background-size:200% 100%; animation:mSk 1.2s linear infinite; min-width:60px; }
  .m-skel.tall{ height:150px; margin:8px 16px; }
  @keyframes mSk{ to{ background-position:-200% 0; } }
  @media (max-width:1080px){ .m-kpis{ grid-template-columns:repeat(3,1fr); } .m-cards{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:760px){ .m-charts{ grid-template-columns:1fr; } .m-range-label{ margin-left:0; width:100%; } }
  @media (max-width:520px){ .m-kpis{ grid-template-columns:repeat(2,1fr); } .m-cards{ grid-template-columns:1fr 1fr; } .m-card-value{ font-size:18px; } }
  .m-kpis{ grid-template-columns:repeat(6,1fr) !important; }

  const { data, error } = await sb.from(table).select("*");
  if(error){ console.error("load failed:", table, error); return []; }
  loadedOk.add(table);
  return (data||[]).map(r=>fromRow(r, fields));

async function syncArrayTable(table, rows, fields){
  if(!loadedOk.has(table)) return;
  try{
    const { data: existing, error } = await sb.from(table).select("id");
    if(error) throw error;
    const keepIds = new Set(rows.map(r=>r.id));
    const toDelete = (existing||[]).map(r=>r.id).filter(id=>!keepIds.has(id));
    if(toDelete.length) await sb.from(table).delete().in("id", toDelete);
    if(rows.length) await sb.from(table).upsert(rows.map(r=>toRow(r, fields)), { onConflict:"id" });

async function loadExtras(){
  try{
    const { data, error } = await sb.from("app_state").select("value").eq("key", EXTRAS_KEY).maybeSingle();
    if(error) throw error;
    extrasInSupabase = true;
    if(data && data.value) return data.value;
  }catch(e){ console.warn("app_state table not available yet; keeping extras in this browser", e); }
  try{ return JSON.parse(localStorage.getItem(EXTRAS_LOCAL) || "{}"); }catch(e){ return {}; }
}
function collectExtras(){
  const rowExtras = {};
  ARRAY_TABLES.forEach(([key, table, fields])=>{
    const known = new Set(fields.map(f=>f[0]));
    (state[key]||[]).forEach(r=>{
      const extra = {};
      Object.keys(r).forEach(k=>{ if(!known.has(k) && r[k]!==undefined) extra[k]=r[k]; });
      if(Object.keys(extra).length) (rowExtras[table] = rowExtras[table] || {})[r.id] = extra;
    });
  });
  return { rowExtras, metaClients: state.metaClients };
}
function applyExtras(extras){
  const rowExtras = (extras && extras.rowExtras) || {};
  ARRAY_TABLES.forEach(([key, table])=>{
    const map = rowExtras[table] || {};
    (state[key]||[]).forEach(r=>{ if(map[r.id]) Object.keys(map[r.id]).forEach(k=>{ if(r[k]===undefined || r[k]===null) r[k]=map[r.id][k]; }); });
  });
  if(extras && Array.isArray(extras.metaClients)) state.metaClients = extras.metaClients;
}
async function syncExtras(){
  const value = collectExtras();
  try{ localStorage.setItem(EXTRAS_LOCAL, JSON.stringify(value)); }catch(e){}
  if(!extrasInSupabase) return;
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session) return;
    await sb.from("app_state").upsert({ user_id: session.user.id, key: EXTRAS_KEY, value, updated_at: new Date().toISOString() }, { onConflict:"user_id,key" });
  }catch(e){ console.error("sync failed: app_state", e); }
}

async function loadState(){
  const results = await Promise.all(ARRAY_TABLES.map(([, table, fields])=>loadArrayTable(table, fields)));
  const [adsAcqMonthly, settings, extras] = await Promise.all([loadMonthlyTable(), loadSettings(), loadExtras()]);
  const next = defaultState();
  ARRAY_TABLES.forEach(([key], i)=>{ next[key] = results[i]; });
  next.adsAcqMonthly = adsAcqMonthly;
  next.settings = settings;
  state = next;
  applyExtras(extras);
  return state;
}
let state = defaultState();
let saveTimer = null;
function syncAll(){
  ARRAY_TABLES.forEach(([key, table, fields])=>syncArrayTable(table, state[key]||[], fields));
  syncMonthlyTable(state.adsAcqMonthly);
  syncSettings(state.settings);
  syncExtras();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(syncAll, 400);
}
window.addEventListener("beforeunload", ()=>{ if(saveTimer){ clearTimeout(saveTimer); syncAll(); } });
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
}

/* ============================= LIVE GOOGLE CALENDAR =============================
   When the viewer has Google Calendar connected, the page watches the next 7 days
   through the connector (re-checked about every minute while the page is open) and
   replaces the snapshot above. Without it, the snapshot stays as the fallback. */
const CAL_SERVER = "Google Calendar";
let CAL_LIVE = { status:"snapshot", at:null, code:null };
let calUnsub = null, calRenderPending = false;
const CAL_EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}️‍]/gu;
function calHM(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function calMapEvents(payload){
  const list = (payload && (payload.events || payload.items)) || [];
  const out = [];
  list.forEach(e=>{
    if(!e || e.status==="cancelled" || !e.start) return;
    const title = String(e.summary||"(No title)").replace(CAL_EMOJI,"").replace(/\s{2,}/g," ").trim() || "(No title)";
    const others = (e.attendees||[]).filter(a=>!a.self && !a.resource);
    const cd = e.conferenceData || {};
    const entry = (cd.entryPoints||[]).find(p=>p.entryPointType==="video");
    const found = String((e.location||"")+" "+(e.description||"")).match(/https?:\/\/[^\s"'<>]*(zoom\.us|meet\.google\.com|teams\.microsoft\.com|teams\.live\.com)[^\s"'<>]*/i);
    const meet = e.conferenceUrl || (cd.videoEntryPoint && cd.videoEntryPoint.uri) || (entry && entry.uri) || e.hangoutLink || (found && found[0]) || "";
    const base = { id:e.id, title, location:e.location||"", meet, url:e.htmlLink||"" };
    if(e.start.date && !e.start.dateTime){
      const sd = String(e.start.date).slice(0,10);
      const ed = e.end && e.end.date ? addDays(String(e.end.date).slice(0,10), -1) : sd;
      out.push(Object.assign(base, { allDay:true, date:sd, endDate:ed }));
      return;
    }
    const st = new Date(e.start.dateTime), en = new Date((e.end&&e.end.dateTime)||e.start.dateTime);
    if(isNaN(st)) return;
    out.push(Object.assign(base, {
      date: localDateStr(st), start: calHM(st), end: calHM(en),
      meeting: others.length>0 || !!meet,
      with: others.length ? others.map(a=>a.displayName||String(a.email||"").split("@")[1]||"").filter(Boolean).slice(0,2).join(", ") : "",
    }));
  });
  out.sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  return out;
}
function calRerender(){
  if(activeView!=="today") return;
  const a = document.activeElement;
  if(document.getElementById("modalOverlay") || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ calRenderPending = true; return; }
  calRenderPending = false; renderView();
}
document.addEventListener("focusout", ()=>{ if(calRenderPending) setTimeout(calRerender, 50); });
function startLiveCalendar(){
  const mcp = window.claude && window.claude.mcp;
  if(!mcp || calUnsub) return;
  const today = todayStr();
  const input = { startTime: today+"T00:00:00", endTime: addDays(today,7)+"T00:00:00", orderBy:"startTime", pageSize:250 };
  try{
    calUnsub = mcp.watchTool(CAL_SERVER, "list_events", input, ev=>{
      if(ev.type==="data"){
        const mapped = calMapEvents(ev.result && ev.result.payload);
        CALENDAR_EVENTS = mapped;
        CALENDAR_SYNCED_AT = today; CALENDAR_SYNCED_THROUGH = addDays(today,6);
        CAL_LIVE = { status:"live", at: (ev.result.cache && ev.result.cache.storedAt) || Date.now(), code:null };
        calRerender();
      } else {
        const code = (ev.error && ev.error.code) || "upstream_error";
        const retract = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","selection_required"].includes(code);
        const noLive = ["not_granted","capability_disabled","capability_removed","bad_request"].includes(code);
        CAL_LIVE = { status: retract?"blocked":noLive?"snapshot":(CAL_LIVE.status==="live"?"stale":"snapshot"), at:CAL_LIVE.at, code };
        calRerender();
      }
    }, { refetchInterval: 60000 });
  }catch(e){ CAL_LIVE = { status:"snapshot", at:null, code:"bad_request" }; }
}
function calStatusText(){
  const c = CAL_LIVE;
  const t = c.at ? new Date(c.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "";
  if(c.status==="live") return `<span class="cp-live"><i></i>Live</span> · updated ${t}`;
  if(c.status==="stale") return `Live updates paused · last updated ${t} · retrying automatically`;
  if(c.code==="needs_reauth") return `Reconnect Google Calendar in claude.ai Settings → Connectors · showing snapshot from ${fmtDateShort(CALENDAR_SYNCED_AT)}`;
  if(c.code==="server_not_connected"||c.code==="selection_required") return `Add Google Calendar in claude.ai Settings → Connectors for live updates · showing snapshot from ${fmtDateShort(CALENDAR_SYNCED_AT)}`;
  if(c.code==="blocked_by_policy"||c.code==="approval_required") return `Your organization blocks live calendar access here · showing snapshot from ${fmtDateShort(CALENDAR_SYNCED_AT)}`;
  return `Snapshot from ${fmtDateShort(CALENDAR_SYNCED_AT)}${window.claude&&window.claude.mcp?" · connecting to Google Calendar…":""}`;
}

/* ============================= UTILS ============================= */
function fmtMoney(n){ n = n||0; const neg = n<0; return (neg?"-£":"£")+Math.round(Math.abs(n)).toLocaleString("en-GB"); }
function fmtNum(n){ return (n||0).toLocaleString("en-GB"); }
function fmtPct(n, d=1){ if(n===null||n===undefined||!isFinite(n)) return "—"; return n.toFixed(d)+"%"; }
function safeDiv(a,b){ if(!b) return null; return (a/b)*100; }
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return localDateStr(new Date()); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return localDateStr(d); }
function fmtDateLong(dstr){
  if(!dstr) return "—";
  const d = new Date(dstr+"T00:00:00");
  return d.toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" });
}
function fmtDateShort(dstr){
  if(!dstr) return "—";
  const d = new Date(dstr+"T00:00:00");
  return d.toLocaleDateString("en-GB",{ day:"numeric", month:"short" });
}
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000);
}
function inPeriod(dateStr, period){
  if(period==="all") return true;
  const today = todayStr();
  if(period==="today") return dateStr===today;
  if(period==="7d") return dateStr>=daysAgo(6) && dateStr<=today;
  if(period==="30d") return dateStr>=daysAgo(29) && dateStr<=today;
  if(period==="mtd"){ return dateStr.slice(0,7)===today.slice(0,7); }
  return true;
}
function sum(arr, key){ return arr.reduce((a,r)=>a+(Number(r[key])||0),0); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function badgeFor(value, target, direction){
  if(value===null || target===undefined || target===null) return "";
  let good = direction==="lower" ? value<=target : value>=target;
  let near = direction==="lower" ? value<=target*1.15 : value>=target*0.85;
  if(good) return `<span class="badge good">${icon("check")} on target</span>`;
  if(near) return `<span class="badge warn">near target</span>`;
  return `<span class="badge bad">${direction==="lower"?"over":"below"}</span>`;
}
function sparkline(values, color){
  if(!values.length) return "";
  const w=64,h=24,max=Math.max(...values,1),min=Math.min(...values,0);
  const range=(max-min)||1;
  const pts = values.map((v,i)=>{
    const x = values.length===1?w:(i/(values.length-1))*w;
    const y = h-((v-min)/range)*h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function wfWeekDates(){
  const d = new Date(todayStr()+"T00:00:00");
  const day = d.getDay();
  const monday = new Date(d); monday.setDate(d.getDate()+(day===0?-6:1-day));
  const dates=[];
  for(let i=0;i<5;i++){ const dd=new Date(monday); dd.setDate(monday.getDate()+i); dates.push(localDateStr(dd)); }
  return dates;
}
function cpFullWeekDates(){ const mon = mondayOnOrBefore(todayStr()); const out=[]; for(let i=0;i<7;i++) out.push(addDays(mon,i)); return out; }
function wfDmsForDate(d){ return sum(state.b2bLog.filter(x=>x.date===d),"openerMS")+sum(state.b2bLog.filter(x=>x.date===d),"proposalMS"); }
function wfSumReports(dates){
  const t={coldCalls:0,oldLeads:0,meetings:0,revenue:0,dms:0,days:0};
  dates.forEach(d=>{
