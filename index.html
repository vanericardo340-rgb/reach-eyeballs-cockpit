}
function renderFitDashboard(months){
  const unit = state.settings.weightUnit;
  const perMonth = months.map(mk=>{
    const entries = fitEntriesForMonth(mk);
    return { key:mk, hasData: entries.length>0, m: fitCalcMetrics(entries) };
  });
  const yearEntries = state.fitnessLog.filter(r=>r.date.slice(0,4)===todayStr().slice(0,4));
  const yearMetrics = fitCalcMetrics(yearEntries);
  const cols = [
    { key:"daysLogged", label:"Days logged" },
    { key:"totalCalories", label:"Total calories" },
    { key:"avgCalories", label:"Avg cal/day", round:true },
    { key:"avgProtein", label:"Avg protein/day", round:true, suffix:"g" },
    { key:"startWeight", label:"Start weight", weight:true },
    { key:"endWeight", label:"End weight", weight:true },
    { key:"weightChange", label:"Weight change", weight:true, signed:true },
    { key:"avgWeight", label:"Avg weight", weight:true },
  ];
  function cell(col, m, hasData, isTotal){
    const cls = "num"+(isTotal?" col-total":"");
    if(!hasData) return `<td class="${cls} cell-muted">—</td>`;
    const v = m[col.key];
    if(v===null||v===undefined) return `<td class="${cls} cell-muted">—</td>`;
    let out;
    if(col.weight) out = col.signed ? fmtWeightSigned(v, unit) : fmtWeight(v, unit);
    else if(col.round) out = fmtNum(Math.round(v))+(col.suffix||"");
    else out = fmtNum(v);
    return `<td class="${cls} tnum">${out}</td>`;
  }
  return `
    <div class="panel">
      <div class="panel-head"><div><h3>Dashboard</h3><div class="sub">Overview across all months of ${todayStr().slice(0,4)}</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Stat</th>${perMonth.map(p=>`<th class="num">${b2bMonthLabel(p.key)}</th>`).join("")}<th class="num col-total">Year</th></tr></thead>
          <tbody>
            ${cols.map(c=>`
              <tr>
                <td><b>${c.label}</b></td>
                ${perMonth.map(p=>cell(c,p.m,p.hasData)).join("")}
                ${cell(c, yearMetrics, yearEntries.length>0, true)}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function lineChart(values, color){
  const present = values.filter(v=>v!==null && v!==undefined);
  if(!present.length) return `<div class="empty-state" style="padding:20px 0">${icon("info")}<p>No weight logged yet for this range.</p></div>`;
  const w=560,h=140,pad=8;
  const max = Math.max(...present), min = Math.min(...present);
  const range = (max-min)||1;
  const n = values.length;
  const pts = [];
  values.forEach((v,i)=>{
    if(v===null||v===undefined) return;
    const x = (i/(n-1))*(w-pad*2)+pad;
    const y = h-pad-((v-min)/range)*(h-pad*2);
    pts.push([x,y]);
  });
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/>
  </svg></div>`;
}

function openModal(html){
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "modalOverlay";
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e=>{ if(e.target===wrap) closeModal(); });
  document.addEventListener("keydown", escClose);
}
function escClose(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  const el = document.getElementById("modalOverlay");
  if(el) el.remove();
  document.removeEventListener("keydown", escClose);
}

function fmtEUR(n){ n = n||0; const neg = n<0; return (neg?"-€":"€")+Math.round(Math.abs(n)).toLocaleString("en-GB"); }
function parseCSV(text){
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',') { row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ============================= FINANCES =============================
   Reads the "Weekly Finances" Google Sheet template directly — one tab per
   month, category rows × WEEK1-4 columns. Sheet-name-based export silently
   falls back to the first tab on a miss, so this keys off known tab gids
   instead (bad gid = real error we can catch). When you duplicate the
   template for a new month, tell Claude so it can add the gid here. */
const FINANCE_SHEET_ID = "1lgnvUi3MQ-WbCCl9K3yzb0njybgxwT7IN4ZZaD0N4e8";
const FINANCE_MONTH_GIDS = { "2026-08": "244576783", "2026-09": "766123365", "2026-10": "40564415" };
const FIN_MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
/* "August", "Aug 2026", "September '26" → "2026-08". A tab without a year is
   taken as the nearest such month: up to one month ahead, or the last ten. */
function finTabMonthKey(name){
  const n = String(name||"").trim().toLowerCase();
  const mi = FIN_MONTHS.findIndex(m=>n.startsWith(m) || new RegExp("^"+m.slice(0,3)+"\\b").test(n));
  if(mi<0) return null;
  const y4 = n.match(/(20\d{2})/), y2 = n.match(/'(\d{2})\b/);
  const now = new Date();
  let year = y4 ? +y4[1] : y2 ? 2000 + +y2[1] : now.getFullYear();
  if(!y4 && !y2){
    const diff = mi - now.getMonth();
    if(diff > 1) year -= 1; else if(diff < -10) year += 1;
  }
  return `${year}-${String(mi+1).padStart(2,"0")}`;
}
async function finApi(body){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) throw new Error("not signed in");
  const res = await fetch("/api/sheet", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` }, body: JSON.stringify(Object.assign({ url:`https://docs.google.com/spreadsheets/d/${FINANCE_SHEET_ID}/edit` }, body)) });
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error || ("status "+res.status));
  return j;
}
async function finDiscoverMonths(){
  try{
    const { tabs } = await finApi({ mode:"tabs" });
    (tabs||[]).forEach(t=>{ const mk = finTabMonthKey(t.name); if(mk) FINANCE_MONTH_GIDS[mk] = String(t.gid); });
  }catch(e){ console.warn("finance tab discovery failed", e); }
}
function finParseEuro(s){
  s = (s||"").replace(/[€\s]/g,"").trim();
  if(!s || s==="-") return 0;
  const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
  if(lastComma>-1 && lastDot>-1){ s = lastComma>lastDot ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lastComma>-1){ s = s.replace(",","."); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseFinanceSheetRows(rows){
  const entries = [];
  let mode = null;
  for(const row of rows){
    const label = (row[1]||"").trim();
    if(label==="INCOME SOURCE"){ mode="income"; continue; }
    if(label==="PERSONAL" && mode!=="income"){ mode="personal"; continue; }
    if(label==="BUSINESS"){ mode="business"; continue; }
    if(label===""){ mode=null; continue; }
    if(label==="TOTAL INCOME"){ mode=null; continue; }
    if(label==="INCOME" || label==="EXPENSES") continue;
    if(!mode) continue;
    const week1=finParseEuro(row[3]), week2=finParseEuro(row[4]), week3=finParseEuro(row[5]), week4=finParseEuro(row[6]);
    entries.push({ section:mode, category:label, week1, week2, week3, week4, monthTotal: week1+week2+week3+week4 });
  }
  return entries;
}
async function fetchFinanceMonthLive(monthKey, gid){
  const { rows } = await finApi({ mode:"csv", gid });
  return parseFinanceSheetRows(rows).map(e=>Object.assign({ monthKey }, e));
}
async function fetchFinanceSheetLive(){
  if(Date.now() - FIN_DISCOVERED_AT > 300000){ await finDiscoverMonths(); FIN_DISCOVERED_AT = Date.now(); }
  const results = await Promise.allSettled(
    Object.entries(FINANCE_MONTH_GIDS).map(([monthKey,gid])=>fetchFinanceMonthLive(monthKey,gid))
  );
  return results.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function mergeFinanceSheetImport(importEntries){
  let changed = false;
  (importEntries||[]).forEach(e=>{
    const id = `${e.monthKey}__${e.section}__${slugify(e.category)}`;
    const idx = state.financeLog.findIndex(x=>x.id===id);
    if(idx>=0){
      const existing = state.financeLog[idx];
      if(existing.fromSheet===false) return;
      const next = Object.assign({}, e, { id, fromSheet:true });
      if(Object.keys(next).some(k=>String(next[k])!==String(existing[k]))){ state.financeLog[idx] = next; changed = true; }
    } else {
      state.financeLog.push(Object.assign({}, e, { id, fromSheet:true }));
      changed = true;
    }
  });
  if(changed) save();
  return changed;
}

function finAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function finEntriesForMonth(mk){ return state.financeLog.filter(e=>e.monthKey===mk); }
function finMonthTotals(entries){
  const sumSection = (section, key) => entries.filter(e=>e.section===section).reduce((a,e)=>a+Number(e[key]||0),0);
  const weeks = ["week1","week2","week3","week4"].map(wk=>{
    const income = sumSection("income", wk);
    const personal = sumSection("personal", wk);
    const business = sumSection("business", wk);
    return { income, personal, business, spending: personal+business, net: income-personal-business };
  });
  const income = weeks.reduce((a,w)=>a+w.income,0);
  const personal = weeks.reduce((a,w)=>a+w.personal,0);
  const business = weeks.reduce((a,w)=>a+w.business,0);
  return { weeks, income, personal, business, spending: personal+business, net: income-personal-business };
}
function finWeekRanges(mk){
  let cursor = mondayOnOrBefore(`${mk}-01`);
  const out = [];
  for(let i=0;i<4;i++){
    out.push(`${fmtDateShort(cursor)} – ${fmtDateShort(addDays(cursor,6))}`);
    cursor = addDays(cursor,7);
  }
  return out;
}
function finSectionStats(cats){
  const total = cats.reduce((a,c)=>a+c.monthTotal,0);
  const weekTotals = ["week1","week2","week3","week4"].map(k=>cats.reduce((a,c)=>a+Number(c[k]||0),0));
  let hiIdx=0; weekTotals.forEach((v,i)=>{ if(v>weekTotals[hiIdx]) hiIdx=i; });
  const top = cats[0]; // cats passed in pre-sorted desc
  const used = cats.filter(c=>c.monthTotal>0).length;
  return {
    total, weeklyAvg: total/4,
    highestWeekIdx: hiIdx, highestWeekVal: weekTotals[hiIdx],
    top, topPct: total && top ? Math.round(top.monthTotal/total*100) : 0,
    used, totalCats: cats.length,
  };
}
function finMiniStat(iconName, colorVar, label, value, sub){
  return `<div style="flex:1;min-width:150px;background:var(${colorVar}-soft);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px">
    <div style="width:42px;height:42px;border-radius:50%;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(${colorVar})">
      <span class="fin-mini-icon-lg">${icon(iconName)}</span>
    </div>
    <div style="min-width:0">
      <div style="font-size:12.5px;font-weight:600;color:var(${colorVar})">${label}</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--text)">${value}</div>
      <div class="sub" style="margin-top:0">${sub}</div>
    </div>
  </div>`;
}
function finRowIcon(iconName, colorVar){
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(${colorVar}-soft);color:var(${colorVar});flex-shrink:0"><span class="fin-mini-icon">${icon(iconName)}</span></span>`;
}
function finPill(value, colorVar, sub){
  return `<div style="display:inline-flex;flex-direction:column;align-items:flex-end;gap:3px">
    <span style="background:var(${colorVar}-soft);color:var(${colorVar});font-weight:700;padding:5px 12px;border-radius:20px;font-size:13.5px" class="tnum">${value}</span>
    ${sub?`<span class="sub">${sub}</span>`:""}
  </div>`;
}

  if(kind==="card") return `<svg viewBox="0 0 60 44" class="fin-hero-decor" style="width:48px;height:35px" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"><rect x="2" y="6" width="52" height="34" rx="6"/><path d="M2 18h52"/></svg>`;

  return "";
}
function finStatCard(label, value, iconName, caption, decor){

function finNoteId(mk, section, week){ return `${mk}__${section}__week${week}`; }
function finNoteFor(mk, section, week){ return state.financeNotes.find(n=>n.id===finNoteId(mk,section,week)); }

  const has = n && n.note && n.note.trim();

}
function finCatTable(cats, mk, section){

  const statsHtml = cats.length ? `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${finMiniStat("trending","--accent","Total spent", fmtEUR(s.total), "This month")}
      ${finMiniStat("card","--good","Weekly average", fmtEUR(s.weeklyAvg), "Per week")}
      ${finMiniStat("arrowDown","--info","Highest week", fmtEUR(s.highestWeekVal), `Week ${s.highestWeekIdx+1}`)}
      ${finMiniStat("tag","--warn","Top category", s.top?s.top.category:"—", s.top?`${fmtEUR(s.top.monthTotal)} (${s.topPct}%)`:"—")}
      ${finMiniStat("pie","--accent","Categories used", `${s.used} / ${s.totalCats}`, "This month")}
    </div>` : "";

  const rankColor = (idx, amount) => !amount ? "var(--border)" : idx===0 ? "var(--bad)" : idx===1 ? "var(--accent2)" : idx===2 ? "#e0b23d" : "var(--border)";

  return `

function financeNoteModal(mk, section, week){
  const id = finNoteId(mk, section, week);
  const existing = finNoteFor(mk, section, week);
  const sectionLabel = section==="personal" ? "Personal" : "Business";
  openModal(`
    <div class="modal-head"><h3>${sectionLabel} — Week ${week} notes</h3><button class="icon-btn" id="modalClose">${icon("x")}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field field-span2"><label>What happened / what you were spending on</label><textarea id="fn_note" rows="6" placeholder="e.g. birthday dinner out, laptop repair, stocked up on groceries for the month...">${existing?existing.note||"":""}</textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      ${existing?`<button class="btn danger" id="modalDelete">Delete</button>`:""}
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Save note</button>
    </div>
  `);
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modalCancel").onclick = closeModal;
  if(existing) document.getElementById("modalDelete").onclick = ()=>{ state.financeNotes = state.financeNotes.filter(n=>n.id!==id); save(); closeModal(); renderView(); toast("Note deleted"); };
  document.getElementById("modalSave").onclick = ()=>{
    const note = document.getElementById("fn_note").value;
    const entry = { id, monthKey:mk, section, week, note };
    if(existing){ state.financeNotes = state.financeNotes.map(n=>n.id===id?entry:n); }
    else{ state.financeNotes.push(entry); }
    save(); closeModal(); renderView(); toast("Saved");
  };
}


function exportAllJSON(){
  const data = JSON.stringify(state, null, 2);
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({ filename: "reach-eyeballs-cockpit-backup.json", data }).catch(()=>{
      fallbackDownload(data);
    });
  } else {
    fallbackDownload(data);
  }
}
function fallbackDownload(data){
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "reach-eyeballs-cockpit-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

   Round button bottom-right; opens a small chat window. Replies come from
   /api/chat (Claude), which receives a read-only snapshot of the dashboard. */
const CHAT_KEY = "cockpit_chat_v1";
const CHAT_SUGGESTIONS = ["What should I focus on next?", "Summarise my day so far", "Draft a follow-up for my most overdue lead"];
let chatHistory = [];
try{ chatHistory = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]"); }catch(e){ chatHistory = []; }
let chatBusy = false;

function chatEsc(s){ return String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
/* Small, safe markdown subset: bold, italics, inline code, links, bullet lists. */
function chatFormat(text){
  const lines = chatEsc(text).split("\n");
  let html = "", inList = false;
  for(const raw of lines){
    let l = raw.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if(m){ if(!inList){ html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if(inList){ html += "</ul>"; inList = false; }
    html += l.trim() ? `<p>${l}</p>` : "";
  }
  if(inList) html += "</ul>";
  return html;
}
function chatSave(){ try{ localStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory.slice(-40))); }catch(e){} }

/* Read-only snapshot of the dashboard for the assistant. */
function chatContext(){
  const out = [];
  const now = new Date();
  out.push(`Now: ${now.toLocaleString(undefined,{ weekday:"long", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" })}`);
  try{
    const active = state.clients.filter(c=>c.status==="active");
    out.push(`\nClients (${state.clients.length}, ${active.length} active):`);
    state.clients.slice(0,40).forEach(c=>out.push(`- ${c.company||"?"}${c.contact?` (${c.contact})`:""} · ${c.status||""}${c.model?` · ${c.model}`:""}${c.runRate?` · run rate ${c.runRate}`:""}${c.nextAction?` · next: ${c.nextAction}`:""}`));
    const fu = (typeof needsFollowUp==="function") ? needsFollowUp("all") : [];
    if(fu.length){ out.push(`\nClient-ads leads needing follow-up (${fu.length}):`); fu.slice(0,15).forEach(l=>out.push(`- ${l.leadName} · ${l.outcome} · ${l.date}`)); }
    const fit = [...state.fitnessLog].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
    if(fit.length){ out.push(`\nFitness (latest 7 days):`); fit.forEach(f=>out.push(`- ${f.date}: ${f.weight!=null?f.weight+"kg":"—"}, ${f.calories!=null?f.calories+" kcal":"—"}${f.protein!=null?`, ${f.protein}g protein`:""}`)); }
  }catch(e){}
  try{
    const cc = JSON.parse(localStorage.getItem("command-centre:state:v1") || "null");
    if(cc){
      const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const tasks = (cc.tasks||[]).filter(t=>t.date===today);
      out.push(`\nDaily Command Centre — today's tasks:`);
      ["morning","afternoon","evening"].forEach(sec=>{
        const list = tasks.filter(t=>t.section===sec);
        if(list.length) out.push(`${sec}: ` + list.map(t=>`${t.done?"[x]":"[ ]"} ${t.title}${t.kind==="priority"?" (priority)":""}${t.deadline?` by ${t.deadline}`:""}`).join("; "));
      });
      const meetings = (cc.meetings||[]).filter(m=>m.date===today).sort((a,b)=>a.start.localeCompare(b.start));
      if(meetings.length) out.push(`Meetings today: ` + meetings.map(m=>`${m.start} ${m.title}${m.attendee?` with ${m.attendee}`:""}${m.completed?" (done)":""}`).join("; "));
      const leads = (cc.leads||[]).filter(l=>l.status==="open").sort((a,b)=>(a.nextFollowUp||"9").localeCompare(b.nextFollowUp||"9")).slice(0,20);
      if(leads.length){ out.push(`Open leads (by next follow-up):`); leads.forEach(l=>out.push(`- ${l.name}${l.company?` (${l.company})`:""} · ${l.temperature} · ${l.stage} · next follow-up ${l.nextFollowUp ? l.nextFollowUp.replace("T"," ") : "not set"}${l.nextAction?` · ${l.nextAction}`:""}${l.phone?` · ${l.phone}`:""}${l.email?` · ${l.email}`:""}`)); }
      const eod = new Set((cc.eodDone||{})[today]||[]);
      if((cc.settings||{}).eodChecklist) out.push(`EOD checklist: ` + cc.settings.eodChecklist.map(i=>`${eod.has(i.id)?"[x]":"[ ]"} ${i.label}`).join("; "));
      const rec = (cc.recaps||{})[today];
      if(rec && rec.reviewed) out.push(`EOD report submitted today. Tomorrow's #1 priority: ${rec.tomorrowPriority||"—"}`);
      const st = cc.stats||{};
      if(st.weight) out.push(`Weight goal: target ${st.weight.target}kg.`);
      if(st.money && st.money.entries && st.money.entries.length) out.push(`Savings: ${st.money.entries[st.money.entries.length-1].amount} of ${st.money.goal} ${st.money.currency}.`);
    }
  }catch(e){}
  return out.join("\n");
}

/* ---- Anthropic API key (saved to the user's account, used only by the server) ---- */
let chatKeyState = null; /* null = unknown, "ok", "missing", "rejected" */
async function chatAuthed(path, body){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) throw new Error("Sign in to the Cockpit first.");
  const res = await fetch(path, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` }, body: JSON.stringify(body) });
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error || `Request failed (status ${res.status}).`);
  return j;
}
async function chatCheckKey(){
  if(chatKeyState) return;
  try{ const r = await chatAuthed("/api/assistant-key", { action:"status" }); chatKeyState = r.connected ? "ok" : "missing"; }
  catch(e){ chatKeyState = null; }
  chatRender();
}
function chatKeyBox(){
  return `<form class="cc-key" id="ccKeyForm">
    <b>${chatKeyState==="rejected" ? "Your API key stopped working" : "Switch the assistant on"}</b>
    <span>${chatKeyState==="rejected" ? "Anthropic rejected the saved key (revoked or out of credit). Paste a new one." : "Paste your Anthropic API key once. It’s checked with Anthropic, saved to your Cockpit account and only used by the server. It also powers the AI summaries of your EOD reports."}</span>
    <input id="ccKeyInput" type="password" autocomplete="off" placeholder="sk-ant-…" aria-label="Anthropic API key" />
    <button type="submit" class="cc-key-btn">Connect</button>
    <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get a key at console.anthropic.com → API Keys ↗</a>
    <em id="ccKeyMsg" role="status"></em>
  </form>`;
}
function chatBindKeyBox(){
  const f = document.getElementById("ccKeyForm"); if(!f) return;
  f.onsubmit = async (e)=>{
    e.preventDefault();
    const input = document.getElementById("ccKeyInput"), msg = document.getElementById("ccKeyMsg"), btn = f.querySelector("button");
    const key = (input.value||"").trim(); if(!key){ input.focus(); return; }
    btn.disabled = true; btn.textContent = "Checking…"; msg.textContent = "";
    try{
      await chatAuthed("/api/assistant-key", { action:"connect", key });
      chatKeyState = "ok";
      // Drop the "not set up" error and re-ask the last question, if any.
      const lastUser = [...chatHistory].reverse().find(m=>m.role==="user");
      chatHistory = chatHistory.filter(m=>!m.error);
      if(lastUser && chatHistory[chatHistory.length-1]===lastUser){ chatHistory.pop(); chatSave(); chatRender(); chatSend(lastUser.content); }
      else { chatSave(); chatRender(); }
      if(typeof toast==="function") toast("Assistant connected");
    }catch(err){ msg.textContent = err.message; btn.disabled = false; btn.textContent = "Connect"; }
  };
}

function chatRender(){
  const list = document.getElementById("ccChatList");
  if(!list) return;
  if(chatKeyState==="missing" || chatKeyState==="rejected"){
    list.innerHTML = chatKeyBox() + chatHistory.filter(m=>!m.error).map(m=>`<div class="cc-msg ${m.role}">${m.role==="assistant" ? chatFormat(m.content||"") : `<p>${chatEsc(m.content)}</p>`}</div>`).join("");
    chatBindKeyBox();
    return;
  }
  if(!chatHistory.length){
    list.innerHTML = `<div class="cc-chat-empty"><b>Hi! How can I help today?</b><span>I can see your dashboard: tasks, meetings, leads, clients and fitness.</span>
      <div class="cc-chat-sugs">${CHAT_SUGGESTIONS.map(s=>`<button type="button" class="cc-chat-sug">${chatEsc(s)}</button>`).join("")}</div></div>`;
    list.querySelectorAll(".cc-chat-sug").forEach(b=>b.addEventListener("click", ()=>chatSend(b.textContent)));
    return;
  }
  list.innerHTML = chatHistory.map(m=>`<div class="cc-msg ${m.role}${m.error?" error":""}">${m.role==="assistant" ? (m.content ? chatFormat(m.content) : '<span class="cc-typing"><i></i><i></i><i></i></span>') : `<p>${chatEsc(m.content)}</p>`}</div>`).join("");
  list.scrollTop = list.scrollHeight;
}

async function chatSend(text){
  text = (text||"").trim();
  if(!text || chatBusy) return;
  chatBusy = true;
  chatHistory.push({ role:"user", content:text });
  const reply = { role:"assistant", content:"" };
  chatHistory.push(reply);
  chatRender();
  const input = document.getElementById("ccChatInput"); if(input){ input.value = ""; input.style.height = ""; }
  const sendBtn = document.getElementById("ccChatSend"); if(sendBtn) sendBtn.disabled = true;
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session) throw new Error("Sign in to the Cockpit first.");
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify({ messages: chatHistory.filter(m=>!m.error && m!==reply).map(({role,content})=>({role,content})), context: chatContext() }),
    });
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      if(j.code==="not_connected" || j.code==="key_rejected"){ chatKeyState = j.code==="key_rejected" ? "rejected" : "missing"; chatHistory = chatHistory.filter(m=>m!==reply); return; }
      throw new Error(j.error || `The assistant couldn’t answer (status ${res.status}).`);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder();
    for(;;){ const { done, value } = await reader.read(); if(done) break; reply.content += dec.decode(value, { stream:true }); chatRender(); }
    if(!reply.content.trim()) throw new Error("The assistant didn’t reply. Try again.");
  }catch(e){
    reply.content = e.message || "Something went wrong."; reply.error = true;
  }finally{
    chatBusy = false; chatSave(); chatRender();
    if(sendBtn) sendBtn.disabled = false;
    const i = document.getElementById("ccChatInput"); if(i) i.focus();
  }
}

function setChatOpen(open){

}

async function syncFitnessLive(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session) return;
    const res = await fetch("/api/sheet", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` }, body: JSON.stringify({ url: SHEET_SOURCE_URL }) });
    if(!res.ok) return;
    const { rows } = await res.json();
    let changed = false;
    (rows||[]).forEach(r=>{
      const row = { date:r.date, weight:r.weight, calories:r.calories, protein:r.protein, foods:r.meals||"" };
      const idx = state.fitnessLog.findIndex(e=>e.date===row.date);
      if(idx>=0){
        const ex = state.fitnessLog[idx];
        if(ex.fromSheet===false) return;
        const merged = Object.assign({}, ex, row, { id:ex.id, fromSheet:true, protein: row.protein ?? ex.protein });
        if(Object.keys(merged).some(k=>String(merged[k] ?? "")!==String(ex[k] ?? ""))){ state.fitnessLog[idx] = merged; changed = true; }
      } else { state.fitnessLog.push(Object.assign({}, row, { id:uid(), fromSheet:true })); changed = true; }
    });
    SHEET_SYNCED_AT = todayStr();
    if(changed){ save(); if(activeView==="fitness" && sheetsCanRerender()) renderView(); }
    return changed;
  }catch(e){ console.warn("fitness sheet sync failed", e); }
}

/* ============================= TASKS (ClickUp, two-way) =============================
   Everything here reads from and writes to ClickUp through /api/clickup, so a
   change made in the Cockpit shows up in ClickUp (and the other way round on
   the next refresh). Leads are the ClickUp "Leads" list; notes are ClickUp
   comments, which keep their own timestamps. */
const TK_QUICK_TAG = "quick fire";

try{ const s = JSON.parse(localStorage.getItem("cockpit_tasks_ui")||"{}"); if(s.tab) TK.tab = s.tab; if(s.quickList) TK.quickList = s.quickList; if(s.collapsed) TK.collapsed = s.collapsed; }catch(e){}

/* ---------- dates ---------- */
const TK_DAY = 86400000;
function tkStartOfDay(d){ const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); }
function tkDayKey(ms){ const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function tkFromKey(key){ const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d).getTime(); }
function tkEndOfWeek(){ const now = new Date(); const dow = (now.getDay()+6)%7; return tkStartOfDay(now) + (7-dow)*TK_DAY; }
function tkDueLabel(t){
  if(!t.due) return "";
  const today = tkStartOfDay(Date.now());
  const d = new Date(t.due);
  if(t.due < today) return `<span class="tk-due over">${icon("calendar")} ${d.toLocaleDateString("en-GB",{ day:"numeric", month:"short" })}</span>`;
  if(t.due < today+TK_DAY) return `<span class="tk-due today">${icon("calendar")} ${t.dueHasTime ? d.toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" }) : "Today"}</span>`;
  if(t.due < today+2*TK_DAY) return `<span class="tk-due">${icon("calendar")} Tomorrow</span>`;
  return `<span class="tk-due">${icon("calendar")} ${d.toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short" })}</span>`;
}
function tkStamp(ms){
  const d = new Date(ms); const diff = Date.now()-ms;
  const abs = d.toLocaleString("en-GB",{ weekday:"short", day:"numeric", month:"short", year: d.getFullYear()===new Date().getFullYear()?undefined:"numeric", hour:"2-digit", minute:"2-digit" });
  let rel = "";
  if(diff < 60000) rel = "just now";
  else if(diff < 3600000) rel = `${Math.round(diff/60000)} min ago`;
  else if(diff < TK_DAY) rel = `${Math.round(diff/3600000)} h ago`;
  else if(diff < 30*TK_DAY) rel = `${Math.round(diff/TK_DAY)} d ago`;
  return rel ? `${abs} · ${rel}` : abs;
}

/* ---------- lists & statuses ---------- */
function tkList(id){ return TK.data && (TK.data.lists||[]).find(l=>l.id===id); }
function tkDoneStatus(listId){ const l = tkList(listId); if(!l) return "complete"; const s = l.statuses.find(x=>x.type==="closed") || l.statuses.find(x=>x.type==="done"); return s ? s.status : "complete"; }
function tkOpenStatus(listId){ const l = tkList(listId); const s = l && (l.statuses.find(x=>x.type==="open") || l.statuses[0]); return s ? s.status : "to do"; }
function tkIsDone(t){ return t.statusType==="closed" || t.statusType==="done"; }
function tkFind(id){ if(!TK.data) return null; return TK.data.tasks.find(t=>t.id===id) || TK.data.leads.find(t=>t.id===id); }
function tkIsQuick(t){ return (t.tags||[]).some(g=>/^quick[ -]?fires?$/i.test(g)); }
function tkWorkLists(){ return (TK.data.lists||[]).filter(l=>l.id!==TK.data.leadsListId); }
const TK_PRIO = { urgent:{ n:1, c:"#d8433a", l:"Urgent" }, high:{ n:2, c:"#c97a1f", l:"High" }, normal:{ n:3, c:"#2563EB", l:"Normal" }, low:{ n:4, c:"#8f8d94", l:"Low" } };
const TK_FLAG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h10l1 2h4v10h-7l-1-2H7v7z"/></svg>`;

/* ---------- updates (optimistic, then ClickUp) ---------- */
function tkApplyLocal(id, changes){ const t = tkFind(id); if(t) Object.assign(t, changes); return t; }
async function tkUpdate(id, changes, local, okMsg){
  const t = tkFind(id); if(!t) return;
  const before = Object.assign({}, t);
  tkApplyLocal(id, local || {}); TK.busy[id] = true; tkRerender(); tkLeadModalRefresh(id);
  try{
    const r = await tkApi({ action:"update", taskId:id, changes });
    if(r.task){ const keep = { fields:t.fields }; Object.assign(t, r.task, r.task.fields && r.task.fields.length ? {} : keep); }
    if(okMsg) toast(okMsg);
  }catch(e){ Object.assign(t, before); toast(e.message); }
  delete TK.busy[id]; tkRerender(); tkLeadModalRefresh(id);
}
function tkToggle(id){
  const t = tkFind(id); if(!t) return;
  const done = tkIsDone(t);
  const status = done ? tkOpenStatus(t.listId) : tkDoneStatus(t.listId);
  const l = tkList(t.listId); const s = l && l.statuses.find(x=>x.status===status);
  tkUpdate(id, { status }, { status, statusType: s ? s.type : (done ? "open" : "closed"), statusColor: s ? s.color : t.statusColor }, done ? "Reopened in ClickUp" : "Completed in ClickUp");
}
function tkSetStatusNow(id, status){
  const t = tkFind(id); if(!t || t.status===status) return Promise.resolve();
  const l = tkList(t.listId); const s = l && l.statuses.find(x=>x.status===status);
  return tkUpdate(id, { status }, { status, statusType: s ? s.type : t.statusType, statusColor: s ? s.color : t.statusColor }, `Moved to “${status}”`);
}
function tkSetStatus(id, status){
  const t = tkFind(id); if(!t || t.status===status) return;
  if(document.getElementById("modalOverlay")){ tkSetStatusNow(id, status); return; } // inside the lead window: the picker is right there
  tkStatusPrompt(id, status);
}
/* ---------- next follow-up (date + time) ---------- */
function tkFuField(){ return TK.data ? tkLeadField(/follow/i, "date") : null; }
function tkFuValue(t){ const f = tkFuField(); const v = f ? tkFieldVal(t, f) : null; return v ? Number(v) : null; }
function tkLocalParts(ms){ const d = new Date(ms); return { date: tkDayKey(ms), time: `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}` }; }
function tkNextMonday(){ const d = new Date(); const add = ((8 - d.getDay()) % 7) || 7; return tkDayKey(tkStartOfDay(d) + add*TK_DAY); }
const TK_QUICK_DAYS = [["Today",0],["Tomorrow",1],["In 2 days",2],["In 3 days",3],["Next Monday","mon"],["In a week",7],["In 2 weeks",14]];
function tkFollowUpPicker(t, opts){

  const cur = tkFuValue(t); const p = cur ? tkLocalParts(cur) : null;
  const time = p && p.time!=="00:00" && p.time!=="04:00" ? p.time : "10:00";

    <div class="tk-fu-quick">${TK_QUICK_DAYS.map(([l,d])=>`<button type="button" class="tk-chip" data-tk-fu-day="${d}">${l}</button>`).join("")}</div>
    <div class="tk-fu-row">
      <label>Date <input type="date" data-tk-fu-date value="${p?p.date:""}" min="${tkDayKey(Date.now())}" /></label>
      <label>Time <input type="time" data-tk-fu-time value="${time}" /></label>
      ${opts.inline?`<button type="button" class="btn primary sm" data-tk-fu-save>Save follow-up</button>`:""}
      ${cur?`<button type="button" class="btn ghost sm" data-tk-fu-clear>Clear</button>`:""}
    </div>
    <p class="tk-faint">On that day the lead shows up in the Daily Command Centre’s follow-ups (Morning, Afternoon or Evening, by the time).</p>
  </div>`;
}
function tkBindFollowUpPicker(root, onPick){
  const box = root.querySelector("[data-tk-fu]"); if(!box) return {};
  const date = box.querySelector("[data-tk-fu-date]"), time = box.querySelector("[data-tk-fu-time]");
  box.querySelectorAll("[data-tk-fu-day]").forEach(b=>b.onclick = ()=>{
    const v = b.dataset.tkFuDay;
    date.value = v==="mon" ? tkNextMonday() : tkDayKey(tkStartOfDay(Date.now()) + Number(v)*TK_DAY);
    box.querySelectorAll("[data-tk-fu-day]").forEach(x=>x.classList.toggle("active", x===b));
    if(onPick) onPick();
  });
  const read = ()=>{ if(!date.value) return null; const [y,m,d] = date.value.split("-").map(Number); const [hh,mm] = (time.value||"10:00").split(":").map(Number); return new Date(y, m-1, d, hh, mm).getTime(); };
  return { box, read, saveBtn: box.querySelector("[data-tk-fu-save]"), clearBtn: box.querySelector("[data-tk-fu-clear]") };
}
async function tkSaveFollowUp(id, ms, status){
  const t = tkFind(id); if(!t) return;
  const f = tkFuField();
  if(status && status!==t.status) await tkSetStatusNow(id, status);
  if(!f){ toast("Your Leads list has no “Follow-up Date” field. Add a Date field with that name in ClickUp."); return; }
  const before = JSON.stringify(t.fields||[]);
  const fv = (t.fields||[]).find(x=>x.id===f.id); if(fv) fv.value = ms; else (t.fields = t.fields||[]).push({ id:f.id, value:ms });
  tkRerender(); tkLeadModalRefresh(id);
  try{
    await tkApi({ action:"field", taskId:id, fieldId:f.id, value:ms, time:true });
    if(ms) tkApi({ action:"comment", taskId:id, text:`${status?`Status → ${status}. `:""}Next follow-up ${new Date(ms).toLocaleString("en-GB",{ weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })} (set in the Cockpit)` }).then(r=>{ const cm = TK.comments[id]; if(cm && r.comment) cm.items.push(r.comment); tkLeadModalRefresh(id); }).catch(()=>{});
    toast(ms ? `Follow-up set for ${new Date(ms).toLocaleString("en-GB",{ weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })}` : "Follow-up cleared");
  }catch(e){ t.fields = JSON.parse(before); toast(e.message); }
  tkRerender(); tkLeadModalRefresh(id);
}
/* Changing a lead's status asks when to follow up next (won / lost / closed don't need one). */
function tkStatusPrompt(id, status){
  const t = tkFind(id); if(!t) return;
  const l = tkList(t.listId); const s = l && l.statuses.find(x=>x.status===status);
  const isLead = t.listId===TK.data.leadsListId;
  if(!isLead || (s && (s.type==="done" || s.type==="closed"))){
    tkSetStatusNow(id, status).then(()=>{ if(isLead && tkFuValue(t)) tkSaveFollowUp(id, null); });
    return;
  }
  openModal(`
    <div class="modal-head"><div><h3>${esc(t.name)}</h3><div class="tk-faint">Moving to <b style="text-transform:capitalize">${esc(status)}</b></div></div><button class="icon-btn" id="modalClose" aria-label="Close">${icon("x")}</button></div>
    <div class="modal-body">${tkFollowUpPicker(t, { title:"When should you follow up next?" })}</div>
    <div class="modal-foot">
      <button class="btn ghost" id="tkFuSkip">Just change the status</button>
      <button class="btn primary" id="tkFuOk">Save status & follow-up</button>
    </div>`);
  const m = document.querySelector("#modalOverlay .modal");
  const pk = tkBindFollowUpPicker(m);
  if(pk.clearBtn) pk.clearBtn.onclick = ()=>{ m.querySelector("[data-tk-fu-date]").value = ""; };
  const cancel = ()=>{ closeModal(); tkRerender(); };
  document.getElementById("modalClose").onclick = cancel;
  document.getElementById("tkFuSkip").onclick = ()=>{ closeModal(); tkSetStatusNow(id, status); };
  document.getElementById("tkFuOk").onclick = ()=>{
    const ms = pk.read();
    if(!ms){ toast("Pick a day, or choose “Just change the status”."); return; }
    closeModal(); tkSaveFollowUp(id, ms, status);
  };
}

async function tkSetField(id, fieldId, value, display){
  const t = tkFind(id); if(!t) return;
  const before = JSON.stringify(t.fields||[]);
  const f = (t.fields||[]).find(x=>x.id===fieldId);
  if(f) f.value = display; else (t.fields = t.fields||[]).push({ id:fieldId, value:display });
  try{ await tkApi({ action:"field", taskId:id, fieldId, value }); toast("Saved to ClickUp"); }
  catch(e){ t.fields = JSON.parse(before); toast(e.message); }
  tkRerender(); tkLeadModalRefresh(id);
}
async function tkCreate(payload, local){
  try{
    const r = await tkApi(Object.assign({ action:"create" }, payload));
    const t = Object.assign({}, r.task, local||{});
    if(payload.listId===TK.data.leadsListId) TK.data.leads.unshift(t); else TK.data.tasks.unshift(t);
    toast("Added to ClickUp"); tkRerender(); return t;
  }catch(e){ toast(e.message); return null; }
}

/* ---------- rows ---------- */

}
function tkEmpty(text){ return `<div class="tk-empty">${text}</div>`; }
function tkMatch(t){ const q = TK.search.trim().toLowerCase(); if(!q) return true; return [t.name, t.list, t.status, (t.tags||[]).join(" ")].join(" ").toLowerCase().includes(q); }

/* ---------- sections ---------- */
function tkWeek(){
  const today = tkStartOfDay(Date.now()), end = tkEndOfWeek();
  const tasks = TK.data.tasks.filter(t=>t.due && t.due < end && !tkIsDone(t) && tkMatch(t)).sort((a,b)=>a.due-b.due);
  const over = tasks.filter(t=>t.due < today);
  const byDay = {};
  tasks.filter(t=>t.due >= today).forEach(t=>{ const k = tkDayKey(t.due); (byDay[k] = byDay[k]||[]).push(t); });
  const noDate = TK.data.tasks.filter(t=>!t.due && !tkIsDone(t) && tkMatch(t)).length;
  const groups = [];
  if(over.length) groups.push(`<div class="tk-group"><div class="tk-group-h bad">Overdue <span>${over.length}</span></div><ul class="tk-ul">${over.map(t=>tkRow(t)).join("")}</ul></div>`);
  Object.keys(byDay).sort().forEach(k=>{
    const ms = tkFromKey(k);
    const label = ms===today ? "Today" : ms===today+TK_DAY ? "Tomorrow" : new Date(ms).toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"short" });
    groups.push(`<div class="tk-group"><div class="tk-group-h ${ms===today?"accent":""}">${label} <span>${byDay[k].length}</span></div><ul class="tk-ul">${byDay[k].map(t=>tkRow(t)).join("")}</ul></div>`);
  });
  return `<div class="panel">
    <div class="panel-head"><div><h3>This week</h3><div class="sub">Due by Sunday${over.length?`, plus ${over.length} overdue`:""}. ${noDate?`${noDate} open task${noDate===1?" has":"s have"} no due date (see All tasks).`:""}</div></div>
      <button class="btn sm" data-tk-new="week">${icon("plus")} Add task this week</button></div>
    ${groups.length ? groups.join("") : tkEmpty("Nothing due this week. Give tasks a due date in ClickUp, or add one here.")}
  </div>`;
}
function tkQuickListId(){
  const lists = tkWorkLists();
  if(TK.quickList && lists.some(l=>l.id===TK.quickList)) return TK.quickList;
  const pick = lists.find(l=>/operations/i.test(l.name)) || lists.find(l=>/personal/i.test(l.name)) || lists[0];
  return pick ? pick.id : null;
}
function tkQuick(){
  const all = TK.data.tasks.filter(t=>tkIsQuick(t) && tkMatch(t));

}
function tkAll(){
  const lists = tkWorkLists();
  const spaces = [...new Set(lists.map(l=>l.space||"Other"))];
  const open = TK.data.tasks.filter(t=>!tkIsDone(t) && tkMatch(t));

/* ---------- leads ---------- */
function tkLeadField(re, type){ return (TK.data.leadFields||[]).find(f=>(!type || f.type===type) && re.test(f.name)); }
function tkFieldVal(t, f){ if(!f) return null; const x = (t.fields||[]).find(v=>v.id===f.id); return x ? x.value : null; }
function tkOption(f, v){ if(v===null || v===undefined || v==="") return null; return (f.options||[]).find(o=>o.id===v || String(o.orderindex)===String(v)) || null; }
function tkFieldText(t, f){
  const v = tkFieldVal(t, f);
  if(v===null || v===undefined || v==="") return "";
  if(f.type==="drop_down"){ const o = tkOption(f, v); return o ? o.name : ""; }
  if(f.type==="date") return new Date(Number(v)).toLocaleDateString("en-GB",{ day:"numeric", month:"short" });
  if(f.type==="currency") return "£" + Number(v).toLocaleString("en-GB");
  if(f.type==="checkbox") return v===true || v==="true" ? "Yes" : "";
  return String(v);
}
function tkLeads(){
  const L = TK.data.leads || [];
  if(!TK.data.leadsListId) return `<div class="panel">${tkEmpty("No list called “Leads” found in your ClickUp. Create one and refresh.")}</div>`;
  const list = tkList(TK.data.leadsListId);
  const statuses = list ? list.statuses : [];
  const fPhone = tkLeadField(/phone/i, "phone"), fEmail = tkLeadField(/mail/i, "email"), fSource = tkLeadField(/source/i), fValue = tkLeadField(/value|amount/i), fFollow = tkLeadField(/follow/i, "date"), fHot = tkLeadField(/hot/i, "checkbox");

  const today = tkStartOfDay(Date.now());
  const followDue = (t)=>{ const v = tkFieldVal(t, fFollow); return v ? Number(v) : null; };
  matches.sort((a,b)=>{
    const ha = fHot && (tkFieldVal(a,fHot)===true || tkFieldVal(a,fHot)==="true"), hb = fHot && (tkFieldVal(b,fHot)===true || tkFieldVal(b,fHot)==="true");
    if(ha!==hb) return ha ? -1 : 1;
    return (followDue(a)||Infinity)-(followDue(b)||Infinity) || (b.updatedAt||0)-(a.updatedAt||0);
  });
  const chips = [{ k:"all", l:"Open", n:L.filter(t=>!tkIsDone(t)).length }].concat(statuses.filter(s=>s.type!=="closed" && s.type!=="done").map(s=>({ k:s.status, l:s.status, n:L.filter(t=>t.status===s.status).length, c:s.color })), [{ k:"closed", l:"Won / lost / done", n:L.filter(tkIsDone).length }]);
  return `<div class="panel">
    <div class="panel-head"><div><h3>Leads</h3><div class="sub">Your ClickUp Leads list. Status, fields and notes save straight to ClickUp.</div></div>
      <button class="btn primary sm" data-tk-new-lead>${icon("plus")} New lead</button></div>
    <div class="tk-chips">${chips.map(c=>`<button class="tk-chip ${TK.leadStatus===c.k?"active":""}" data-tk-lead-status="${esc(c.k)}">${c.c?`<i style="background:${c.c}"></i>`:""}${esc(c.l)} <span>${c.n}</span></button>`).join("")}</div>
    ${matches.length ? `<ul class="tk-leads">${matches.map(t=>{
      const fu = followDue(t); const hot = fHot && (tkFieldVal(t,fHot)===true || tkFieldVal(t,fHot)==="true");
      const phone = tkFieldText(t, fPhone), email = tkFieldText(t, fEmail);
      return `<li class="tk-lead ${TK.busy[t.id]?"busy":""}">
        <button class="tk-lead-main" data-tk-lead="${t.id}">
          <span class="tk-name">${hot?`<span class="tk-hot" title="Hot lead">${icon("flame")}</span>`:""}${esc(t.name)}</span>
          <span class="tk-meta">
            ${fSource && tkFieldText(t,fSource)?`<span class="tk-tag">${esc(tkFieldText(t,fSource))}</span>`:""}
            ${fValue && tkFieldText(t,fValue)?`<span class="tk-tag">${esc(tkFieldText(t,fValue))}</span>`:""}
            ${fu?`<span class="tk-due ${fu<today?"over":fu<today+TK_DAY?"today":""}">${icon("calendar")} Follow up ${fu<today+TK_DAY && fu>=today?"today":new Date(fu).toLocaleDateString("en-GB",{ day:"numeric", month:"short" })}</span>`:""}
            ${t.updatedAt?`<span class="tk-faint">Updated ${new Date(t.updatedAt).toLocaleDateString("en-GB",{ day:"numeric", month:"short" })}</span>`:""}
          </span>
        </button>
        <div class="tk-lead-actions">
          ${phone?`<a class="icon-btn" href="tel:${esc(phone.replace(/\s/g,""))}" title="Call ${esc(phone)}" aria-label="Call">${icon("phone")}</a>`:""}
          ${email?`<a class="icon-btn" href="mailto:${esc(email)}" title="Email ${esc(email)}" aria-label="Email">${icon("mail")}</a>`:""}
          <select class="tk-status-select" data-tk-status="${t.id}" style="--sc:${t.statusColor||"#8f8d94"}" aria-label="Status for ${esc(t.name)}">${statuses.map(s=>`<option value="${esc(s.status)}" ${s.status===t.status?"selected":""}>${esc(s.status)}</option>`).join("")}</select>
          <button class="btn sm" data-tk-lead="${t.id}">${icon("edit")} Notes</button>
        </div>
      </li>`; }).join("")}</ul>` : tkEmpty(TK.search ? "No leads match your search." : "No leads in this stage.")}
  </div>`;
}

/* ---------- lead drawer: fields + note history ---------- */
let TK_OPEN_LEAD = null;

function tkBindLeadModal(t){
  const m = document.querySelector("#modalOverlay .modal"); if(!m) return;
  document.getElementById("modalClose").onclick = ()=>{ TK_OPEN_LEAD = null; closeModal(); };
  document.getElementById("modalCancel").onclick = ()=>{ TK_OPEN_LEAD = null; closeModal(); };
  const name = document.getElementById("tkLeadName");
  name.onchange = ()=>{ const v = name.value.trim(); if(v && v!==t.name) tkUpdate(t.id, { name:v }, { name:v }, "Renamed in ClickUp"); };
  document.getElementById("tkLeadStatus").onchange = (e)=>{
    tkSetStatus(t.id, e.target.value);
    const box = m.querySelector("[data-tk-fu]"); if(box){ box.classList.add("flash"); box.scrollIntoView({ block:"nearest", behavior:"smooth" }); }
  };
  const pk = tkBindFollowUpPicker(m);
  if(pk.saveBtn) pk.saveBtn.onclick = ()=>{ const ms = pk.read(); if(!ms){ toast("Pick a day first."); return; } tkSaveFollowUp(t.id, ms); };
  if(pk.clearBtn) pk.clearBtn.onclick = ()=>tkSaveFollowUp(t.id, null);
  m.querySelectorAll("[data-tk-field]").forEach(el=>{
    el.onchange = ()=>{
      const f = TK.data.leadFields.find(x=>x.id===el.dataset.tkField); const type = el.dataset.type;
      let value, display;
      if(type==="checkbox"){ value = el.checked; display = el.checked; }
      else if(type==="date"){ value = el.value ? tkFromKey(el.value) : null; display = value; }
      else if(type==="number"){ value = el.value==="" ? null : Number(el.value); display = value; }
      else if(type==="drop_down"){ value = el.value || null; const o = f.options.find(x=>x.id===el.value); display = o ? o.orderindex : null; }
      else { value = el.value.trim() || null; display = value; }
      tkSetField(t.id, f.id, value, display);
    };
  });
  const add = document.getElementById("tkNoteAdd"), txt = document.getElementById("tkNoteText");
  const submit = async ()=>{
    const text = txt.value.trim(); if(!text){ txt.focus(); return; }
    add.disabled = true;
    try{
      const r = await tkApi({ action:"comment", taskId:t.id, text });
      const cm = TK.comments[t.id] || (TK.comments[t.id] = { items:[] });
      cm.items = (cm.items||[]).concat([r.comment]); delete cm.error;
      t.updatedAt = Date.now();
      toast("Note saved to ClickUp"); tkLeadModalRefresh(t.id, true); tkRerender();
    }catch(e){ toast(e.message); add.disabled = false; }
  };
  add.onclick = submit;
  txt.onkeydown = (e)=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); } };
}
function tkLeadModalRefresh(id, clearDraft){

      ${t&&t.description?`<div class="field field-span2"><label>Description</label><div class="tk-desc">${esc(t.description).replace(/\n/g,"<br>")}</div></div>`:""}
      ${!t?`<div class="field field-span2"><label for="tkT_desc">Description (optional)</label><textarea id="tkT_desc"></textarea></div>`:""}
    </div></div>
    <div class="modal-foot">
      ${t?`<a class="btn ghost" href="${esc(t.url)}" target="_blank" rel="noopener">${icon("arrow")} Open in ClickUp</a>`:""}
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">${t?"Save to ClickUp":"Add to ClickUp"}</button>
    </div>`);
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modalCancel").onclick = closeModal;
  document.getElementById("modalSave").onclick = async ()=>{
    const name = document.getElementById("tkT_name").value.trim();
    if(!name){ toast("Give the task a name"); return; }
    const dueKey = document.getElementById("tkT_due").value;
    const due = dueKey ? tkFromKey(dueKey) : null;
    const prio = document.getElementById("tkT_prio").value;
    const prioKey = Object.keys(TK_PRIO).find(k=>String(TK_PRIO[k].n)===prio) || null;
    if(t){
      const changes = {}, local = {};
      if(name!==t.name){ changes.name = name; local.name = name; }
      const st = document.getElementById("tkT_status").value;
      if(st!==t.status){ changes.status = st; const s = list && list.statuses.find(x=>x.status===st); Object.assign(local, { status:st, statusType: s?s.type:t.statusType, statusColor: s?s.color:t.statusColor }); }
      if((t.due?tkDayKey(t.due):"")!==dueKey){ changes.due = due; local.due = due; local.dueHasTime = false; }
      if((t.priority||null)!==prioKey){ changes.priority = prio ? Number(prio) : null; local.priority = prioKey; }
      closeModal();
      if(Object.keys(changes).length) tkUpdate(t.id, changes, local, "Saved to ClickUp");
    } else {
      const quick = document.getElementById("tkT_quick").checked;
      const payload = { listId: document.getElementById("tkT_list").value, name, due, priority: prio ? Number(prio) : undefined, tags: quick ? [TK_QUICK_TAG] : [], description: document.getElementById("tkT_desc").value };
      document.getElementById("modalSave").disabled = true;
      const l = tkList(payload.listId);
      await tkCreate(payload, { list: l ? l.name : null, listId: payload.listId, tags: payload.tags, due, priority: prioKey });
      closeModal();
    }
  };
  setTimeout(()=>document.getElementById("tkT_name").focus(), 0);
}

/* ============================= FITNESS · HEALTH DASHBOARD =============================
   One-page view of the calorie tracker: KPIs, weight/calorie chart, period at a
   glance, weekly summary and the daily log. Data is state.fitnessLog, which
   syncs live from the Calorie Tracker sheet (see syncSheetsLive). */
const HD = { period: "month", chart: "weight", filter: "all", search: "", showAll: false };
try{ const s = JSON.parse(localStorage.getItem("cockpit_health_ui")||"{}"); if(s.period) HD.period = s.period; if(s.chart) HD.chart = s.chart; }catch(e){}
function hdRemember(){ try{ localStorage.setItem("cockpit_health_ui", JSON.stringify({ period:HD.period, chart:HD.chart })); }catch(e){} }

const HD_DAY = 86400000;
function hdKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function hdDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function hdAdd(k, n){ const d = hdDate(k); d.setDate(d.getDate()+n); return hdKey(d); }
function hdShort(k){ return hdDate(k).toLocaleDateString("en-GB",{ day:"numeric", month:"short" }); }
function hdMonday(k){ const d = hdDate(k); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return hdKey(d); }
function hdNum(v){ const n = Number(v); return v===null || v===undefined || v==="" || !isFinite(n) || n<=0 ? null : n; }
function hdFmt(n, dp){ return n===null || n===undefined ? "—" : Number(n).toLocaleString("en-GB",{ minimumFractionDigits:dp||0, maximumFractionDigits:dp||0 }); }
function hdSigned(n, dp, unit){ if(n===null || n===undefined) return "—"; const v = Number(n.toFixed(dp)); return `${v>0?"+":v<0?"−":""}${Math.abs(v).toFixed(dp)}${unit||""}`; }

function hdRows(){ return state.fitnessLog.map(r=>({ id:r.id, date:r.date, weight:hdNum(r.weight), calories:hdNum(r.calories), protein:hdNum(r.protein), foods:(r.foods||"").trim(), fromSheet:r.fromSheet })).filter(r=>r.date).sort((a,b)=>a.date<b.date?-1:1); }
function hdMonths(rows){ return [...new Set(rows.map(r=>r.date.slice(0,7)))].sort().reverse(); }
function hdRange(rows){
  const today = todayStr();
  const first = rows.length ? rows[0].date : today;
  const p = HD.period;
  if(p==="7") return { from:hdAdd(today,-6), to:today, label:"Last 7 days" };
  if(p==="30") return { from:hdAdd(today,-29), to:today, label:"Last 30 days" };
  if(p==="90") return { from:hdAdd(today,-89), to:today, label:"Last 90 days" };
  if(p==="all") return { from:first, to:today, label:"All time" };
  if(/^\d{4}-\d{2}$/.test(p)){
    const [y,m] = p.split("-").map(Number);
    const last = hdKey(new Date(y, m, 0));
    return { from:`${p}-01`, to: last < today ? last : today, label: hdDate(`${p}-01`).toLocaleDateString("en-GB",{ month:"long", year:"numeric" }) };
  }
  return { from: today.slice(0,8)+"01", to: today, label:"This month" };
}
function hdStats(rows){
  const w = rows.filter(r=>r.weight), c = rows.filter(r=>r.calories), p = rows.filter(r=>r.protein);
  const start = w.length ? w[0].weight : null, end = w.length ? w[w.length-1].weight : null;
  const total = c.reduce((a,r)=>a+r.calories,0);
  return {
    days: rows.filter(r=>r.weight || r.calories).length,
    start, end, change: start!==null && end!==null ? end-start : null,
    pct: start ? (end-start)/start*100 : null,
    total, avgCal: c.length ? total/c.length : null,
    avgProtein: p.length ? p.reduce((a,r)=>a+r.protein,0)/p.length : null,
    avgWeight: w.length ? w.reduce((a,r)=>a+r.weight,0)/w.length : null,
  };
}

/* ---------- chart ---------- */
function hdChart(rows, range){
  const W = 720, H = 250, L = 48, R = 16, T = 18, B = 34;
  const days = Math.max(1, Math.round((hdDate(range.to)-hdDate(range.from))/HD_DAY));
  const x = (k)=>L + (Math.round((hdDate(k)-hdDate(range.from))/HD_DAY)/days)*(W-L-R);
  const xTicks = [];
  const step = Math.max(1, Math.round(days/5));
  for(let i=0; i<=days; i+=step) xTicks.push(hdAdd(range.from, i));
  const xAxis = xTicks.map(k=>`<text x="${x(k).toFixed(1)}" y="${H-10}" text-anchor="middle" class="hd-ax">${hdShort(k)}</text>`).join("");
  if(HD.chart==="weight"){
    const pts = rows.filter(r=>r.weight);
    if(pts.length < 2) return `<div class="hd-chart-empty">${pts.length ? "Log another weigh-in to see the trend." : "No weigh-ins in this period."}</div>`;
    let min = Math.min(...pts.map(p=>p.weight)), max = Math.max(...pts.map(p=>p.weight));
    const pad = Math.max(0.3, (max-min)*0.15); min = Math.floor((min-pad)*2)/2; max = Math.ceil((max+pad)*2)/2;
    const y = (v)=>T + (1-(v-min)/(max-min))*(H-T-B);
    const ticks = []; const ystep = (max-min) > 4 ? 1 : 0.5;
    for(let v=min; v<=max+1e-9; v+=ystep) ticks.push(v);
    const line = pts.map((p,i)=>`${i?"L":"M"}${x(p.date).toFixed(1)} ${y(p.weight).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts[pts.length-1].date).toFixed(1)} ${H-B} L${x(pts[0].date).toFixed(1)} ${H-B} Z`;
    const data = pts.map((p,i)=>({ x:x(p.date), y:y(p.weight), label:`${hdFmt(p.weight,1)} kg`, sub: i ? hdSigned(p.weight-pts[i-1].weight,1," kg") : "First weigh-in", down: i ? p.weight-pts[i-1].weight <= 0 : null, date:p.date }));
    return `<div class="hd-chart" data-points='${esc(JSON.stringify(data))}' data-w="${W}">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight from ${hdShort(pts[0].date)} to ${hdShort(pts[pts.length-1].date)}">
        <defs><linearGradient id="hdArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c4fe0" stop-opacity=".22"/><stop offset="1" stop-color="#6c4fe0" stop-opacity="0"/></linearGradient></defs>
        ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="hd-grid"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" class="hd-ax">${v.toFixed(1)}</text>`).join("")}
        ${xAxis}
        <path d="${area}" fill="url(#hdArea)"/>
        <path d="${line}" fill="none" stroke="#6c4fe0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p,i)=> (i===0 || i===pts.length-1 || pts.length<=12) ? `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"#fff":"#6c4fe0"}" stroke="#6c4fe0" stroke-width="2"/>` : "").join("")}
        <line class="hd-cursor" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/>
        <circle class="hd-dot" r="5.5" fill="#fff" stroke="#6c4fe0" stroke-width="2.5" style="display:none"/>
      </svg>
      <div class="hd-tip" style="display:none"></div>
    </div>`;
  }
  const pts = rows.filter(r=>r.calories);
  if(!pts.length) return `<div class="hd-chart-empty">No calories logged in this period.</div>`;
  const max = Math.ceil(Math.max(...pts.map(p=>p.calories))*1.1/250)*250;
  const y = (v)=>T + (1-v/max)*(H-T-B);
  const bw = Math.max(3, Math.min(22, (W-L-R)/(days+1)*0.62));
  const avg = pts.reduce((a,p)=>a+p.calories,0)/pts.length;
  const ticks = [0, max/4, max/2, max*3/4, max];
  const data = pts.map(p=>({ x:x(p.date), y:y(p.calories), label:`${hdFmt(p.calories)} kcal`, sub: p.foods ? p.foods.slice(0,60) : "", date:p.date }));
  return `<div class="hd-chart" data-points='${esc(JSON.stringify(data))}' data-w="${W}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">
      ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="hd-grid"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" class="hd-ax">${v>=1000?(v/1000).toFixed(v%1000?1:0)+"k":Math.round(v)}</text>`).join("")}
      ${xAxis}
      ${pts.map(p=>`<rect x="${(x(p.date)-bw/2).toFixed(1)}" y="${y(p.calories).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-B-y(p.calories)).toFixed(1)}" rx="${Math.min(5,bw/2).toFixed(1)}" fill="${p.calories>2500?"#f0a35e":"#a48cf0"}"/>`).join("")}
      <line x1="${L}" x2="${W-R}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="#6c4fe0" stroke-dasharray="5 5" stroke-width="1.5"/>
      <text x="${W-R}" y="${(y(avg)-6).toFixed(1)}" text-anchor="end" class="hd-ax" fill="#6c4fe0">avg ${hdFmt(avg)}</text>
      <line class="hd-cursor" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/>
      <circle class="hd-dot" r="0" style="display:none"/>
    </svg>
    <div class="hd-tip" style="display:none"></div>
  </div>`;
}

function hdWeeks(all, range){
  const out = [];
  for(let m = hdMonday(range.from); m <= range.to; m = hdAdd(m, 7)){
    const end = hdAdd(m, 6);
    const rows = all.filter(r=>r.date>=m && r.date<=end);
    out.push(Object.assign({ from:m, to:end }, hdStats(rows)));
  }
  return out;
}

function hdBind(){
  const root = document.getElementById("viewhost");
  const sel = document.getElementById("hdPeriod");
  if(sel) sel.onchange = ()=>{ HD.period = sel.value; HD.showAll = false; hdRemember(); renderView(); };
  root.querySelectorAll("[data-hd-chart]").forEach(b=>b.onclick = ()=>{ HD.chart = b.dataset.hdChart; hdRemember(); renderView(); });
  root.querySelectorAll("[data-hd-filter]").forEach(b=>b.onclick = ()=>{ HD.filter = b.dataset.hdFilter; renderView(); });
  root.querySelectorAll("[data-hd-more]").forEach(b=>b.onclick = ()=>{ HD.showAll = true; renderView(); });
  root.querySelectorAll("[data-hd-del]").forEach(b=>b.onclick = ()=>{
    const r = state.fitnessLog.find(x=>x.id===b.dataset.hdDel); if(!r) return;
    if(r.fromSheet){ toast("This day comes from your Calorie Tracker sheet. Delete it there and it disappears here."); return; }
    if(!confirm(`Delete the entry for ${hdShort(r.date)}?`)) return;
    state.fitnessLog = state.fitnessLog.filter(x=>x.id!==r.id); save(); renderView(); toast("Entry deleted");
  });
  const search = document.getElementById("hdSearch");
  if(search) search.oninput = ()=>{ HD.search = search.value; clearTimeout(hdBind._t); hdBind._t = setTimeout(()=>{ const pos = search.selectionStart; renderView(); const s2 = document.getElementById("hdSearch"); if(s2){ s2.focus(); s2.setSelectionRange(pos,pos); } }, 200); };
  // Chart hover read-out
  root.querySelectorAll(".hd-chart[data-points]").forEach(wrap=>{
    const pts = JSON.parse(wrap.dataset.points); const W = +wrap.dataset.w;
    const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".hd-tip"), cur = wrap.querySelector(".hd-cursor"), dot = wrap.querySelector(".hd-dot");
    const showAt = (p)=>{
      const r = svg.getBoundingClientRect(); const k = r.width / W;
      cur.setAttribute("x1", p.x); cur.setAttribute("x2", p.x); cur.style.display = "";
      if(dot.getAttribute("r")!=="0"){ dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); dot.style.display = ""; }
      tip.innerHTML = `<b>${esc(p.label)}</b>${p.sub?`<span class="${p.down===true?"good":p.down===false?"bad":""}">${p.down===true?"↓ ":p.down===false?"↑ ":""}${esc(p.sub)}</span>`:""}<em>${hdDate(p.date).toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short" })}</em>`;
      tip.style.display = "";
      const left = Math.min(Math.max(p.x*k, tip.offsetWidth/2+4), r.width - tip.offsetWidth/2 - 4);
      tip.style.left = left + "px"; tip.style.top = Math.max(0, p.y*k - tip.offsetHeight - 14) + "px";
    };
    const hide = ()=>{ tip.style.display = "none"; cur.style.display = "none"; dot.style.display = "none"; };
    svg.addEventListener("mousemove", (e)=>{
      const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width;
      let best = pts[0], d = Infinity; pts.forEach(p=>{ const dd = Math.abs(p.x-px); if(dd<d){ d = dd; best = p; } }); showAt(best);
    });
    svg.addEventListener("mouseleave", hide);
    if(HD.chart==="weight" && pts.length) showAt(pts[pts.length-1]);
  });
}

function wfTicked(id){ return (WF.ticks[wfToday()]||[]).includes(id); }
async function wfLoad(){
  if(WF.loaded) return;
  WF.loaded = true;
  try{
    const { data } = await sb.from("app_state").select("value").eq("key","daily_workflow").maybeSingle();
    if(data && data.value && data.value.ticks) WF.ticks = data.value.ticks;
  }catch(e){ try{ WF.ticks = JSON.parse(localStorage.getItem("cockpit_wf_ticks")||"{}"); }catch(_){} }
  if(activeView==="workflow") renderView();
}
let wfSaveT = null;
function wfSave(){
  const t = wfToday();
  Object.keys(WF.ticks).forEach(k=>{ if(k < addDays(t,-30)) delete WF.ticks[k]; }); // keep a month of history
  try{ localStorage.setItem("cockpit_wf_ticks", JSON.stringify(WF.ticks)); }catch(e){}
  clearTimeout(wfSaveT);
  wfSaveT = setTimeout(async ()=>{
    try{
      const { data: { session } } = await sb.auth.getSession(); if(!session) return;
      await sb.from("app_state").upsert({ user_id: session.user.id, key:"daily_workflow", value:{ ticks:WF.ticks }, updated_at:new Date().toISOString() }, { onConflict:"user_id,key" });
    }catch(e){ console.warn("daily workflow save failed", e); }
  }, 600);
}
function wfToggle(id){
  const t = wfToday(); const list = new Set(WF.ticks[t]||[]);
  list.has(id) ? list.delete(id) : list.add(id);
  WF.ticks[t] = [...list]; wfSave(); renderView();
}
function wfNowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function wfMin(hm){ const [h,m] = hm.split(":").map(Number); return h*60+m; }
function wfCurrentBlock(doc){ const n = wfNowMin(); const b = doc.blocks.find(b=>b.from && n>=wfMin(b.from) && n<wfMin(b.to)); return b ? b.id : null; }
/* every tickable line of a doc (labels like "Prospecting checklist:" aren't tickable) */
function wfAllIds(doc){
  const out = [];
  const walk = (items)=>items.forEach(it=>{ if(!it.label) out.push(it.id); if(it.kids) walk(it.kids); });
  doc.blocks.forEach(b=>{ if(b.items) walk(b.items); else out.push(b.tickId); });
  return out;
}
function wfText(it){
  let t = esc(it.t);
  if(it.strong) t = t.replace(esc(it.strong), `<b>${esc(it.strong)}</b>`);
  return t;
}
function wfCount(items){ let n = 0, d = 0; const walk = (xs)=>xs.forEach(it=>{ if(!it.label){ n++; if(wfTicked(it.id)) d++; } if(it.kids) walk(it.kids); }); walk(items); return { n, d }; }
function wfItems(items, depth){
  return `<ul class="wf-ul d${depth}">${items.map(it=>{
    const on = !it.label && wfTicked(it.id);
    const body = it.link
      ? `<a class="wf-link" href="${esc(it.link)}" target="_blank" rel="noopener">${icon("link")} ${wfText(it)}</a>`
      : `<span class="${it.b?"wf-must":it.b2?"wf-strong":it.label?"wf-label":""}">${wfText(it)}</span>${it.b?`<span class="wf-must-tag">Must do</span>`:""}${it.btn?`<a class="wf-btn" href="${esc(it.btn.href)}" target="_blank" rel="noopener">${icon("arrow")} ${esc(it.btn.label)}</a>`:""}`;
    return `<li class="${on?"done":""} ${it.label?"label":""} ${it.b?"must":""}">
      <div class="wf-line">
        ${it.label ? `<span class="wf-dot" aria-hidden="true"></span>` : `<button type="button" class="wf-check ${on?"on":""}" data-wf-tick="${it.id}" role="checkbox" aria-checked="${on}" aria-label="${esc(it.t)}">${icon("check")}</button>`}
        <div class="wf-txt">${body}</div>
      </div>
      ${it.kids ? wfItems(it.kids, depth+1) : ""}
    </li>`;
  }).join("")}</ul>`;
}
function wfBlockCard(b, isNow){
  const look = WF_LOOK[b.id] || { c:"violet", ic:"list", time:()=>"" };
  const title = WF_TITLE[b.id] || b.h;
  const sub = b.h.replace(/:$/,"");
  const c = b.items ? wfCount(b.items) : { n:1, d: wfTicked(b.tickId) ? 1 : 0 };
  const complete = c.n && c.d===c.n;
  const head = `<header class="wf-card-h">
      <span class="wf-ic ${look.c}">${icon(look.ic)}</span>
      <div class="wf-card-t"><h2>${esc(title)}</h2>${sub.replace(/[^a-z]/gi,"").toLowerCase()===title.replace(/[^a-z]/gi,"").toLowerCase() ? "" : `<span class="wf-card-sub">${esc(sub)}</span>`}</div>
      <div class="wf-card-r">
        ${isNow?`<span class="wf-now"><i></i>Now</span>`:""}
        ${look.time(b)?`<span class="wf-time">${esc(look.time(b))}</span>`:""}
        <span class="wf-mini ${complete?"full":""}" title="${c.d} of ${c.n} done">${complete?icon("check"):`${c.d}/${c.n}`}</span>
      </div>
    </header>`;
  const body = b.items ? wfItems(b.items, 0)
    : `<div class="wf-line wf-single ${wfTicked(b.tickId)?"done":""}"><button type="button" class="wf-check ${wfTicked(b.tickId)?"on":""}" data-wf-tick="${b.tickId}" role="checkbox" aria-checked="${wfTicked(b.tickId)}" aria-label="${esc(title+": "+b.text)}">${icon("check")}</button><div class="wf-txt">${esc(b.text)}</div></div>`;
  return `<section class="wf-card c-${look.c} ${isNow?"now":""} ${complete?"complete":""}" data-block="${b.id}">${head}<div class="wf-card-b">${body}</div></section>`;
}
function wfRequired(r){
  if(!r) return "";
  return `<section class="wf-required" aria-label="${esc(r.h)}">
    <div class="wf-req-h"><span class="wf-req-ic">${icon("bolt")}</span><div><h2>${esc(r.h.replace(/:$/,""))}</h2><p>Keep these in mind on every call.</p></div></div>
    <div class="wf-req-grid">${r.groups.map(g=>`<div class="wf-req-g">
      <h3>${icon(g.h==="Sales Call"?"headset":"phone")} ${esc(g.h)}</h3>
      <ul>${g.items.map(x=>`<li>${icon("check")}<span>${esc(x)}</span></li>`).join("")}</ul>
    </div>`).join("")}</div>
  </section>`;
}
function viewWorkflow(){
  setTimeout(wfLoad, 0);
  const doc = WF_DOCS.find(d=>d.id===WF.doc) || WF_DOCS[0];
  const ids = wfAllIds(doc), done = ids.filter(wfTicked).length;
  const now = wfCurrentBlock(doc);
  const pct = ids.length ? Math.round(done/ids.length*100) : 0;
  const R = 22, C = 2*Math.PI*R;
  const nowBlock = doc.blocks.find(b=>b.id===now);
  return `
  <div class="topbar">
    <div><h1>Daily Workflow</h1><div class="sub">${new Date().toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" })} · ticks reset every morning</div></div>
    <div class="topbar-right">
      <a class="btn" href="${WF_DOC_URL}" target="_blank" rel="noopener">${icon("link")} Open in Google Docs</a>
    </div>
  </div>
  <div class="content wf">
    <div class="wf-hero">
      <div class="wf-ring" title="${done} of ${ids.length} done today">
        <svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/><circle cx="28" cy="28" r="${R}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 28 28)"/></svg>
        <b>${pct}%</b>
      </div>
      <div class="wf-hero-t">
        <span class="wf-hero-k">Today’s workflow</span>
        <h2>${done===ids.length && ids.length ? "Everything done. Great day." : nowBlock ? `Right now: ${esc(WF_TITLE[nowBlock.id]||nowBlock.h)}` : "Plan the day, block by block"}</h2>
        <p>${done} of ${ids.length} done${nowBlock && nowBlock.items ? ` · ${wfCount(nowBlock.items).n - wfCount(nowBlock.items).d} left in this block` : ""}</p>
      </div>
      <div class="wf-hero-blocks">${doc.blocks.map(b=>{ const look = WF_LOOK[b.id]||{c:"violet"}; const c = b.items ? wfCount(b.items) : { n:1, d: wfTicked(b.tickId)?1:0 }; return `<button type="button" class="wf-pip ${look.c} ${b.id===now?"now":""} ${c.n&&c.d===c.n?"full":""}" data-wf-jump="${b.id}" title="${esc(WF_TITLE[b.id]||b.h)} · ${c.d}/${c.n}"><span style="--p:${c.n?Math.round(c.d/c.n*100):0}%"></span>${esc((WF_TITLE[b.id]||b.h).split(" ")[0])}</button>`; }).join("")}</div>
    </div>
    <div class="wf-timeline">
      ${doc.blocks.map(b=>wfBlockCard(b, b.id===now)).join("")}
    </div>
    ${wfRequired(doc.required)}
  </div>`;
}
function wfBind(){
  const root = document.getElementById("viewhost");
  root.querySelectorAll("[data-wf-tick]").forEach(b=>b.onclick = ()=>wfToggle(b.dataset.wfTick));
  root.querySelectorAll("[data-wf-jump]").forEach(b=>b.onclick = ()=>{ const el = root.querySelector(`.wf-card[data-block="${b.dataset.wfJump}"]`); if(el) el.scrollIntoView({ block:"start", behavior:"smooth" }); });
  root.querySelectorAll("[data-wf-doc]").forEach(b=>b.onclick = ()=>{ WF.doc = b.dataset.wfDoc; try{ localStorage.setItem("cockpit_wf_doc", WF.doc); }catch(e){} renderView(); });
  const nowEl = root.querySelector(".wf-card.now");
  if(nowEl && !wfBind._scrolled){ wfBind._scrolled = true; setTimeout(()=>nowEl.scrollIntoView({ block:"center", behavior:"smooth" }), 80); }
}
/* keep the "Now" marker moving while the tab is open */
setInterval(()=>{ if(activeView==="workflow" && !document.getElementById("modalOverlay")) renderView(); }, 5*60*1000);

/* ============================= INIT ============================= */
function renderLogin(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="brand-mark" style="margin:0 auto 14px">RE</div>
        <h2>Reach Eyeballs Cockpit</h2>
        <div class="sub" style="margin-bottom:18px">Sign in to continue</div>
        <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" /></div>
        <div class="field" style="margin-top:10px"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" /></div>
        <div id="loginError" class="login-error" role="alert"></div>
        <button class="btn primary" id="loginSubmit" style="width:100%;margin-top:14px;justify-content:center">Sign in</button>
      </div>
    </div>
  `;
  const submit = async ()=>{
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    boot();
  };
  document.getElementById("loginSubmit").onclick = submit;
  document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
}
async function logout(){
  clearTimeout(saveTimer);
  syncAll();
  await sb.auth.signOut();
  unmountChat();
  boot();
}
async function boot(){
  const app = document.getElementById("app");
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  window.__userEmail = session.user.email;
  app.innerHTML = `<div class="login-screen"><div class="sub">Loading…</div></div>`;
  await loadState();
  mergeSheetImport();
  renderShell();
  startSheetsLive();
  mountChat();
}
boot();
})();
</script>
