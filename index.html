const RECURRING_TASKS = {
  morning: [],
  afternoon: [],
  evening: [
    { id:"eod-clickup", title:"Update ClickUp tasks & log work", url:WF_LINKS.clickup, linkLabel:"ClickUp" },
    { id:"eod-fitness", title:"Log today's fitness", jump:"fitness", linkLabel:"Fitness" },
  ],
};
const CockpitData = {
  routines(section, date){
    return (cpConfig().routines[section]||[]).map(r=>Object.assign({}, r, { section, done: wfCheck("rt:"+section+":"+r.id, date) }));
  },
  /* Normalised task shape: { key, title, done, source, priority, url?, jump?, linkLabel?, meta?, removable? }
     source: planned | clickup | manual | recurring — a future ClickUp provider only needs to return this shape. */
  businessTasks(section){
    const today = todayStr(), dow = new Date(today+"T00:00:00").getDay();
    const out = [];
    if(section==="morning"){
      wfNotes("eod","priority",addDays(today,-1)).forEach((n,i)=>out.push({ key:"planned|"+i, title:n.text, done:!!n.done, source:"planned", priority:1, meta:"Planned yesterday" }));
      if(dow===1||dow===4) out.push({ key:"rec|client-tracker", title:"Check the client tracker", done:wfCheck("client-tracker"), source:"recurring", priority:2, jump:"clients", linkLabel:"Clients", meta:"Mon & Thu" });
    }
    /* ClickUp: overdue + due today → morning; due tomorrow or undated → afternoon. Later dates wait. */
    const tomorrow = addDays(today,1);
    CLICKUP_TASKS.filter(t=>t.assignee===CLICKUP_MY_NAME && t.kind!=="lead").forEach(t=>{
      const slot = t.dueDate && t.dueDate<=today ? "morning" : (!t.dueDate || t.dueDate===tomorrow) ? "afternoon" : null;
      if(slot!==section) return;
      const when = !t.dueDate ? "No due date" : t.dueDate<today ? "Overdue since "+fmtDateShort(t.dueDate) : t.dueDate===today ? "Due today" : "Due tomorrow";
      out.push({ key:"clickup|"+t.id, title:t.name, done:wfCheck("cu:"+t.id), source:"clickup", priority: !t.dueDate?5:2, url:t.url, linkLabel:"ClickUp", meta:when+" · "+t.list });
    });
    if(section==="afternoon" && dow===5) out.push({ key:"rec|fri-reports", title:"Send client reports", done:wfCheck("fri-reports"), source:"recurring", priority:2, jump:"clients", linkLabel:"Clients", meta:"Every Friday" });
    wfNotes(section,"task").forEach((n,i)=>out.push({ key:"manual|"+i, title:n.text, done:!!n.done, source:"manual", priority:3, removable:true }));
    wfNotes(section,"hot").forEach((n,i)=>out.push({ key:"hot|"+i, title:n.text, done:!!n.done, source:"manual", priority:2, removable:true, meta:"Hot lead" }));
    (RECURRING_TASKS[section]||[]).forEach(t=>out.push({ key:"rec|"+t.id, title:t.title, done:wfCheck(t.id), source:"recurring", priority:4, url:t.url, jump:t.jump, linkLabel:t.linkLabel, meta:"Daily" }));
    return out.map((t,i)=>Object.assign(t,{ order:i })).sort((a,b)=>(a.done-b.done)||(a.priority-b.priority)||(a.order-b.order));
  },
  /* Normalised lead shape for the follow-up list. */
  followUpLeads(section){
    /* ClickUp "Leads" list is the source of truth for who to call. */
    return CockpitData.clickupLeads(section);
  },
  localLeads(section){
    const dueIds = new Set(followUpsDueToday().map(l=>l.id));
    return needsFollowUp("all").filter(l=>{
      const slot = l.slot || (dueIds.has(l.id) ? "morning" : "afternoon");
      return slot===section;
    }).map(l=>{
      const c = state.clients.find(x=>x.id===l.clientId);
      return {
        id:l.id, name:l.leadName, service:l.service||"", client:c?c.company:"", location:l.location||"",
        status:l.outcome, tone:outcomeBadgeClass(l.outcome), phone:l.phone||"", email:l.email||"",
        nextAction:l.nextAction||l.notes||"", due:dueIds.has(l.id), daysSince:daysBetween(l.date,todayStr()),
        contacted: wfLeadCall(section,"lead:"+l.id),
      };
    });
  },
  /* Leads from the ClickUp "Leads" list. Due today/overdue → morning, otherwise afternoon. */
  clickupLeads(section){
    const today = todayStr();
    if(section!=="morning" && section!=="golden") return [];
    /* Afternoon round: everyone not reached in the morning. */
    return CLICKUP_TASKS.filter(t=>t.kind==="lead").filter(t=>section==="morning" || !wfLeadCall("morning","lead:cu-"+t.id)).map(t=>({
      id:"cu-"+t.id, name:t.name, service:"", client:"ClickUp lead", location:"", status:t.status.replace(/\s*\|\s*/g," · "),
      tone: t.priority==="urgent"?"bad":"warn", phone:t.phone||"", email:"", nextAction: /call today/i.test(t.status)?"Call today":"",
      due:true, daysSince:0, url:t.url, contacted: wfLeadCall(section,"lead:cu-"+t.id),
    }));
  },
  /* Calendar events for a date, optionally limited to one block. */
  events(section, date){
    const d = date||todayStr();
    return CALENDAR_EVENTS.filter(e=>!e.allDay && e.date===d).filter(e=>{
      if(!section) return true;
      const h = Number(e.start.slice(0,2));
      return (h<12?"morning":h<18?"afternoon":"evening")===section;
    });
  },
  allDay(date){ const d=date||todayStr(); return CALENDAR_EVENTS.filter(e=>e.allDay && e.date<=d && (e.endDate||e.date)>=d); },
  upcomingMeetings(){
    const t = todayStr();
    return CALENDAR_EVENTS.filter(e=>e.meeting && e.date>=t).slice(0,6);
  },
  /* Today's overview: ClickUp tasks assigned to you that are due today or overdue. */
  todayTasks(){
    const today = todayStr();
    return CLICKUP_TASKS.filter(t=>t.assignee===CLICKUP_MY_NAME && t.kind!=="lead" && t.dueDate && t.dueDate<=today).map(t=>({
      id:t.id, title:t.name, url:t.url, list:t.list, done:wfCheck("cu:"+t.id), overdue:t.dueDate<today, due:t.dueDate,
    })).sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));
  },
  salesCalls(date){
    const d = date||todayStr();
    const rows = state.adsAcqLeads.filter(l=>l.date===d);
    return { logged: rows.length, completed: rows.filter(l=>SHOWED_OUTCOMES.includes(l.outcome)).length };
  },
};

/* ---- Metrics (computed only from existing data + configured goals) ---- */
function cpMetrics(){
  const g = cpConfig().goals;
  const weights = state.fitnessLog.filter(e=>e.weight).slice().sort((a,b)=>a.date<b.date?-1:1);
  const latestW = weights.length ? weights[weights.length-1] : null;
  const startW = g.weightStart!=null ? Number(g.weightStart) : (weights.length ? Number(weights[0].weight) : null);
  const week = cpFullWeekDates();
  const weekCal = state.fitnessLog.filter(e=>week.includes(e.date)).reduce((a,e)=>a+(Number(e.calories)||0),0);
  const calDays = state.fitnessLog.filter(e=>week.includes(e.date) && e.calories).length;
  const routines = cpConfig().routines;
  let workouts = 0;
  week.forEach(d=>Object.keys(routines).forEach(sec=>routines[sec].forEach(r=>{ if(r.workout && wfCheck("rt:"+sec+":"+r.id, d)) workouts++; })));
  return { g, latestW, startW, weekCal, calDays, workouts };
}

const CP_ART = {};
function cpRng(seed){ let s = seed; return ()=>{ s = (s*16807)%2147483647; return (s-1)/2147483646; }; }
function cpBlob(x, rand, cx, cy, r, col){
  x.fillStyle = col; x.beginPath();
  for(let a=0;a<=Math.PI*2+0.01;a+=0.25){ const rr = r*(0.75+rand()*0.4); x.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.8); }

}
function cpRock(x, rand, x0, width, top, base, col){
  x.fillStyle = col; x.beginPath(); x.moveTo(x0, base);
  const steps = 14;

    const t = i/steps, bell = Math.sin(t*Math.PI);
    x.lineTo(x0+t*width, base-(base-top)*Math.pow(bell,0.6)*(0.7+rand()*0.45));
  }
  x.lineTo(x0+width, base); x.closePath(); x.fill();
}

      for(let i=0;i<12;i++) cpBlob(x, rand, 1380+rand()*220, h*0.3+rand()*120, 26+rand()*18, "#0f120c");
      cpBlob(x, rand, 1360, h*0.86, 130, "#2b2422"); cpBlob(x, rand, 1520, h*0.8, 110, "#3a302c");
      [[1060,h*0.8],[1110,h*0.82],[1200,h*0.79]].forEach(([cx,cy])=>{
        const c = x.createRadialGradient(cx,cy,0,cx,cy,70); c.addColorStop(0,"rgba(255,190,110,.9)"); c.addColorStop(0.12,"rgba(255,160,80,.45)"); c.addColorStop(1,"rgba(255,140,60,0)");
        x.fillStyle=c; x.fillRect(cx-70,cy-70,140,140);
      });
    }
    const vg = x.createRadialGradient(w*0.6,h*0.45,h*0.3,w*0.6,h*0.45,w*0.75);
    vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.3)");
    x.fillStyle=vg; x.fillRect(0,0,w,h);
    const img = x.getImageData(0,0,w,h), d = img.data;
    for(let i=0;i<d.length;i+=4){ const n=(rand()-0.5)*12; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    x.putImageData(img,0,0);
    CP_ART[kind] = cv.toDataURL("image/jpeg", 0.8);
  }catch(e){ CP_ART[kind] = ""; }
  return CP_ART[kind];
}

/* ---- Day calendar (Google Calendar events for one day, sized to time) ---- */
const CP_CAL_HOUR = 46;
function cpEvStyle(e){
  const t = e.title.toLowerCase();
  if(/gym|run\b|run |workout|treino/.test(t)) return { tone:"yellow", ic:"dumbbell" };
  if(/lunch|almo[cç]o|dinner|jantar/.test(t)) return { tone:"red", ic:"fork" };
  if(e.meeting || /\bx\b|meeting|reuni|catch.?up|intro/.test(t)) return { tone:"purple", ic:"headset" };
  if(/call|ligar|follow up|prospect/.test(t)) return { tone:"orange", ic:"phone" };
  if(/read|vision|meditat|audiobook/.test(t)) return { tone:"violet", ic:"book" };
  if(/eod|report|admin|delivery|tasks/.test(t)) return { tone:"green", ic:"list" };
  if(/film|video|drone|content/.test(t)) return { tone:"teal", ic:"target" };
  if(/job|apply|sales/.test(t)) return { tone:"blue", ic:"briefcase" };
  return { tone:"blue", ic:"calendar" };
}
function cpLayoutEvents(evs){
  /* side-by-side columns for overlapping events */
  const items = evs.map(e=>({ e, s:cpMin(e.start), en:Math.max(cpMin(e.end), cpMin(e.start)+15) })).sort((a,b)=>a.s-b.s||b.en-a.en);
  let cluster=[], clusterEnd=-1; const out=[];
  const flush=()=>{ const cols=[]; cluster.forEach(it=>{ let c=cols.findIndex(end=>end<=it.s); if(c<0){ c=cols.length; cols.push(0);} cols[c]=it.en; it.col=c; }); cluster.forEach(it=>{ it.cols=cols.length; out.push(it); }); cluster=[]; };
  items.forEach(it=>{ if(it.s>=clusterEnd && cluster.length) flush(); cluster.push(it); clusterEnd=Math.max(clusterEnd, it.en); });
  if(cluster.length) flush();
  return out;
}

function cpMetricCard(o){

    ? `<div class="cp-dots" aria-label="${o.dots.done} of ${o.dots.total}">${Array.from({length:o.dots.total},(_,i)=>`<i class="${i<o.dots.done?"on":""}"></i>`).join("")}</div>`
    : `<div class="cp-metric-bar"><div class="cp-bar ${o.tone||""}"><div style="width:${cpPct(o.pct)}%"></div></div><span class="tnum">${o.side||""}</span></div>`;

function cpMetricsRow(){
  const m = cpMetrics(), g = m.g, unit = state.settings.weightUnit;
  const cards = [];
  if(!m.latestW) cards.push({ icon:"dumbbell", label:"Current weight", tone:"teal", empty:true, cta:"Set a goal" });
  else {
    const cur = Number(m.latestW.weight);
    if(g.weightGoal==null) cards.push({ icon:"dumbbell", label:"Current weight", tone:"teal", value:cur.toFixed(1), unit:" "+unit, goal:`Logged ${fmtDateShort(m.latestW.date)}`, pct:0, side:"No goal" });
    else {
      const goal = Number(g.weightGoal), start = m.startW;
      const pct = start!=null && start!==goal ? (start-cur)/(start-goal)*100 : (cur<=goal?100:0);
      cards.push({ icon:"dumbbell", label:"Current weight", tone:"teal", value:cur.toFixed(1), unit:" "+unit, goal:`Goal: ${goal.toFixed(1)} ${unit}`, pct, side: start!=null?fmtWeightSigned(cur-start,unit):"" });
    }
  }
  if(g.bankBalance==null) cards.push({ icon:"coins", label:"Money in bank", tone:"gold", empty:true, cta:"Add balance" });
  else cards.push({ icon:"coins", label:"Money in bank", tone:"gold", value:fmtEuro(g.bankBalance), goal: g.bankGoal?`Goal: ${fmtEuro(g.bankGoal)}`:(g.bankUpdated?`Updated ${fmtDateShort(g.bankUpdated)}`:"No goal set"),
    pct: g.bankGoal? g.bankBalance/g.bankGoal*100 : 0, side: g.bankGoal?Math.round(cpPct(g.bankBalance/g.bankGoal*100))+"%":"" });
  cards.push({ icon:"flame", label:"Calories this week", tone: g.weeklyCalories && m.weekCal>g.weeklyCalories?"bad":"blue", value:fmtNum(m.weekCal),
    goal: g.weeklyCalories?`Goal: ${fmtNum(g.weeklyCalories)}`:`${m.calDays} day${m.calDays===1?"":"s"} logged · no target`,
    pct: g.weeklyCalories? m.weekCal/g.weeklyCalories*100 : 0, side: g.weeklyCalories?Math.round(m.weekCal/g.weeklyCalories*100)+"%":"" });
  const wt = g.weeklyWorkouts;
  cards.push({ icon:"target", label:"Weekly workouts", tone:"gold", value:String(m.workouts), unit: wt?` / ${wt}`:"", goal: wt?"":"Set a weekly target",
    dots: wt? { done:Math.min(m.workouts,wt), total:Math.min(wt,10) } : null, pct:0, side:"" });
  return `<div class="cp-metrics">${cards.map(cpMetricCard).join("")}</div>`;
}

function cpRoutinesModal(section){
  const list = cpConfig().routines[section]||[];
  const text = list.map(r=>`${r.sub?"- ":""}${r.time?r.time+" ":""}${r.label}${r.workout?" *":""}`).join("\n");
  openModal(`
    <div class="modal-head"><h3>${CP_SECTIONS[section].label} routines</h3><button class="icon-btn" id="modalClose">${icon("x")}</button></div>
    <div class="modal-body">
      <div class="field"><label for="f_routines">One item per line. Start a line with “- ” to make it a sub-item, add a time in front if you want one (06:30 Run), and end with * to count it as a workout.</label>
      <textarea id="f_routines" rows="8" style="font-family:ui-monospace,Menlo,monospace">${esc(text)}</textarea></div>
      <p class="cell-muted" style="font-size:11.5px;margin:10px 0 0">Example: <code>06:30 Run *</code>. Routines stay personal and are never sent to ClickUp.</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="cpRestore">Restore defaults</button>
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Save routines</button>
    </div>`);
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modalCancel").onclick = closeModal;
  const persist = (rows)=>{ const r = Object.assign({}, (state.cockpit||{}).routines||{}); r[section]=rows; cpSaveConfig({ routines:r }); closeModal(); renderView(); toast("Routines saved"); };
  document.getElementById("cpRestore").onclick = ()=>persist(CP_DEFAULT_ROUTINES[section].map(x=>Object.assign({},x)));
  document.getElementById("modalSave").onclick = ()=>{
    const old = list;
    const rows = document.getElementById("f_routines").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l0=>{
      const sub = /^-\s+/.test(l0); const l = l0.replace(/^-\s+/,"");
      const m = l.match(/^(\d{1,2}[:.]\d{2})\s+(.+?)\s*(\*)?$/);
      const time = m ? m[1].replace(".",":").padStart(5,"0") : "";
      const label = m ? m[2] : l.replace(/\*$/,"").trim();
      const prev = old.find(o=>o.label===label) || {};
      const workout = m ? !!m[3] : /\*$/.test(l);
      const row = { id: prev.id||uid(), time, label, workout };
      if(prev.url){ row.url = prev.url; row.linkLabel = prev.linkLabel; }
      if(prev.recap) row.recap = true;
      if(sub) row.sub = true;
      return row;
    });
    persist(rows);
  };
}

function bindCockpitEvents(){
  const root = document.querySelector(".cockpit");
  if(!root) return;
  const rerender = ()=>{ renderView(); };
  root.querySelectorAll("[data-cp-cal]").forEach(el=>el.addEventListener("click", ()=>{
    const d = +el.dataset.cpCal; uiState.cpCalDate = d===0 ? todayStr() : addDays(uiState.cpCalDate||todayStr(), d); uiState.cpCalScroll = null; rerender();
  }));
  /* calendar scroll: keep position across re-renders; otherwise open at the current time (today) or 06:00 */
  const calBox = document.getElementById("cpCalScroll");
  if(calBox){
    const saved = uiState.cpCalScroll;
    if(saved && saved.date===calBox.dataset.date) calBox.scrollTop = saved.top;
    else {
      const isToday = calBox.dataset.date===todayStr();
      const mins = isToday ? Math.max(0, cpNowMin()-90) : 6*60;
      calBox.scrollTop = mins/60*CP_CAL_HOUR;
    }
    calBox.addEventListener("scroll", ()=>{ uiState.cpCalScroll = { date:calBox.dataset.date, top:calBox.scrollTop }; }, { passive:true });
  }
  root.querySelectorAll("[data-cp-routine]").forEach(el=>el.addEventListener("click", ()=>{
    const [sec,id] = el.dataset.cpRoutine.split("|"); const k = "rt:"+sec+":"+id;
    wfToggleCheck(k, !wfCheck(k)); cpLast = k; rerender();
  }));
  root.querySelectorAll("[data-cp-task]").forEach(el=>el.addEventListener("click", ()=>{
    const [sec, src, ref] = el.dataset.cpTask.split("|");
    if(src==="rec") wfToggleCheck(ref, !wfCheck(ref));
    else if(src==="clickup") wfToggleCheck("cu:"+ref, !wfCheck("cu:"+ref));
    else if(src==="planned"){ const d=addDays(todayStr(),-1), l=wfNotes("eod","priority",d); if(l[ref]){ l[ref].done=!l[ref].done; wfSetNotes("eod","priority",l,d); } }
    else { const type = src==="hot"?"hot":"task"; const l=wfNotes(sec,type); if(l[ref]){ l[ref].done=!l[ref].done; wfSetNotes(sec,type,l); } }
    cpLast = sec+"|"+src+"|"+ref; rerender();
  }));
  root.querySelectorAll("[data-cp-task-del]").forEach(el=>el.addEventListener("click", ()=>{
    const [sec, src, ref] = el.dataset.cpTaskDel.split("|"); const type = src==="hot"?"hot":"task";

  root.querySelectorAll("[data-cp-leads-expand]").forEach(el=>el.addEventListener("click", ()=>{ uiState.cpLeadsExpand=Object.assign({},uiState.cpLeadsExpand); uiState.cpLeadsExpand[el.dataset.cpLeadsExpand]=!uiState.cpLeadsExpand[el.dataset.cpLeadsExpand]; rerender(); }));

/* ============================= B2B (LinkedIn outreach) ============================= */
const B2B_METRICS = [
  { key:"openerMS", label:"Opener MS" },
  { key:"proposalMS", label:"Proposal MS" },
  { key:"fupsToday", label:"FUPs" },
  { key:"docAccepts", label:"Doc Accepts" },
  { key:"connectionsSent", label:"Connections sent" },
  { key:"callsProposed", label:"Calls Proposed" },
  { key:"calendarLinksSent", label:"Calendar links sent", green:1 },
  { key:"callsBooked", label:"Calls Booked", green:2 },
  { key:"sales", label:"Sales", green:3 },
  { key:"cashCollected", label:"Cash Collected", money:true, green:4 },
];
function b2bMonthKey(dateStr){ return dateStr.slice(0,7); }
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function b2bMonthLabel(monthKey){
  const m = Number(monthKey.split("-")[1]);
  return MONTH_ABBR[m-1];
}
function b2bAvailableMonths(){
  const year = todayStr().slice(0,4);
  const months = [];
  for(let m=1;m<=12;m++) months.push(year+"-"+String(m).padStart(2,"0"));
  return months;
}
function b2bSumRows(rows){
  const out = {};
  B2B_METRICS.forEach(m=>{ out[m.key] = sum(rows, m.key); });
  return out;
}
function b2bRowsForMonth(monthKey){ return state.b2bLog.filter(r=>b2bMonthKey(r.date)===monthKey); }
function b2bRowsForRange(start,end){ return state.b2bLog.filter(r=>r.date>=start && r.date<=end); }
function b2bMetricCell(m, val){ return `<td class="num tnum">${m.money?fmtMoney(val):fmtNum(val)}</td>`; }
function rateCard(label, value){
  return `<div class="card stat rate"><div class="label">${label}</div><div class="value-row"><span class="value tnum">${value}</span></div></div>`;
}
function b2bStatCard(label, value, money, green){
  const display = typeof value==="string" ? value : (money?fmtMoney(value):fmtNum(value));
  return `<div class="card stat hero${green?" hero-g"+green:""}"><div class="label">${label}</div><div class="value-row"><span class="value tnum">${display}</span></div></div>`;
}
function b2bStageRates(t){
  return [
    { label:"Opener→Proposal", value: safeDiv(t.proposalMS, t.openerMS) },
    { label:"Proposal→Call", value: safeDiv(t.callsProposed, t.proposalMS) },
    { label:"Call→Calendar", value: safeDiv(t.calendarLinksSent, t.callsProposed) },
    { label:"Calendar→Booked", value: safeDiv(t.callsBooked, t.calendarLinksSent) },
    { label:"Booked→Sale", value: safeDiv(t.sales, t.callsBooked) },
  ];
}
function viewB2B(){
  const months = b2bAvailableMonths();
  const curMonth = todayStr().slice(0,7);
  if(uiState.b2bTab!=="dashboard" && !months.includes(uiState.b2bTab)) uiState.b2bTab = curMonth;
  const activeTab = uiState.b2bTab;
  const allRows = state.b2bLog.slice().sort((a,b)=>a.date<b.date?-1:1);

    </div>`;

  return `
    <div class="topbar">
      <div>
        <h1>LinkedIn Acquisition</h1>

function renderB2BMonth(monthKey){
  const rows = b2bRowsForMonth(monthKey);
  const monthTotals = b2bSumRows(rows);
  const weeks = weeksForMonth(monthKey);
  const weekRows = weeks.map(w=>Object.assign({ start:w.start, end:w.end }, b2bSumRows(b2bRowsForRange(w.start,w.end))));
  const dailyRows = rows.slice().sort((a,b)=>a.date<b.date?1:-1);

  const rates = b2bStageRates(monthTotals);

  return `
    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Monthly summary</h3><div class="sub">${b2bMonthLabel(monthKey)} — calculated live from the daily log below</div></div></div>
      <div class="grid cols-4">
        ${B2B_METRICS.map(m=>b2bStatCard(m.label, monthTotals[m.key], m.money, m.green)).join("")}
      </div>
      <div class="grid cols-5" style="margin-bottom:0">
        ${rates.map(r=>rateCard(r.label, fmtRate(r.value))).join("")}
      </div>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Weekly summary</h3><div class="sub">${b2bMonthLabel(monthKey)} — Monday–Sunday weeks touching this month</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Week</th>${B2B_METRICS.map(m=>`<th class="num">${m.label}</th>`).join("")}</tr></thead>
          <tbody>
            ${weekRows.map((w,i)=>`<tr><td>Week ${i+1} <span class="cell-muted">${fmtDateShort(w.start)}–${fmtDateShort(w.end)}</span></td>${B2B_METRICS.map(m=>b2bMetricCell(m,w[m.key])).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h3>Daily log</h3><div class="sub">${dailyRows.length} ${dailyRows.length===1?"entry":"entries"} this month${dailyRows.some(r=>r.fromSheet)?` · some rows synced from the tracker sheet (last pulled ${fmtDateLong(B2B_SHEET_SYNCED_AT)}) · log there, then ask Claude to sync`:""}</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th>${B2B_METRICS.map(m=>`<th class="num">${m.label}</th>`).join("")}<th></th></tr></thead>
          <tbody>
            ${dailyRows.length? dailyRows.map(r=>`
              <tr>
                <td>${fmtDateShort(r.date)} ${r.fromSheet?`<span class="badge good" title="Synced from Google Sheet">sheet</span>`:""}</td>
                ${B2B_METRICS.map(m=>b2bMetricCell(m,r[m.key])).join("")}
                <td><div class="row-actions">
                  <button class="icon-btn" data-edit-b2b="${r.id}">${icon("edit")}</button>
                  <button class="icon-btn" data-del-b2b="${r.id}">${icon("trash")}</button>
                </div></td>
              </tr>`).join("") : `<tr class="empty-row"><td colspan="${B2B_METRICS.length+2}">No activity logged for ${b2bMonthLabel(monthKey)} yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function renderB2BDashboard(months){
  const perMonth = months.map(mk=>{
    const rows = b2bRowsForMonth(mk);
    return { key:mk, hasData: rows.length>0, totals: b2bSumRows(rows) };
  });
  const grandTotal = {};
  B2B_METRICS.forEach(m=>{ grandTotal[m.key] = perMonth.reduce((a,p)=>a+p.totals[m.key],0); });
  const anyData = perMonth.some(p=>p.hasData);
  return `
    <div class="panel">
      <div class="panel-head"><div><h3>Dashboard</h3><div class="sub">Overview across all months of ${todayStr().slice(0,4)}</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Stat</th>${perMonth.map(p=>`<th class="num">${b2bMonthLabel(p.key)}</th>`).join("")}<th class="num col-total">Totals</th></tr></thead>
          <tbody>
            ${B2B_METRICS.map(m=>`
              <tr>
                <td><b>${m.label}</b></td>
                ${perMonth.map(p=>p.hasData?b2bMetricCell(m,p.totals[m.key]):'<td class="num cell-muted">—</td>').join("")}
                <td class="num tnum col-total" style="font-weight:700">${anyData?(m.money?fmtMoney(grandTotal[m.key]):fmtNum(grandTotal[m.key])):"—"}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function barChart(values, color){
  if(!values.some(v=>v>0)) return `<div class="empty-state" style="padding:20px 0">${icon("info")}<p>No data yet for this range.</p></div>`;
  const max = Math.max(...values,1);
  const w=560,h=140,gap=4,barW=(w/values.length)-gap;
  const bars = values.map((v,i)=>{
    const bh = (v/max)*(h-18);
    const x = i*(barW+gap);
    return `<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${color}" opacity="${i===values.length-1?1:0.55}"/>`;
  }).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h-0.5}" x2="${w}" y2="${h-0.5}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

/* ============================= ADS (Client campaign tracker) ============================= */
function adsFiltered(period, clientId){
  return state.adsLog.filter(r=> inPeriod(r.date, period) && (clientId==="all" || r.clientId===clientId) ).sort((a,b)=>a.date<b.date?1:-1);
}
function adsAgg(period, clientId){
  const rows = state.adsLog.filter(r=> inPeriod(r.date, period) && (clientId==="all" || r.clientId===clientId));
  const bookings = sum(rows,"bookings"), cancellations = sum(rows,"cancellations"), reschedules = sum(rows,"reschedules");
  const noShows = sum(rows,"noShows"), liveCalls = sum(rows,"liveCalls"), offersMade = sum(rows,"offersMade");
  const closedDeals = sum(rows,"closedDeals"), cashCollected = sum(rows,"cashCollected");
  let followUps=0, notClosedYet=0;
  const sortedRows = rows.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(clientId!=="all" && sortedRows.length){
    const latest = sortedRows[sortedRows.length-1];
    followUps = Number(latest.followUps)||0; notClosedYet = Number(latest.notClosedYet)||0;
  } else {
    followUps = sum(rows,"followUps"); notClosedYet = sum(rows,"notClosedYet");
  }
  return {
    bookings, cancellations, reschedules, noShows, liveCalls, offersMade, closedDeals, cashCollected, followUps, notClosedYet,
    cancellationRate: safeDiv(cancellations, bookings),
    showRate: safeDiv(liveCalls, bookings),
    closeRate: safeDiv(closedDeals, liveCalls),
    offerCloseRate: safeDiv(closedDeals, offersMade),
  };
}
function leadsFiltered(clientId){
  return state.leadsLog.filter(r=>clientId==="all"||r.clientId===clientId).sort((a,b)=>a.date<b.date?1:-1);
}
function needsFollowUp(clientId){
  return leadsFiltered(clientId).filter(r=>FOLLOW_UP_OUTCOMES.includes(r.outcome));
}
function outcomeBadgeClass(outcome){
  if(CLOSED_OUTCOMES.includes(outcome)) return "good";
  if(FOLLOW_UP_OUTCOMES.includes(outcome)) return "warn";
  return "bad";
}

function metaCall(key, input, force, opts){
  opts = opts || {};

  if(metaPending[key]) return metaPending[key];
  const base = Object.assign({ include_additional_context:false, reporting_purpose:["metric_lookup"], advertiser_job:"report_measure_or_look_up", client_conversation_id:META_CONV_ID }, input);
  const acct = input.ad_account_id || "accounts";
  const pageLimit = opts.pages || 1;
  const run = async ()=>{
    let rows = [], cursor = null, at = null, page = 0, extra = {};
    do {
      const res = await metaInvoke(opts.tool || META_TOOL, cursor ? Object.assign({}, base, { cursor }) : base, force);
      const p = metaPayload(res);
      at = at || (res.cache && res.cache.storedAt) || Date.now();
      rows = rows.concat(opts.tool==="ads_get_ad_accounts" ? (p.ad_accounts||[]) : metaRowsOf(p));
      cursor = (p.pagination && p.pagination.next_cursor) || p.next_cursor || null;
      page++;
    } while(cursor && page<pageLimit);
    return { rows, at, truncated: !!cursor };
  };

    metaLogEvent(acct, input.level||"accounts", false, err&&err.code, err&&err.message); throw err;
  });
  metaPending[key] = pr; return pr;
}

async function metaServer(body){

  if(!session) throw { code:"not_signed_in", message:"Sign in to the Cockpit first." };
  let res;
  try{ res = await fetch("/api/meta", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` }, body: JSON.stringify(body) }); }
  catch(e){ throw { code:"server_unavailable", message:"Network error", retryable:true }; }
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw { code:j.code || "server_unavailable", message:j.error || ("status "+res.status), retryable:!!j.retryable, retryAfterMs: j.retryable ? 20000 : undefined };
  return j;
}

/* Delivery health, independent of the selected range: are any ads switched on, and did they actually

   spending limit, schedule or review problems.) */
const META_DELIVERY_MIN_IMPR = 20;
const metaDelivery = {};
MetaData.delivery = function(acct, force){
  const t = todayStr(), tr = JSON.stringify({ since:addDays(t,-13), until:t });
  return Promise.all([
    metaCall(`dl|${acct}|${tr}`, { ad_account_id:acct, level:"ad_account", fields:["impressions","amount_spent"], time_range:tr, time_increment:"1" }, force),
    metaCall(`aa|${acct}|${t}`, { ad_account_id:acct, level:"ad", fields:["name","effective_status"], filtering:[{ field:"effective_status", operator:"IN", value:["ACTIVE"] }], limit:50, reporting_purpose:["entity_lookup"] }, force),
  ]).then(([d, a])=>{
    const days = d.rows.map(x=>({ date:x.date_start, impr:metaNum(x.impressions), spend:metaNum(x.amount_spent) }));
    const recent = days.filter(x=>x.date>=addDays(t,-1));
    const delivering = recent.some(x=>x.impr>=META_DELIVERY_MIN_IMPR);
    const last = days.filter(x=>x.impr>=META_DELIVERY_MIN_IMPR).map(x=>x.date).sort().pop() || null;
    const activeAds = a.rows.length, more = a.truncated;
    const out = { activeAds, more, delivering, lastDelivered:last, at:d.at,
      state: activeAds===0 ? "none" : delivering ? "on" : "stalled" };
    metaDelivery[acct] = out; return out;
  });
};

  return `<span class="m-status on" title="${dv.activeAds}${dv.more?"+":""} active ad${dv.activeAds===1?"":"s"}"><i></i>Delivering</span>${compact?"":`<small class="m-since">${dv.activeAds}${dv.more?"+":""} active ad${dv.activeAds===1?"":"s"}</small>`}`;
}
function metaSaveTz(acct, tz){ const c = metaClients().find(x=>x.id===acct); if(c && c.timezone!==tz){ c.timezone = tz; save(); } }
/* connection status for one client, from the account list + the last call */
function metaConn(c){
  const err = metaClientErr[c.id];
  if(err && err.code==="needs_reauth") return { cls:"bad", label:"Reconnect Meta", hint:"Your Meta access token expired. Paste a new one at the top of Client Ads." };
  if(metaLive===false) return { cls:"muted", label:"Offline", hint:"Live connection not available in this view." };
  if(!metaAccounts) return err ? { cls:"bad", label:"Error", hint:metaErrorText(err) } : { cls:"muted", label:"Checking…", hint:"" };
  const a = metaAccounts[c.id];
  if(!a) return { cls:"bad", label:"No access", hint:"Your Facebook user can't see this ad account. The client needs to give your Business partner access to it." };
  if(a.is_ads_mcp_enabled===false) return { cls:"warn", label:"Not supported yet", hint:a.is_ads_mcp_disabled_reason||"Meta hasn't enabled API access for this account yet." };
  if(a.is_queryable===false) return { cls:"bad", label:"Can't be read", hint:(a.not_queryable_reason||"Meta refused access")+(a.account_status&&a.account_status!=="ACTIVE"?" · account status: "+a.account_status.toLowerCase():"") };
  if(a.account_status && a.account_status!=="ACTIVE") return { cls:"warn", label:a.account_status.charAt(0)+a.account_status.slice(1).toLowerCase(), hint:"Meta reports the account as "+a.account_status.toLowerCase()+"." };
  if(err) return { cls:"bad", label:"Error", hint:metaErrorText(err) };
  if(a.has_payment_method===false) return { cls:"warn", label:"No payment method", hint:"Ads can't deliver until a payment method is added in Ads Manager." };
  return { cls:"on", label:"Connected", hint:"" };
}
/* ---- 3. Metrics ---- */
function mAgg(rows){ return rows.reduce((a,x)=>({ spend:a.spend+x.spend, leads:a.leads+x.leads, impressions:a.impressions+x.impressions, clicks:a.clicks+x.clicks }), { spend:0, leads:0, impressions:0, clicks:0 }); }
/* fill any ratio Meta didn't return (snapshot / sums across clients) */
function mDerive(t){
  const clicksAll = t.clicksAll!=null ? t.clicksAll : t.clicks;
  return Object.assign({}, t, {
    cpl: t.cpl!=null ? t.cpl : (t.leads ? t.spend/t.leads : null),
    ctr: t.ctr!=null ? t.ctr : (t.impressions ? clicksAll/t.impressions*100 : null),
    cpm: t.cpm!=null ? t.cpm : (t.impressions ? t.spend/t.impressions*1000 : null),
    cpc: t.cpc!=null ? t.cpc : (clicksAll ? t.spend/clicksAll : null),
    linkCtr: t.linkCtr!=null ? t.linkCtr : (t.impressions ? t.clicks/t.impressions*100 : null),
  });
}
function mChange(cur, prev){ if(cur==null || prev==null || !isFinite(cur) || !isFinite(prev) || prev===0) return null; return (cur-prev)/prev*100; }
/* direction: "up" = higher is better, "down" = lower is better, "neutral" = no judgement */
function mDelta(cur, prev, direction){
  const c = mChange(cur, prev);
  if(c==null) return `<span class="m-delta none" title="No data for the previous period">—</span>`;
  const good = direction==="neutral" ? null : (direction==="up" ? c>=0 : c<=0);
  const cls = Math.abs(c)<0.5 ? "flat" : good==null ? "neutral" : good ? "good" : "bad";
  return `<span class="m-delta ${cls}" title="vs previous period">${c>0?"▲":c<0?"▼":"■"} ${Math.abs(c)>=1000?">999":Math.abs(c).toFixed(Math.abs(c)<10?1:0)}%</span>`;
}
function mMoney(v, cur, dp){ if(v==null||!isFinite(v)) return "—"; const sym = cur==="EUR"?"€":cur==="USD"?"$":"£"; const d = dp!=null?dp:(v<100?2:0); return sym+Number(v).toLocaleString("en-GB",{ minimumFractionDigits:d, maximumFractionDigits:d }); }
function mInt(v){ return v==null?"—":Math.round(v).toLocaleString("en-GB"); }
function mPct(v){ return v==null||!isFinite(v)?"—":v.toFixed(2)+"%"; }

/* ---- Loading orchestration ---- */
const metaState = { overview:{}, client:{} };
function metaRerender(){ if(activeView==="ads") renderView(); }
function metaLoadOverview(force){
  if(metaLive===false) return;
  const r = metaRange(), key = r.since+"|"+r.until;
  if((!metaAccounts && !metaTried.accounts) || force){ metaTried.accounts = true; MetaData.accounts(force).then(metaRerender, metaRerender); }
  metaClients().forEach(c=>{ if((!metaDelivery[c.id] && !metaTried["d"+c.id]) || force){ metaTried["d"+c.id] = true; MetaData.delivery(c.id, force).then(metaRerender, metaRerender); } });
  metaClients().forEach(c=>{
    const k = c.id+"|"+key;
    if(metaState.overview[k] && !force) return;
    metaState.overview[k] = Object.assign({}, metaState.overview[k]||{}, { loading:true });
    Promise.all([ MetaData.totals(c.id, r.since, r.until, force), MetaData.totals(c.id, r.prevSince, r.prevUntil, force), MetaData.daily(c.id, r, force).catch(()=>null) ]).then(([tc, tp, d])=>{
      metaState.overview[k] = { cur:mDerive(tc), prev:mDerive(tp), series:d?d.rows:null, at:tc.at };
      metaRerender();
    }).catch(err=>{ metaState.overview[k] = { error:err }; metaRerender(); });
  });
}
function metaLoadClient(acct, force){
  if(metaLive===false) return;
  const r = metaRange(), key = acct+"|"+r.since+"|"+r.until;
  if(metaState.client[key] && !force) return;
  metaState.client[key] = { loading:true };
  if(!metaAccounts && !metaTried.accounts){ metaTried.accounts = true; MetaData.accounts().then(metaRerender, metaRerender); }
  if((!metaDelivery[acct] && !metaTried["d"+acct]) || force){ metaTried["d"+acct] = true; MetaData.delivery(acct, force).then(metaRerender, metaRerender); }
  Promise.all([ MetaData.daily(acct, r, force), MetaData.totals(acct, r.since, r.until, force), MetaData.totals(acct, r.prevSince, r.prevUntil, force) ]).then(([d, tc, tp])=>{
    metaState.client[key] = Object.assign(metaState.client[key]||{}, { loading:false, cur:mDerive(tc), prev:mDerive(tp), series:d.rows, at:tc.at });
    metaRerender();
  }).catch(err=>{ metaState.client[key] = Object.assign(metaState.client[key]||{}, { error:err, loading:false }); metaRerender(); });
  MetaData.entities(acct, "campaign", r, null, force).then(rows=>{ metaState.client[key] = Object.assign(metaState.client[key]||{}, { campaigns:rows }); metaRerender(); })
    .catch(err=>{ metaState.client[key] = Object.assign(metaState.client[key]||{}, { campaignsError:err }); metaRerender(); });
}
/* scheduled refresh: every 15 minutes while Client Ads is open and the tab is visible */
const META_AUTO_MS = 15*60*1000;
function metaRefreshCurrent(){
  const m = metaUI();
  if(m.view==="client"){ Object.keys(metaState.client).forEach(k=>{ if(k.startsWith(m.clientId+"|")) delete metaState.client[k]; }); metaLoadClient(m.clientId, true); }
  else { Object.keys(metaState.overview).forEach(k=>delete metaState.overview[k]); metaLoadOverview(true); }
  metaRerender();
}
setInterval(()=>{ if(activeView==="ads" && document.visibilityState==="visible" && metaLive!==false) metaRefreshCurrent(); }, META_AUTO_MS);
function metaLoadChildren(acct, campaignId){
  if(metaLive===false) return;
  const r = metaRange(), key = acct+"|"+r.since+"|"+r.until+"|"+campaignId;
  if(metaState.client[key]) return;
  metaState.client[key] = { loading:true };
  Promise.all([ MetaData.entities(acct, "adset", r, campaignId), MetaData.entities(acct, "ad", r, campaignId) ])
    .then(([adsets, ads])=>{ metaState.client[key] = { adsets, ads }; metaRerender(); })
    .catch(err=>{ metaState.client[key] = { error:err }; metaRerender(); });
}
/* Snapshot fallback (Last 30 days only). */
function metaSnapshotFor(acct){
  const m = metaUI(); if(m.range!=="last30") return null;
  const s = META_SNAPSHOT.data[acct]; if(!s) return null;
  const conv = t=>Object.assign({}, t, { clicksAll:null, ctr:t.impressions? t.clicks/t.impressions*100 : null, cpc:t.clicks? t.spend/t.clicks : null });
  return { cur:mDerive(conv(s.cur)), prev:mDerive(conv(s.prev)), series:null, at:null, snapshot:true };
}
function metaErrorText(err){
  const code = err && err.code;
  if(code==="not_connected") return "Connect Meta to load live ad data.";
  if(code==="needs_reauth") return "Your Meta access token has expired or was revoked. Paste a new one to reload live data.";
  if(code==="rate_limited") return "Meta is rate-limiting requests. Press Refresh in a minute.";
  if(code==="server_not_connected"||code==="selection_required") return "Add Meta Ads in claude.ai Settings → Connectors to load live data.";
  if(code==="blocked_by_policy"||code==="approval_required") return "Your organization blocks Meta Ads access on this page.";
  if(code==="not_granted"||code==="capability_disabled"||code==="capability_removed") return "Live Meta data isn't available in this view.";
  if(code==="tool_error") return "Meta returned an error: "+((err&&err.message)||"unknown");
  if(code==="server_unavailable") return "Meta Ads is briefly unreachable. Press Refresh to try again.";
  return "Couldn't load live data"+(err&&err.message?": "+err.message:"")+".";
}

function mAvatar(name, size){

  const hue = hues[h%hues.length];
  const ini = name.replace(/[^A-Za-z0-9 &]/g,"").split(/\s+/).filter(w=>w && w!=="&").slice(0,2).map(w=>w[0].toUpperCase()).join("");

}
function mSpark(series, key){
  if(!series || !series.length) return `<span class="m-spark-empty">—</span>`;
  const vals = series.map(x=>x[key]), w=96, h=26, max=Math.max(...vals,1);
  const pts = vals.map((v,i)=>[ vals.length===1?w/2:i/(vals.length-1)*w, h-2-(v/max)*(h-4) ]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");

/* --- charts --- */
function mChart(series, opts){
  const W=520, H=170, P={l:44,r:opts.dual?44:12,t:12,b:24};
  if(!series || !series.length) return `<div class="m-chart-empty">${opts.empty||"No data for this range."}</div>`;
  const n = series.length, iw = W-P.l-P.r, ih = H-P.t-P.b;
  const bw = Math.max(2, Math.min(18, iw/n*0.62)), pad = bw/2 + 6;
  const xs = i=> P.l + pad + (n===1? (iw-2*pad)/2 : i/(n-1)*(iw-2*pad));
  const scale = (vals)=>{ const mx = Math.max(...vals.filter(v=>v!=null&&isFinite(v)), 0); const nice = mx<=0?1: Math.pow(10,Math.floor(Math.log10(mx))); const top = Math.ceil(mx/nice)*nice || 1; return { top, y:v=>P.t+ih-(v/top)*ih }; };
  let svg = "";
  const s1 = scale(series.map(x=>x[opts.key]));
  [0,0.5,1].forEach(f=>{ const y=P.t+ih-f*ih; svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" class="m-grid"/><text x="${P.l-6}" y="${y+3}" class="m-axis" text-anchor="end">${opts.fmt(s1.top*f)}</text>`; });
  if(opts.type==="bar"){
    series.forEach((x,i)=>{ const v=x[opts.key]||0; const y=s1.y(v); svg+=`<rect x="${(xs(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(P.t+ih-y).toFixed(1)}" rx="2" fill="${opts.color}"><title>${fmtDateShort(x.date)}: ${opts.fmt(v)}</title></rect>`; });
  } else {
    const pts = series.map((x,i)=>x[opts.key]==null?null:[xs(i), s1.y(x[opts.key])]);
    let d=""; pts.forEach((p,i)=>{ if(!p) return; d += (d&&pts[i-1]?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)+" "; });
    svg += `<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>{ if(p) svg+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${n>40?1.6:2.6}" fill="${opts.color}"><title>${fmtDateShort(series[i].date)}: ${opts.fmt(series[i][opts.key])}</title></circle>`; });
  }
  if(opts.dual){
    const s2 = scale(series.map(x=>x[opts.dual.key]));
    [0,0.5,1].forEach(f=>{ const y=P.t+ih-f*ih; svg+=`<text x="${W-P.r+6}" y="${y+3}" class="m-axis">${opts.dual.fmt(s2.top*f)}</text>`; });
    const pts = series.map((x,i)=>[xs(i), s2.y(x[opts.dual.key]||0)]);
    svg += `<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${opts.dual.color}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  const ticks = n<=1?[0]:[0, Math.floor((n-1)/2), n-1];
  ticks.forEach(i=>{ svg+=`<text x="${xs(i)}" y="${H-6}" class="m-axis" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${fmtDateShort(series[i].date)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="m-chart" role="img" aria-label="${esc(opts.label)}">${svg}</svg>`;
}
const M_COLS = [
  ["name","Campaign","text"], ["status","Status","text"], ["budget","Budget","money"], ["spend","Spend","money"], ["impressions","Impressions","int"],
  ["reach","Reach","int"], ["clicks","Link clicks","int"], ["leads","Leads","int"], ["cpl","CPL","money2"], ["ctr","CTR","pct"], ["cpm","CPM","money2"],
  ["results","Results","result"], ["costPerResult","Cost / result","money2"],
];
function mEnt(x){ return Object.assign({}, x, { cpl: x.leads ? x.spend/x.leads : null, ctr: x.impressions ? (x.clicksAll!=null?x.clicksAll:x.clicks)/x.impressions*100 : null, cpm: x.impressions ? x.spend/x.impressions*1000 : null, budgetV: x.budget ? x.budget.v : null }); }
function mStatusPill(s){
  const map = { ACTIVE:["on","Active"], PAUSED:["off","Paused"], CAMPAIGN_PAUSED:["off","Campaign paused"], ADSET_PAUSED:["off","Ad set paused"], WITH_ISSUES:["warn","Issues"], DISAPPROVED:["bad","Disapproved"], PENDING_REVIEW:["warn","In review"], IN_PROCESS:["warn","Processing"], ARCHIVED:["muted","Archived"], DELETED:["muted","Deleted"], PENDING_BILLING_INFO:["bad","Billing"] };
  const [cls, label] = map[s] || ["muted", s ? s.toLowerCase().replace(/_/g," ") : "—"];
  return `<span class="m-pill ${cls}">${label}</span>`;
}
function mCell(col, x, cur){
  const [k,,t] = col, v = k==="budget" ? x.budgetV : x[k];
  if(k==="name") return `<td class="m-name">${x.__level==="campaign"?`<span class="m-caret">${icon("arrow")}</span>`:""}<span>${esc(x.name)}</span>${x.objective?`<small class="m-obj">${esc(x.objective.replace(/^OUTCOME_/,"").replace(/_/g," ").toLowerCase())}</small>`:""}</td>`;
  if(k==="status") return `<td>${mStatusPill(x.status)}</td>`;
  if(k==="budget") return `<td class="num tnum">${x.budget?mMoney(x.budget.v,cur,0)+`<small>/${x.budget.t==="day"?"day":"total"}</small>`:'<span class="m-dim">—</span>'}</td>`;
  if(t==="money") return `<td class="num tnum">${mMoney(v,cur,0)}</td>`;
  if(t==="money2") return `<td class="num tnum">${mMoney(v,cur,2)}</td>`;
  if(t==="pct") return `<td class="num tnum">${mPct(v)}</td>`;
  if(t==="result") return `<td class="num tnum">${v==null?'<span class="m-dim" title="Meta has no result data for this objective in this range">—</span>':mInt(v)}${x.resultLabel?`<small class="m-rlabel">${esc(x.resultLabel)}</small>`:""}</td>`;
  return `<td class="num tnum">${mInt(v)}</td>`;
}
function viewMetaClient(){
  const m = metaUI(), c = metaClients().find(x=>x.id===m.clientId) || metaClients()[0], r = metaRange();
  const key = c.id+"|"+r.since+"|"+r.until, st = metaState.client[key] || {};
  let data = st.cur ? st : null;
  if(!data && (metaLive===false || st.error)) data = metaSnapshotFor(c.id);
  const cur = data&&data.cur, prev = data&&data.prev, cu = c.currency;
  const kpis = [
    ["Total spend", cur&&mMoney(cur.spend,cu,0), cur&&mDelta(cur.spend,prev&&prev.spend,"neutral")],
    ["Total leads", cur&&mInt(cur.leads), cur&&mDelta(cur.leads,prev&&prev.leads,"up")],
    ["Cost per lead", cur&&mMoney(cur.cpl,cu,2), cur&&mDelta(cur.cpl,prev&&prev.cpl,"down")],
    ["Impressions", cur&&mInt(cur.impressions), cur&&mDelta(cur.impressions,prev&&prev.impressions,"up")],
    ["Reach", cur&&mInt(cur.reach), cur&&mDelta(cur.reach,prev&&prev.reach,"up")],
    ["Clicks (all)", cur&&(cur.clicksAll!=null?mInt(cur.clicksAll):"—"), cur&&mDelta(cur.clicksAll,prev&&prev.clicksAll,"up")],
    ["Link clicks", cur&&mInt(cur.clicks), cur&&mDelta(cur.clicks,prev&&prev.clicks,"up")],
    ["CTR (all)", cur&&mPct(cur.ctr), cur&&mDelta(cur.ctr,prev&&prev.ctr,"up")],
    ["Link CTR", cur&&mPct(cur.linkCtr), cur&&mDelta(cur.linkCtr,prev&&prev.linkCtr,"up")],
    ["CPM", cur&&mMoney(cur.cpm,cu,2), cur&&mDelta(cur.cpm,prev&&prev.cpm,"down")],
    ["Frequency", cur&&(cur.frequency?cur.frequency.toFixed(2):"—"), cur&&mDelta(cur.frequency,prev&&prev.frequency,"neutral")],
    ["Cost per click", cur&&mMoney(cur.cpc,cu,2), cur&&mDelta(cur.cpc,prev&&prev.cpc,"down")],
  ];
  const noSource = !data && (metaLive===false || st.error);
  if(noSource) kpis.forEach(k=>{ k[1]="—"; k[2]=""; });
  const series = data && data.series ? data.series.map(x=>Object.assign({}, x, { cpl: x.leads ? x.spend/x.leads : null })) : null;
  const liveOnly = (data && data.snapshot) || noSource ? "Daily charts need the live Meta Ads connection." : null;
  const camps = (st.campaigns||[]).map(x=>mEnt(Object.assign({ __level:"campaign" }, x)));
  const sort = m.sort;
  const val = (x)=> sort.key==="budget" ? (x.budgetV==null?-1:x.budgetV) : x[sort.key];
  camps.sort((a,b)=>{ const va=val(a), vb=val(b);
    if(typeof va==="string"||typeof vb==="string") return (sort.dir==="asc"?1:-1)*String(va||"").localeCompare(String(vb||""));
    const na = va==null?-Infinity:va, nb = vb==null?-Infinity:vb; return sort.dir==="asc" ? na-nb : nb-na; });
  const at = data && data.at;
  let recon = "";
  if(camps.length && cur && !data.snapshot){
    const cs = camps.reduce((a,x)=>a+x.spend,0), cl = camps.reduce((a,x)=>a+x.leads,0);
    const ok = Math.abs(cs-cur.spend) <= Math.max(0.05, cur.spend*0.005) && cl===cur.leads;
    recon = `<tr class="m-total"><td class="m-name"><b>All campaigns</b></td><td></td><td></td><td class="num tnum"><b>${mMoney(cs,cu,0)}</b></td><td class="num tnum">${mInt(camps.reduce((a,x)=>a+x.impressions,0))}</td><td></td><td class="num tnum">${mInt(camps.reduce((a,x)=>a+x.clicks,0))}</td><td class="num tnum"><b>${mInt(cl)}</b></td><td class="num tnum">${mMoney(cl?cs/cl:null,cu,2)}</td><td colspan="4" class="m-recon ${ok?"ok":"warn"}">${ok?"✓ Matches the account total":`Account total: ${mMoney(cur.spend,cu,0)} · ${mInt(cur.leads)} leads${st.campaignsTruncated?" (more campaigns than shown)":""}`}</td></tr>`;
  }
  const rowsHtml = camps.map(x=>{
    const open = !!m.expanded[x.id], kids = metaState.client[key+"|"+x.id];
    let child = "";
    if(open){
      if(!kids || kids.loading) child = `<tr class="m-child"><td colspan="${M_COLS.length}"><span class="m-skel"></span></td></tr>`;
      else if(kids.error) child = `<tr class="m-child"><td colspan="${M_COLS.length}" class="m-dim">${esc(metaErrorText(kids.error))}</td></tr>`;
      else child = (kids.adsets.length? kids.adsets : [{ id:"__none", name:"Ads", status:"", spend:0, impressions:0, reach:0, clicks:0, leads:0 }]).map(as=>{
          const ase = mEnt(Object.assign({ __level:"adset" }, as));
          const ads = kids.ads.filter(a=>a.adsetId===as.id || as.id==="__none").map(a=>mEnt(Object.assign({ __level:"ad" }, a)));
          return (as.id==="__none"?"":`<tr class="m-child adset"><td class="m-name"><span class="m-lvl">Ad set</span><span>${esc(ase.name)}</span></td>${M_COLS.slice(1).map(col=>mCell(col,ase,cu)).join("")}</tr>`)
            + ads.map(a=>`<tr class="m-child ad"><td class="m-name"><span class="m-lvl ad">Ad</span><span>${esc(a.name)}</span></td>${M_COLS.slice(1).map(col=>mCell(col,a,cu)).join("")}</tr>`).join("");
        }).join("") || `<tr class="m-child"><td colspan="${M_COLS.length}" class="m-dim">No ad sets or ads in this range.</td></tr>`;
    }
    return `<tr class="m-camp ${open?"open":""}" data-m-camp="${x.id}" tabindex="0" aria-expanded="${open}">${M_COLS.map(col=>mCell(col,x,cu)).join("")}</tr>${child}`;
  }).join("");
  return `
    <div class="meta">
      ${(()=>{ const cn = metaConn(c); return cn.cls==="bad" ? `<div class="m-note warn">${icon("info")} ${esc(cn.label)}: ${esc(cn.hint)}</div>` : ""; })()}
      <header class="m-head">
        <div class="m-head-left">
          <button class="m-btn ghost" data-m-back><span class="m-flip">${icon("arrow")}</span> Back to overview</button>
          <div class="m-client big">${mAvatar(c.name,"lg")}<div><h1>${esc(c.name)} — Ads Performance</h1><p class="m-subtitle">${(()=>{ const cn = metaConn(c); return `<span class="m-pill ${cn.cls}" title="${esc(cn.hint)}">${esc(cn.label)}</span> ${metaDelivery[c.id]?metaDeliveryChip(c,true)+" ":""}`; })()}${c.currency}${c.timezone?" · "+esc(c.timezone):""} · ad account ${c.id}${at?` · Last updated ${new Date(at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`:data&&data.snapshot?` · Snapshot from ${fmtDateShort(META_SNAPSHOT.syncedAt)}`:""}</p></div></div>
        </div>
        <div class="m-head-right">
          <a class="m-btn" href="https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${c.id}" target="_blank" rel="noopener">Open in Ads Manager ${icon("arrow")}</a>
          <button class="m-btn" data-m-refresh>${icon("upload")} Refresh</button>
        </div>
      </header>
      ${mRangeBar()}
      ${mStatusNote()}
      <section class="m-kpis">${kpis.map(([l,v,dl])=>`<div class="m-card sm"><div class="m-card-label">${l}</div><div class="m-card-value tnum">${v==null?'<span class="m-skel"></span>':v}</div><div class="m-card-foot">${dl||""}</div></div>`).join("")}</section>
      <section class="m-charts">
        ${[["Leads over time", mChart(series,{ key:"leads", type:"bar", color:"var(--m-accent)", fmt:v=>mInt(v), label:"Leads per day", empty:liveOnly })],
           ["Ad spend over time", mChart(series,{ key:"spend", type:"line", color:"#0f766e", fmt:v=>mMoney(v,cu,0), label:"Spend per day", empty:liveOnly })],
           ["Cost per lead over time", mChart(series,{ key:"cpl", type:"line", color:"#b45309", fmt:v=>mMoney(v,cu,0), label:"Cost per lead per day", empty:liveOnly })],
           ["Leads vs spend", mChart(series,{ key:"leads", type:"bar", color:"var(--m-accent)", fmt:v=>mInt(v), label:"Leads and spend per day", empty:liveOnly, dual:{ key:"spend", color:"#0f766e", fmt:v=>mMoney(v,cu,0) } })]]
          .map(([t,svg],i)=>`<div class="m-panel m-chart-card"><div class="m-panel-head"><h3>${t}</h3>${i===3?`<span class="m-legend"><i style="background:var(--m-accent)"></i>Leads <i style="background:#0f766e"></i>Spend</span>`:""}</div>${data||series||noSource?svg:'<span class="m-skel tall"></span>'}</div>`).join("")}
      </section>
      <section class="m-panel">
        <div class="m-panel-head"><h3>Campaigns</h3><span class="m-dim">${camps.length?`${camps.length} campaign${camps.length===1?"":"s"} · click a row to see ad sets and ads · click a column to sort`:""}</span></div>
        <div class="m-table-wrap"><table class="m-table m-camps">
          <thead><tr>${M_COLS.map(([k,l,t])=>`<th class="${t==="text"?"":"num"}"><button class="m-th ${sort.key===k?"on":""}" data-m-sort="${k}">${l}${sort.key===k?(sort.dir==="asc"?" ↑":" ↓"):""}</button></th>`).join("")}</tr></thead>
          <tbody>${st.campaigns? (rowsHtml ? rowsHtml+recon : `<tr><td colspan="${M_COLS.length}" class="m-empty">No campaigns in this range.</td></tr>`)
            : st.campaignsError || (data&&data.snapshot) || noSource ? `<tr><td colspan="${M_COLS.length}" class="m-empty">${esc(metaErrorText(st.campaignsError||metaError||{code:"capability_disabled"}))} Campaign details need the live connection.</td></tr>`
            : `<tr><td colspan="${M_COLS.length}"><span class="m-skel"></span></td></tr>`}</tbody>
        </table></div>
      </section>
    </div>`;
}

/* ---- Clients: add / check / remove ---- */
let mcPendingRemove = null, mcMsg = null;
function metaClientsModal(){
  openModal(`<div class="modal-head"><h3>Meta Ads clients</h3><button class="icon-btn" id="modalClose" aria-label="Close">${icon("x")}</button></div><div class="modal-body" id="mcBody"></div>`);
  document.querySelector("#modalOverlay .modal").style.maxWidth = "760px";
  document.getElementById("modalClose").onclick = ()=>{ closeModal(); metaRerender(); };
  mcRender();
  if(!metaAccounts) MetaData.accounts().then(mcRender, mcRender);
}
function mcRender(){
  const body = document.getElementById("mcBody"); if(!body) return;
  const clients = metaClients();
  const acctList = metaAccounts ? Object.values(metaAccounts).filter(a=>!clients.some(c=>c.id===String(a.ad_account_id))).sort((a,b)=>String(a.ad_account_name).localeCompare(String(b.ad_account_name))) : [];
  body.innerHTML = `
    <div class="mc-intro">Each client is one Meta ad account. Access goes through your Meta Ads connection in claude.ai, which signs in with your Facebook user. Any ad account that user can see can be added here. No tokens are stored in this page.</div>
    <table class="mc-table"><thead><tr><th>Client</th><th>Ad account</th><th>Currency</th><th>Timezone</th><th>Status</th><th></th></tr></thead><tbody>
      ${clients.map(c=>{ const cn = metaConn(c); return `<tr>
        <td><b>${esc(c.name)}</b></td><td class="tnum">${c.id}</td><td>${esc(c.currency||"—")}</td><td>${esc(c.timezone||"—")}</td>
        <td><span class="m-pill ${cn.cls}">${esc(cn.label)}</span>${cn.hint?`<div class="mc-hint">${esc(cn.hint)}</div>`:""}</td>
        <td class="mc-actions">${mcPendingRemove===c.id?`<button class="btn danger sm" data-mc-remove-yes="${c.id}">Remove</button><button class="btn ghost sm" data-mc-remove-no>Keep</button>`:`<button class="btn ghost sm" data-mc-remove="${c.id}">Disconnect</button>`}</td>
      </tr>`; }).join("") || `<tr><td colspan="6" class="cell-muted">No clients yet. Add one below.</td></tr>`}
    </tbody></table>
    <div class="mc-add">
      <h4>Add client</h4>
      <div class="form-grid">
        <div class="field"><label for="mc-name">Client name</label><input id="mc-name" placeholder="e.g. Zenith Windows" /></div>
        <div class="field"><label for="mc-id">Meta ad account ID</label><input id="mc-id" list="mc-accounts" placeholder="Numbers only, e.g. 1234567890" inputmode="numeric" />
          <datalist id="mc-accounts">${acctList.map(a=>`<option value="${a.ad_account_id}">${esc(a.ad_account_name)} · ${esc(a.currency||"")}</option>`).join("")}</datalist></div>
      </div>
      ${metaAccounts?`<div class="mc-hint">Start typing to pick from the ${acctList.length} other ad account${acctList.length===1?"":"s"} your Facebook user can see, or paste an ID from Ads Manager (the number after act=).</div>`:`<div class="mc-hint">Loading the ad accounts you can access…</div>`}
      ${mcMsg?`<div class="mc-msg ${mcMsg.ok?"ok":"bad"}">${esc(mcMsg.text)}</div>`:""}
      <div class="mc-buttons"><button class="btn primary" data-mc-add>${icon("plus")} Check access & add</button><button class="btn ghost" data-mc-recheck>Check all connections again</button></div>
    </div>
    <details class="mc-help"><summary>Reconnect, permissions and what to set up in Meta</summary>
      <p><b>Reconnect:</b> if a client shows "Reconnect Meta", open claude.ai Settings → Connectors → Meta Ads and reconnect, then press "Check all connections again".</p>
      <p><b>Giving you access to a new client:</b> in the client's Meta Business Settings → Accounts → Ad accounts, they assign your Business (or your Facebook user) as a partner with at least "View performance" access. Once accepted, the account appears in the list above.</p>
      <p><b>Statuses:</b> "Unsettled" or "Disabled" accounts can't be read until the client clears the issue in Ads Manager. "Not supported yet" means Meta hasn't switched on API access for that account yet.</p>
    </details>
    <details class="mc-help"><summary>Sync log (${metaLog.length})</summary>
      ${metaLog.length?`<ul class="mc-log">${metaLog.slice(0,20).map(e=>`<li class="${e.ok?"ok":"bad"}"><span class="tnum">${new Date(e.t).toLocaleTimeString("en-GB")}</span> ${esc((metaClients().find(c=>c.id===e.acct)||{}).name||e.acct)} · ${esc(e.what)} · ${e.ok?"ok":esc(e.code+(e.msg?": "+e.msg:""))}</li>`).join("")}</ul>`:`<p class="cell-muted">Nothing synced yet.</p>`}
    </details>`;
  body.querySelectorAll("[data-mc-remove]").forEach(el=>el.onclick = ()=>{ mcPendingRemove = el.dataset.mcRemove; mcRender(); });
  body.querySelectorAll("[data-mc-remove-no]").forEach(el=>el.onclick = ()=>{ mcPendingRemove = null; mcRender(); });
  body.querySelectorAll("[data-mc-remove-yes]").forEach(el=>el.onclick = ()=>{
    const id = el.dataset.mcRemoveYes; state.metaClients = metaClients().filter(c=>c.id!==id); save();
    Object.keys(metaState.overview).forEach(k=>{ if(k.startsWith(id+"|")) delete metaState.overview[k]; });
    mcPendingRemove = null; mcMsg = { ok:true, text:"Client removed from the dashboard. Meta access itself is unchanged." }; mcRender();
  });
  body.querySelector("[data-mc-recheck]").onclick = ()=>{ Object.keys(metaClientErr).forEach(k=>delete metaClientErr[k]); mcMsg = { ok:true, text:"Checking…" }; mcRender();
    MetaData.accounts(true).then(()=>{ mcMsg = { ok:true, text:"Connections checked." }; mcRender(); }, err=>{ mcMsg = { ok:false, text:metaErrorText(err) }; mcRender(); }); };
  body.querySelector("[data-mc-add]").onclick = async ()=>{
    const id = document.getElementById("mc-id").value.replace(/^act_/i,"").replace(/\D/g,"");
    let name = document.getElementById("mc-name").value.trim();
    if(!id){ mcMsg = { ok:false, text:"Enter the ad account ID (numbers only)." }; return mcRender(); }
    if(metaClients().some(c=>c.id===id)){ mcMsg = { ok:false, text:"That ad account is already on your dashboard." }; return mcRender(); }
    mcMsg = { ok:true, text:"Checking access with Meta…" }; mcRender();
    try{
      const map = await MetaData.accounts(true); const a = map[id];
      if(!a){ mcMsg = { ok:false, text:"Your Facebook user can't see ad account "+id+". Ask the client to give your Business partner access, then try again." }; return mcRender(); }
      if(a.is_ads_mcp_enabled===false){ mcMsg = { ok:false, text:"Meta hasn't enabled API access for this account yet: "+(a.is_ads_mcp_disabled_reason||"") }; return mcRender(); }
      name = name || String(a.ad_account_name||id);
      metaClients().push({ id, name, currency:a.currency||"GBP", timezone:null, addedAt:todayStr() }); save();
      MetaData.totals(id, metaRange().since, metaRange().until).catch(()=>{});
      mcMsg = { ok:true, text:`${name} added${a.is_queryable===false?" (Meta reports a problem with this account: "+(a.not_queryable_reason||"unknown")+")":""}. It's on your dashboard now.` };
      document.getElementById("mc-id").value = ""; document.getElementById("mc-name").value = "";
      mcRender(); metaLoadOverview();
    }catch(err){ mcMsg = { ok:false, text:metaErrorText(err) }; mcRender(); }
  };
}
function viewMeta(){
  const m = metaUI();
  if(m.view==="client"){ metaLoadClient(m.clientId); return viewMetaClient(); }
  metaLoadOverview(); return viewMetaOverview();
}
function bindMetaEvents(){
  const root = document.querySelector(".meta"); if(!root) return;
  const m = metaUI();
  const openClient = id=>{ m.view="client"; m.clientId=id; m.expanded={}; m.sort={ key:"spend", dir:"desc" }; renderView(); window.scrollTo(0,0); };
  root.querySelectorAll("[data-m-client]").forEach(el=>{
    el.addEventListener("click", ()=>openClient(el.dataset.mClient));
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openClient(el.dataset.mClient); } });
  });
  root.querySelectorAll("[data-m-client-btn]").forEach(el=>el.addEventListener("click", e=>{ e.stopPropagation(); openClient(el.dataset.mClientBtn); }));
  root.querySelectorAll("[data-m-back]").forEach(el=>el.addEventListener("click", ()=>{ m.view="overview"; renderView(); window.scrollTo(0,0); }));
  root.querySelectorAll("[data-m-range]").forEach(el=>el.addEventListener("click", ()=>{ m.range=el.dataset.mRange; m.expanded={}; renderView(); }));
  const apply = root.querySelector("[data-m-apply]");
  if(apply) apply.addEventListener("click", ()=>{ const s=document.getElementById("m-since").value, u=document.getElementById("m-until").value; if(!s||!u||s>u){ toast("Choose a start date before the end date"); return; } m.since=s; m.until=u; m.expanded={}; renderView(); });
  root.querySelectorAll("[data-m-refresh]").forEach(el=>el.addEventListener("click", ()=>{ metaRefreshCurrent(); toast("Refreshing from Meta…"); }));
  root.querySelectorAll("[data-m-clients]").forEach(el=>el.addEventListener("click", metaClientsModal));
  root.querySelectorAll("[data-m-ovsort]").forEach(el=>el.addEventListener("click", ()=>{ m.ovSort = el.dataset.mOvsort; renderView(); }));
  root.querySelectorAll("[data-m-sort]").forEach(el=>el.addEventListener("click", ()=>{
    const k = el.dataset.mSort; m.sort = m.sort.key===k ? { key:k, dir:m.sort.dir==="desc"?"asc":"desc" } : { key:k, dir:(k==="name"||k==="status")?"asc":"desc" }; renderView();
  }));
  root.querySelectorAll("[data-m-camp]").forEach(el=>{
    const toggle = ()=>{ const id = el.dataset.mCamp; m.expanded[id] = !m.expanded[id]; if(m.expanded[id]) metaLoadChildren(m.clientId, id); renderView(); };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  });
}

/* ============================= ADS ACQUISITION =============================
   Calculation layer: every summary number here is DERIVED from adsAcqLeads.
   Nothing in the Monthly/Weekly Summary or Dashboard is ever hand-entered
   except the five ad-platform inputs (Ad Spend, LP Views, Paid Trials,
   Full Package, Revenue) that have no lead-level equivalent. */
const SECOND_CALL_OUTCOMES = ["N/A","Main offer closed","Special Payment","Deposit","Follow up","Offer & Didn't Buy","Rescheduled","No-Show","Cancelled","Bad Fit / No Offer"];
function aaMonthKey(dateStr){ return dateStr.slice(0,7); }
function aaAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function aaLeadsForMonth(mk){ return state.adsAcqLeads.filter(l=>aaMonthKey(l.date)===mk); }
function aaMonthlyInput(mk){ return Object.assign({ adSpend:0, lpViews:0, paidTrials:0, fullPackage:0, revenue:0 }, state.adsAcqMonthly[mk]||{}); }
function aaSetMonthlyInput(mk, patch){ state.adsAcqMonthly[mk] = Object.assign(aaMonthlyInput(mk), patch); save(); }
function fmtRate(v, digits=0){ return (v===null||v===undefined||!isFinite(v)) ? "—" : v.toFixed(digits)+"%"; }
function safeRatio(num, den){ return den ? num/den*100 : null; }
function safeDivRaw(num, den){ return den ? num/den : null; }

function calcSalesMetrics(leads){
  const bookings = leads.length;
  const cancellations = leads.filter(l=>l.outcome==="Cancelled").length;
  const noShows = leads.filter(l=>l.outcome==="No-Show").length;
  const reschedules = leads.filter(l=>l.outcome==="Rescheduled").length;
  const liveCalls = leads.filter(l=>SHOWED_OUTCOMES.includes(l.outcome)).length;
  const closedDeals = leads.filter(l=>CLOSED_OUTCOMES.includes(l.outcome)).length;
  const offersReceived = leads.filter(l=>l.offerMade).length;
  const cashCollected = leads.filter(l=>CLOSED_OUTCOMES.includes(l.outcome)).reduce((a,l)=>a+(Number(l.cash)||0),0);
  const followUpsOpen = leads.filter(l=>l.outcome==="Follow up").length;
  return {
    bookings, liveCalls, cancellations, noShows, reschedules, closedDeals, cashCollected, followUpsOpen, offersReceived,
    showRate: safeRatio(liveCalls, bookings),
    cancellationRate: safeRatio(cancellations, bookings),
    showUpRate: safeRatio(liveCalls, bookings-cancellations),
    closeRate: safeRatio(closedDeals, liveCalls),
    offerToCloseRate: safeRatio(closedDeals, offersReceived),
  };
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return localDateStr(d);
}
function mondayOnOrBefore(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0?-6:1-day));
  return localDateStr(d);
}
function weeksForMonth(mk){
  const [y,m] = mk.split("-").map(Number);
  const lastDayNum = new Date(y,m,0).getDate();
  const monthEnd = `${mk}-${String(lastDayNum).padStart(2,"0")}`;
  let cursor = mondayOnOrBefore(`${mk}-01`);
  const weeks = [];
  let idx=1;
  while(cursor <= monthEnd){
    weeks.push({ n: idx, start: cursor, end: addDays(cursor,6) });
    cursor = addDays(cursor, 7);
    idx++;
  }
  return weeks;
}
function aaMonthClosers(mk){ return Array.from(new Set(aaLeadsForMonth(mk).map(l=>l.closerName).filter(Boolean))).sort(); }
function aaFilteredSortedLeads(mk){
  const f = uiState.aaFilters;
  const weeks = weeksForMonth(mk);
  let rows = aaLeadsForMonth(mk).filter(l=>{
    if(f.closer!=="all" && l.closerName!==f.closer) return false;
    if(f.outcome!=="all" && l.outcome!==f.outcome) return false;
    if(f.offer!=="all" && String(!!l.offerMade)!==f.offer) return false;
    if(f.closedPitched!=="all" && String(!!l.offerClosedPitched)!==f.closedPitched) return false;
    if(f.week!=="all"){
      const wk = weeks.find(w=>l.date>=w.start && l.date<=w.end);
      if(!wk || String(wk.n)!==f.week) return false;
    }
    if(f.search && !l.leadName.toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  });
  rows.sort((a,b)=>{
    let av=a[f.sortBy], bv=b[f.sortBy];
    if(f.sortBy==="cash"){ av=Number(av)||0; bv=Number(bv)||0; }
    else { av=String(av||"").toLowerCase(); bv=String(bv||"").toLowerCase(); }
    const cmp = av<bv?-1:av>bv?1:0;
    return f.sortDir==="asc"?cmp:-cmp;
  });
  return rows;
}

function aaCalcDashboardRow(mk){
  const leads = aaLeadsForMonth(mk);
  const s = calcSalesMetrics(leads);
  const inp = aaMonthlyInput(mk);
  const newPayingClients = s.closedDeals;
  const lpPct = safeRatio(leads.length, inp.lpViews);
  const cpl = safeDivRaw(inp.adSpend, leads.length);
  const vcrPct = safeRatio(s.bookings, leads.length);
  const cpss = safeDivRaw(inp.adSpend, s.bookings);
  const supPct = safeRatio(s.liveCalls, s.bookings);
  const cpssT = safeDivRaw(inp.adSpend, s.liveCalls);
  const ccPct = safeRatio(newPayingClients, s.liveCalls);
  const lcPct = safeRatio(newPayingClients, leads.length);
  const cpft = safeDivRaw(inp.adSpend, (inp.paidTrials+inp.fullPackage));
  const cpa = safeDivRaw(inp.adSpend, newPayingClients);
  const rpl = inp.revenue - inp.adSpend;
  const cashPL = s.cashCollected - inp.adSpend;
  const rroi = inp.adSpend ? rpl/inp.adSpend*100 : null;
  const croi = inp.adSpend ? cashPL/inp.adSpend*100 : null;
  return {
    mk, adSpend:inp.adSpend, leads:leads.length, lpViews:inp.lpViews, lpPct, cpl,
    callsBooked:s.bookings, vcrPct, cpss, callsTaken:s.liveCalls, supPct, cpssT,
    paidTrials:inp.paidTrials, fullPackage:inp.fullPackage, newPayingClients, ccPct, lcPct, cpft,
    revenue:inp.revenue, newCashCollected:s.cashCollected, cpa, rpl, cashPL, rroi, croi,
    hasActivity: leads.length>0 || inp.adSpend>0,
  };
}

function aaDashCell(col, row){
  const v = row[col.key];
  if(col.editable){
    return `<td class="num"><input type="number" min="0" class="aa-inline-input" value="${v||""}" data-aa-monthly-input="${row.mk}|${col.key}" /></td>`;
  }
  if(!row.hasActivity && (v===0||v===null)) return `<td class="num cell-muted">—</td>`;
  if(col.pct) return `<td class="num tnum">${fmtRate(v)}</td>`;
  if(col.moneyRate) return `<td class="num tnum">${v===null?"—":fmtMoney(v)}</td>`;
  if(col.money) return `<td class="num tnum">${fmtMoney(v)}</td>`;
  return `<td class="num tnum">${fmtNum(v)}</td>`;
}
function renderAADashboard(months){
  const rows = months.map(mk=>aaCalcDashboardRow(mk));
  const totals = { mk:"Total", hasActivity: rows.some(r=>r.hasActivity) };
  ["adSpend","leads","lpViews","callsBooked","callsTaken","paidTrials","fullPackage","newPayingClients","revenue","newCashCollected"].forEach(k=>{
    totals[k] = rows.reduce((a,r)=>a+(r[k]||0),0);
  });
  totals.lpPct = safeRatio(totals.leads, totals.lpViews);
  totals.cpl = safeDivRaw(totals.adSpend, totals.leads);
  totals.vcrPct = safeRatio(totals.callsBooked, totals.leads);
  totals.cpss = safeDivRaw(totals.adSpend, totals.callsBooked);
  totals.supPct = safeRatio(totals.callsTaken, totals.callsBooked);
  totals.cpssT = safeDivRaw(totals.adSpend, totals.callsTaken);
  totals.ccPct = safeRatio(totals.newPayingClients, totals.callsTaken);
  totals.lcPct = safeRatio(totals.newPayingClients, totals.leads);
  totals.cpft = safeDivRaw(totals.adSpend, totals.paidTrials+totals.fullPackage);
  totals.cpa = safeDivRaw(totals.adSpend, totals.newPayingClients);
  totals.rpl = totals.revenue - totals.adSpend;
  totals.cashPL = totals.newCashCollected - totals.adSpend;
  totals.rroi = totals.adSpend? totals.rpl/totals.adSpend*100 : null;
  totals.croi = totals.adSpend? totals.cashPL/totals.adSpend*100 : null;

  return `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Dashboard</h3><div class="sub">Ad performance across all months of ${todayStr().slice(0,4)} · Leads, Calls Booked, Calls Taken, New Paying Clients & New Cash Collected are pulled automatically from each month's lead table</div></div>

        <table>
          <thead><tr><th>Month</th>${AA_DASHBOARD_COLS.map(c=>`<th class="num">${c.label}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td><b>${b2bMonthLabel(r.mk)}</b></td>${AA_DASHBOARD_COLS.map(c=>aaDashCell(c,r)).join("")}</tr>`).join("")}
            <tr class="row-total"><td>Total</td>${AA_DASHBOARD_COLS.map(c=>c.editable?`<td class="num tnum">${c.money?fmtMoney(totals[c.key]):fmtNum(totals[c.key])}</td>`:aaDashCell(c,totals)).join("")}</tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ============================= FITNESS ============================= */
function fitMonthKey(dateStr){ return dateStr.slice(0,7); }
function fitAvailableMonths(){
  const year = todayStr().slice(0,4);
  const out = [];
  for(let m=1;m<=12;m++) out.push(year+"-"+String(m).padStart(2,"0"));
  return out;
}
function fitEntriesForMonth(mk){ return state.fitnessLog.filter(r=>fitMonthKey(r.date)===mk); }
function fitCalcMetrics(entries){
  const daysLogged = entries.length;
  const withCal = entries.filter(e=>e.calories);
  const totalCalories = sum(entries,"calories");
  const avgCalories = withCal.length ? totalCalories/withCal.length : null;
  const withProtein = entries.filter(e=>e.protein);
  const avgProtein = withProtein.length ? sum(entries,"protein")/withProtein.length : null;
  const withWeight = entries.filter(e=>e.weight).slice().sort((a,b)=>a.date<b.date?-1:1);
  const startWeight = withWeight.length ? Number(withWeight[0].weight) : null;
  const endWeight = withWeight.length ? Number(withWeight[withWeight.length-1].weight) : null;
  const weightChange = (startWeight!==null && endWeight!==null) ? endWeight-startWeight : null;
  const avgWeight = withWeight.length ? withWeight.reduce((a,e)=>a+Number(e.weight),0)/withWeight.length : null;
  return { daysLogged, totalCalories, avgCalories, avgProtein, startWeight, endWeight, weightChange, avgWeight };
}
function fmtWeight(v, unit){ return (v===null||v===undefined) ? "—" : v.toFixed(1)+" "+unit; }
function fmtWeightSigned(v, unit){ return (v===null||v===undefined) ? "—" : (v>0?"+":"")+v.toFixed(1)+" "+unit; }
function viewFitness(){
  const months = fitAvailableMonths();
  const curMonth = todayStr().slice(0,7);
  if(uiState.fitTab!=="dashboard" && !months.includes(uiState.fitTab)) uiState.fitTab = curMonth;
  const activeTab = uiState.fitTab;
  const allSorted = state.fitnessLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const latest = allSorted[allSorted.length-1];

  const tabsHtml = `
    <div class="b2b-tabbar">
      <button class="b2b-tab ${activeTab==='dashboard'?'active':''}" data-fit-tab="dashboard">${icon("briefcase")} Dashboard</button>
      ${months.map(mk=>`<button class="b2b-tab ${activeTab===mk?'active':''}" data-fit-tab="${mk}">${b2bMonthLabel(mk)}${mk===curMonth?'<span class="tab-dot"></span>':''}</button>`).join("")}
    </div>`;

  return `
    <div class="topbar">
      <div>
        <h1>Fitness Tracker</h1>
        <div class="sub">${latest? `latest: ${fmtDateShort(latest.date)}` : "no entries yet"}</div>
      </div>
      <div class="topbar-right">
        ${activeTab!=="dashboard"?`<button class="btn primary" data-open="fitEntry">${icon("plus")} Log today</button>`:""}
      </div>
    </div>
    <div class="content">
      ${activeTab==="dashboard" ? renderFitDashboard(months) : renderFitMonth(activeTab)}
      ${tabsHtml}
    </div>
  `;
}
function renderFitMonth(mk){
  const unit = state.settings.weightUnit;
  const entries = fitEntriesForMonth(mk);
  const m = fitCalcMetrics(entries);
  const weeks = weeksForMonth(mk);
  const weekRows = weeks.map(w=>({ w, m: fitCalcMetrics(entries.filter(e=>e.date>=w.start && e.date<=w.end)) }));
  const dailyRows = entries.slice().sort((a,b)=>a.date<b.date?1:-1);
  const sheetRows = entries.filter(r=>r.fromSheet).length;

  const [y,mm] = mk.split("-").map(Number);
  const lastDay = new Date(y,mm,0).getDate();
  const weightVals=[], calVals=[];
  for(let d=1; d<=lastDay; d++){
    const ds = `${mk}-${String(d).padStart(2,"0")}`;
    const e = state.fitnessLog.find(r=>r.date===ds);
    weightVals.push(e && e.weight ? Number(e.weight) : null);
    calVals.push(e && e.calories ? Number(e.calories) : 0);
  }

  return `
    <div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge good">${icon("check")} google sheet</span>
        <div>

          <div class="sub" style="margin-top:1px">Last pulled ${fmtDateLong(SHEET_SYNCED_AT)} · ${sheetRows} of ${entries.length} entries this month came from the sheet · syncs automatically from the sheet each time you open the Cockpit</div>
        </div>
      </div>
      <a class="btn ghost sm" href="${SHEET_SOURCE_URL}" target="_blank" rel="noopener">Open sheet</a>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Monthly summary</h3><div class="sub">${b2bMonthLabel(mk)} — calculated live from the daily log below</div></div></div>
      <div class="grid cols-4" style="margin-bottom:0">
        ${aaMetricCard("Days logged", fmtNum(m.daysLogged))}
        ${aaMetricCard("Total calories", fmtNum(m.totalCalories))}
        ${aaMetricCard("Avg calories/day", m.avgCalories===null?"—":fmtNum(Math.round(m.avgCalories)))}
        ${aaMetricCard("Avg protein/day", m.avgProtein===null?"—":fmtNum(Math.round(m.avgProtein))+"g")}
        ${aaMetricCard("Start weight", fmtWeight(m.startWeight, unit))}
        ${aaMetricCard("End weight", fmtWeight(m.endWeight, unit))}
        ${aaMetricCard("Weight change", fmtWeightSigned(m.weightChange, unit))}
        ${aaMetricCard("Avg weight", fmtWeight(m.avgWeight, unit))}
      </div>
    </div>

    <div class="panel" style="margin-bottom:12px">
      <div class="panel-head"><div><h3>Weekly summary</h3><div class="sub">${b2bMonthLabel(mk)} — Monday–Sunday weeks touching this month</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Week</th><th class="num">Days logged</th><th class="num">Total calories</th><th class="num">Avg cal/day</th><th class="num">Avg protein</th><th class="num">Start weight</th><th class="num">End weight</th><th class="num">Weight change</th></tr></thead>
          <tbody>
            ${weekRows.map(({w,m})=>`
              <tr>
                <td>Week ${w.n} <span class="cell-muted">${fmtDateShort(w.start)}–${fmtDateShort(w.end)}</span></td>
                <td class="num tnum">${fmtNum(m.daysLogged)}</td>
                <td class="num tnum">${m.totalCalories?fmtNum(m.totalCalories):"—"}</td>
                <td class="num tnum">${m.avgCalories===null?"—":fmtNum(Math.round(m.avgCalories))}</td>
                <td class="num tnum">${m.avgProtein===null?"—":fmtNum(Math.round(m.avgProtein))+"g"}</td>
                <td class="num tnum">${m.startWeight===null?"—":m.startWeight.toFixed(1)}</td>
                <td class="num tnum">${m.endWeight===null?"—":m.endWeight.toFixed(1)}</td>

          <thead><tr><th>Date</th><th class="num">Weight (${unit})</th><th class="num">Calories</th><th class="num">Protein</th><th>Food</th><th></th></tr></thead>
          <tbody>
            ${dailyRows.length? dailyRows.map(r=>`

                <td class="num tnum">${r.weight?Number(r.weight).toFixed(1):"—"}</td>
                <td class="num tnum">${r.calories?fmtNum(r.calories):"—"}</td>
                <td class="num tnum">${r.protein?fmtNum(r.protein)+"g":"—"}</td>
                <td class="cell-muted" style="white-space:normal;max-width:320px">${r.foods||"—"}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" data-edit-fit="${r.id}">${icon("edit")}</button>

          </tbody>
        </table>
      </div>
    </div>
